":"SELECT col1, col2, col3 FROM cats;","kind":"query","q":"Return the name, colour and city of every cat (in that order).","pattern":"","sql":"SELECT name, colour, city FROM cats","check":"","must":[],"solution":"SELECT name, colour, city FROM cats"},{"id":"sql.0.0.4","hint":"SELECT DISTINCT column FROM cats;","kind":"query","q":"DISTINCT removes repeated rows: SELECT DISTINCT col FROM table. Return each cat colour once.","pattern":"","sql":"SELECT DISTINCT colour FROM cats","check":"","must":[],"solution":"SELECT DISTINCT colour FROM cats"}]},{"title":"WHERE","teach":{"text":"WHERE keeps only the rows where the condition is true. Text goes in single quotes, numbers don't. \u003c> means \"not equal\", and BETWEEN a AND b includes both ends.","code":"SELECT name FROM cats\nWHERE colour = 'white';        -- text in quotes\n-- Mia, Bella, Zia\n\nSELECT name FROM cats\nWHERE age BETWEEN 2 AND 5;     -- 2 and 5 both count\n-- Luna, Bella, Simba, Mimi"},"ex":[{"id":"sql.0.1.0","hint":"SELECT * FROM cats WHERE age > …;","kind":"query","q":"WHERE keeps only matching rows: SELECT * FROM cats WHERE age > 3. Return every column of the cats older than 5.","pattern":"","sql":"SELECT * FROM cats WHERE age > 5","check":"","must":[],"solution":"SELECT * FROM cats WHERE age > 5"},{"id":"sql.0.1.1","hint":"SELECT name FROM cats WHERE colour = '…';","kind":"query","q":"Text values go in single quotes: WHERE colour = 'white'. Return the names of the white cats (colour 'white').","pattern":"","sql":"SELECT name FROM cats WHERE colour = 'white'","check":"","must":[],"solution":"SELECT name FROM cats WHERE colour = 'white'"},{"id":"sql.0.1.2","hint":"WHERE city = '…'","kind":"query","q":"Return every column of the cats living in 'Milan'.","pattern":"","sql":"SELECT * FROM cats WHERE city = 'Milan'","check":"","must":[],"solution":"SELECT * FROM cats WHERE city = 'Milan'"},{"id":"sql.0.1.3","hint":"WHERE colour \u003c> '…'","kind":"query","q":"\u003c> (or !=) means \"not equal\". Return the names of cats whose colour is not 'orange'.","pattern":"","sql":"SELECT name FROM cats WHERE colour \u003c> 'orange'","check":"","must":[],"solution":"SELECT name FROM cats WHERE colour \u003c> 'orange'"},{"id":"sql.0.1.4","hint":"WHERE age BETWEEN … AND …","kind":"query","q":"BETWEEN a AND b includes both ends. Return the names of cats aged 2 to 5 inclusive.","pattern":"","sql":"SELECT name FROM cats WHERE age BETWEEN 2 AND 5","check":"","must":[],"solution":"SELECT name FROM cats WHERE age BETWEEN 2 AND 5"}]},{"title":"AND, OR, LIKE","teach":{"text":"AND needs both conditions, OR needs either; IN (…) is a short OR list. LIKE matches patterns: % is any run of characters, _ exactly one. NULL is tested with IS NULL — \"= NULL\" never matches.","code":"SELECT name FROM cats\nWHERE colour = 'white' AND age > 2;   -- Bella, Zia\n\nSELECT name FROM cats WHERE name LIKE 'M%';    -- Milo, Mia, Mimi\nSELECT name FROM cats WHERE name LIKE '_ia';   -- Mia, Zia\nSELECT name FROM cats WHERE city IS NULL;      -- Simba"},"ex":[{"id":"sql.0.2.0","hint":"WHERE colour = '…' AND age > …","kind":"query","q":"Combine conditions with AND / OR: WHERE a = 'x' AND b > 2. Return the names of white cats older than 2.","pattern":"","sql":"SELECT name FROM cats WHERE colour = 'white' AND age > 2","check":"","must":[],"solution":"SELECT name FROM cats WHERE colour = 'white' AND age > 2"},{"id":"sql.0.2.1","hint":"WHERE name LIKE '…%'","kind":"query","q":"LIKE 'M%' matches text starting with M (% = any number of characters). Return the names of cats whose name starts with 'M'.","pattern":"","sql":"SELECT name FROM cats WHERE name LIKE 'M%'","check":"","must":[],"solution":"SELECT name FROM cats WHERE name LIKE 'M%'"},{"id":"sql.0.2.2","hint":"WHERE name LIKE '_…'","kind":"query","q":"_ matches exactly one character. Return the names of cats whose name is 3 letters long and ends in 'ia'.","pattern":"","sql":"SELECT name FROM cats WHERE name LIKE '_ia'","check":"","must":[],"solution":"SELECT name FROM cats WHERE name LIKE '_ia'"},{"id":"sql.0.2.3","hint":"WHERE city IN ('…', '…')","kind":"query","q":"IN (…) matches any value in a list. Return the names of cats living in 'Rome' or 'Milan'.","pattern":"","sql":"SELECT name FROM cats WHERE city IN ('Rome', 'Milan')","check":"","must":[],"solution":"SELECT name FROM cats WHERE city IN ('Rome', 'Milan')"},{"id":"sql.0.2.4","hint":"WHERE column IS NULL","kind":"query","q":"A missing value is NULL, and you test it with IS NULL (never = NULL). Return the names of cats with no recorded city.","pattern":"","sql":"SELECT name FROM cats WHERE city IS NULL","check":"","must":[],"solution":"SELECT name FROM cats WHERE city IS NULL"}]},{"title":"ORDER BY & LIMIT","teach":{"text":"ORDER BY sorts the result: ascending (ASC) by default, DESC for high-to-low; list several columns to break ties. LIMIT n keeps the first n rows, so it only makes sense after an ORDER BY.","code":"SELECT name, age FROM cats\nWHERE city = 'Milan'\nORDER BY age DESC     -- oldest first\nLIMIT 2;              -- keep 2 rows\n-- Mimi | 4\n-- Luna | 3"},"ex":[{"id":"sql.0.3.0","hint":"SELECT … FROM cats ORDER BY age DESC;","kind":"query","q":"ORDER BY col DESC sorts from high to low. Return the names of all cats, oldest first.","pattern":"","sql":"SELECT name FROM cats ORDER BY age DESC","check":"","must":[],"solution":"SELECT name FROM cats ORDER BY age DESC"},{"id":"sql.0.3.1","hint":"ORDER BY sorts ascending by default.","kind":"query","q":"Return the name and age of all cats, youngest first.","pattern":"","sql":"SELECT name, age FROM cats ORDER BY age","check":"","must":[],"solution":"SELECT name, age FROM cats ORDER BY age"},{"id":"sql.0.3.2","hint":"… ORDER BY … DESC LIMIT 3;","kind":"query","q":"LIMIT n keeps only the first n rows. Return the names of the 3 oldest cats.","pattern":"","sql":"SELECT name FROM cats ORDER BY age DESC LIMIT 3","check":"","must":[],"solution":"SELECT name FROM cats ORDER BY age DESC LIMIT 3"},{"id":"sql.0.3.3","hint":"SELECT … FROM … WHERE … ORDER BY … LIMIT …;","kind":"query","q":"Return the name of the youngest cat living in 'Rome'.","pattern":"","sql":"SELECT name FROM cats WHERE city = 'Rome' ORDER BY age LIMIT 1","check":"","must":[],"solution":"SELECT name FROM cats WHERE city = 'Rome' ORDER BY age LIMIT 1"},{"id":"sql.0.3.4","hint":"ORDER BY first_column, second_column","kind":"query","q":"Return the names of all cats sorted by colour A–Z, and by name A–Z within the same colour.","pattern":"","sql":"SELECT name FROM cats ORDER BY colour, name","check":"","must":[],"solution":"SELECT name FROM cats ORDER BY colour, name"}]},{"title":"mission: the cat census","teach":{"text":"Put the whole unit together: SELECT the columns, WHERE to filter (AND, OR, IN, LIKE, IS NULL), then ORDER BY and LIMIT. Careful: AND binds tighter than OR, so wrap an OR in parentheses when it should be checked first.","code":"SELECT name, age FROM cats\nWHERE (colour = 'black' OR colour = 'white')  -- brackets: the OR first\n  AND age > 4\nORDER BY age DESC\nLIMIT 2;\n-- Nala | 9\n-- Zia  | 8"},"ex":[{"id":"sql.0.4.n1","hint":"WHERE city IN (…) AND age > … ORDER BY … DESC","kind":"query","q":"Return the name and age of the cats living in 'Milan' or 'Rome' that are older than 3, oldest first.","pattern":"","sql":"SELECT name, age FROM cats WHERE city IN ('Milan', 'Rome') AND age > 3 ORDER BY age DESC","check":"","must":[],"solution":"SELECT name, age FROM cats WHERE city IN ('Milan', 'Rome') AND age > 3 ORDER BY age DESC"},{"id":"sql.0.4.n2","hint":"DISTINCT + LIKE '%…%' + ORDER BY","kind":"query","q":"Return each colour (once) of the cats whose name contains the letter 'i', sorted A–Z.","pattern":"","sql":"SELECT DISTINCT colour FROM cats WHERE name LIKE '%i%' ORDER BY colour","check":"","must":[],"solution":"SELECT DISTINCT colour FROM cats WHERE name LIKE '%i%' ORDER BY colour"},{"id":"sql.0.4.n3","hint":"WHERE … \u003c> … ORDER BY … DESC LIMIT …","kind":"query","q":"Return the names of the 2 heaviest cats that are not 'orange'.","pattern":"","sql":"SELECT name FROM cats WHERE colour \u003c> 'orange' ORDER BY weight DESC LIMIT 2","check":"","must":[],"solution":"SELECT name FROM cats WHERE colour \u003c> 'orange' ORDER BY weight DESC LIMIT 2"},{"id":"sql.0.4.n4","hint":"… OR weight IS NULL ORDER BY name","kind":"query","q":"Return the names of the cats that live in 'Naples' or have no recorded weight, sorted A–Z.","pattern":"","sql":"SELECT name FROM cats WHERE city = 'Naples' OR weight IS NULL ORDER BY name","check":"","must":[],"solution":"SELECT name FROM cats WHERE city = 'Naples' OR weight IS NULL ORDER BY name"},{"id":"sql.0.4.n5","hint":"Wrap the OR in parentheses (or use IN).","kind":"query","q":"Return the names of the cats that are 'black' or 'white' AND older than 4. (AND binds tighter than OR!)","pattern":"","sql":"SELECT name FROM cats WHERE (colour = 'black' OR colour = 'white') AND age > 4","check":"","must":[],"solution":"SELECT name FROM cats WHERE (colour = 'black' OR colour = 'white') AND age > 4"}]}]},{"title":"Counting & Grouping","lessons":[{"title":"aggregates","teach":{"text":"Aggregates squash many rows into one value: COUNT, SUM, AVG, MIN, MAX. COUNT(*) counts rows, but COUNT(col) — like SUM and AVG — skips NULLs. A WHERE runs first, so it decides which rows get squashed.","code":"SELECT COUNT(*), COUNT(weight), MAX(age)\nFROM cats;\n-- 12 | 11 | 12   (one cat has no weight)\n\nSELECT AVG(cost) FROM visits WHERE cat_id = 1;\n-- 31.67"},"ex":[{"id":"sql.1.0.0","hint":"SELECT COUNT(*) FROM cats;","kind":"query","q":"COUNT(*) counts rows: SELECT COUNT(*) FROM table. How many cats are there? Write the query.","pattern":"","sql":"SELECT COUNT(*) FROM cats","check":"","must":[],"solution":"SELECT COUNT(*) FROM cats"},{"id":"sql.1.0.1","hint":"SELECT AVG(column) FROM cats;","kind":"query","q":"AVG(col) gives the average. Return the average age of all cats.","pattern":"","sql":"SELECT AVG(age) FROM cats","check":"","must":[],"solution":"SELECT AVG(age) FROM cats"},{"id":"sql.1.0.2","hint":"SELECT MAX(column) FROM cats;","kind":"query","q":"MAX(col) gives the largest value (MIN the smallest). Return the oldest age in the cats table.","pattern":"","sql":"SELECT MAX(age) FROM cats","check":"","must":[],"solution":"SELECT MAX(age) FROM cats"},{"id":"sql.1.0.3","hint":"SELECT COUNT(column) FROM cats;","kind":"query","q":"COUNT(col) skips NULLs, unlike COUNT(*). Return how many cats have an owner, by counting the owner_id column.","pattern":"","sql":"SELECT COUNT(owner_id) FROM cats","check":"","must":[],"solution":"SELECT COUNT(owner_id) FROM cats"},{"id":"sql.1.0.4","hint":"SELECT SUM(column) FROM cats WHERE …;","kind":"query","q":"Return the total (sum) weight of all 'white' cats.","pattern":"","sql":"SELECT SUM(weight) FROM cats WHERE colour = 'white'","check":"","must":[],"solution":"SELECT SUM(weight) FROM cats WHERE colour = 'white'"}]},{"title":"GROUP BY","teach":{"text":"GROUP BY splits rows into groups and runs the aggregate once per group. WHERE filters rows BEFORE grouping; HAVING filters whole groups AFTER. AS names a column so you can ORDER BY it.","code":"SELECT city, COUNT(*) AS n\nFROM cats\nWHERE age > 1          -- rows first\nGROUP BY city\nHAVING COUNT(*) >= 2   -- then groups\nORDER BY n DESC, city;\n-- Rome  | 3\n-- Milan | 2\n-- Turin | 2"},"ex":[{"id":"sql.1.1.0","hint":"SELECT colour, COUNT(*) FROM cats GROUP BY …;","kind":"query","q":"GROUP BY gives one row per group: SELECT city, COUNT(*) FROM cats GROUP BY city. Return each colour and how many cats have it.","pattern":"","sql":"SELECT colour, COUNT(*) FROM cats GROUP BY colour","check":"","must":[],"solution":"SELECT colour, COUNT(*) FROM cats GROUP BY colour"},{"id":"sql.1.1.1","hint":"SELECT city, AVG(…) FROM cats GROUP BY …;","kind":"query","q":"Return each city (including the NULL group) and the average age of its cats.","pattern":"","sql":"SELECT city, AVG(age) FROM cats GROUP BY city","check":"","must":[],"solution":"SELECT city, AVG(age) FROM cats GROUP BY city"},{"id":"sql.1.1.2","hint":"… GROUP BY colour HAVING COUNT(*) > …","kind":"query","q":"HAVING filters groups after grouping: … GROUP BY city HAVING COUNT(*) > 2. Return just the colours shared by more than 2 cats.","pattern":"","sql":"SELECT colour FROM cats GROUP BY colour HAVING COUNT(*) > 2","check":"","must":[],"solution":"SELECT colour FROM cats GROUP BY colour HAVING COUNT(*) > 2"},{"id":"sql.1.1.3","hint":"… GROUP BY city ORDER BY n DESC, city;","kind":"query","q":"AS names a column: COUNT(*) AS n, and you can ORDER BY n. Return each city with its number of cats as n, most cats first, ties broken by city A–Z.","pattern":"","sql":"SELECT city, COUNT(*) AS n FROM cats GROUP BY city ORDER BY n DESC, city","check":"","must":[],"solution":"SELECT city, COUNT(*) AS n FROM cats GROUP BY city ORDER BY n DESC, city"},{"id":"sql.1.1.4","hint":"SELECT … FROM … WHERE … GROUP BY … ORDER BY … DESC;","kind":"query","q":"Only counting cats older than 1, return each colour and its average weight, highest average first.","pattern":"","sql":"SELECT colour, AVG(weight) AS w FROM cats WHERE age > 1 GROUP BY colour ORDER BY w DESC","check":"","must":[],"solution":"SELECT colour, AVG(weight) AS w FROM cats WHERE age > 1 GROUP BY colour ORDER BY w DESC"}]},{"title":"changing data","teach":{"text":"INSERT adds rows, UPDATE changes them, DELETE removes them — and UPDATE/DELETE without a WHERE hit EVERY row. CREATE TABLE makes a new table; DROP TABLE removes the table itself, not just its rows.","code":"INSERT INTO cats (name, age) VALUES ('Kiki', 2);  -- other columns NULL\nUPDATE cats SET age = age + 1 WHERE name = 'Kiki';\nDELETE FROM cats WHERE name = 'Kiki';\n\nCREATE TABLE toys (id INTEGER, name TEXT);\nDROP TABLE toys;"},"ex":[{"id":"sql.1.2.0","hint":"INSERT INTO cats (name, age) VALUES ('…', …);","kind":"query","q":"INSERT INTO table (col1, col2) VALUES (v1, v2) adds a row. Add a cat named 'Kiki' aged 2 (leave the other columns empty).","pattern":"","sql":"INSERT INTO cats (name, age) VALUES ('Kiki', 2)","check":"SELECT id, name, age, colour, city FROM cats ORDER BY id","must":[],"solution":"INSERT INTO cats (name, age) VALUES ('Kiki', 2)"},{"id":"sql.1.2.1","hint":"UPDATE cats SET age = age + 1 WHERE …;","kind":"query","q":"UPDATE table SET col = … WHERE … changes rows. Make 'Mia' one year older.","pattern":"","sql":"UPDATE cats SET age = age + 1 WHERE name = 'Mia'","check":"SELECT id, age FROM cats ORDER BY id","must":[],"solution":"UPDATE cats SET age = age + 1 WHERE name = 'Mia'"},{"id":"sql.1.2.2","hint":"DELETE FROM cats WHERE … IS NULL;","kind":"query","q":"DELETE FROM table WHERE … removes rows (without WHERE it removes ALL rows!). Delete every cat that has no owner.","pattern":"","sql":"DELETE FROM cats WHERE owner_id IS NULL","check":"SELECT id FROM cats ORDER BY id","must":[],"solution":"DELETE FROM cats WHERE owner_id IS NULL"},{"id":"sql.1.2.3","hint":"CREATE TABLE toys (id INTEGER, name TEXT);","kind":"query","q":"CREATE TABLE name (col TYPE, …) makes a new table. Create a table toys with columns id INTEGER and name TEXT.","pattern":"","sql":"CREATE TABLE toys (id INTEGER, name TEXT)","check":"SELECT name, UPPER(type) FROM pragma_table_info('toys') ORDER BY cid","must":[],"solution":"CREATE TABLE toys (id INTEGER, name TEXT)"},{"id":"sql.1.2.4","hint":"DROP TABLE …;","kind":"query","q":"Remove the whole visits table (not just its rows).","pattern":"","sql":"DROP TABLE visits","check":"SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name","must":[],"solution":"DROP TABLE visits"}]},{"title":"mission: the vet ledger","teach":{"text":"Mix aggregates with everything from unit 1: WHERE picks the rows, GROUP BY makes the groups, HAVING keeps the good groups, ORDER BY + LIMIT pick the winners. UPDATE and DELETE use the same WHERE tricks (IN, OR, IS NULL) as SELECT.","code":"SELECT cat_id, COUNT(*) AS n\nFROM visits\nWHERE cost >= 50       -- only the bigger bills\nGROUP BY cat_id\nHAVING COUNT(*) >= 2   -- cats with 2+ of them\nORDER BY n DESC;\n-- 2 | 2\n-- 4 | 2"},"ex":[{"id":"sql.1.3.n1","hint":"WHERE … IS NOT NULL GROUP BY … HAVING … ORDER BY … DESC, …","kind":"query","q":"Return each city (skip the NULL one) with its number of cats and their average age, only for cities with at least 2 cats, most cats first then city A–Z.","pattern":"","sql":"SELECT city, COUNT(*), AVG(age) FROM cats WHERE city IS NOT NULL GROUP BY city HAVING COUNT(*) >= 2 ORDER BY COUNT(*) DESC, city","check":"","must":[],"solution":"SELECT city, COUNT(*), AVG(age) FROM cats WHERE city IS NOT NULL GROUP BY city HAVING COUNT(*) >= 2 ORDER BY COUNT(*) DESC, city"},{"id":"sql.1.3.n2","hint":"The cost test is on rows (WHERE); the \"at least 2\" is on groups (HAVING).","kind":"query","q":"Return the cat_ids that have at least 2 visits costing 50 or more, with how many such visits.","pattern":"","sql":"SELECT cat_id, COUNT(*) FROM visits WHERE cost >= 50 GROUP BY cat_id HAVING COUNT(*) >= 2","check":"","must":[],"solution":"SELECT cat_id, COUNT(*) FROM visits WHERE cost >= 50 GROUP BY cat_id HAVING COUNT(*) >= 2"},{"id":"sql.1.3.n3","hint":"UPDATE … SET cost = cost - 5 WHERE cat_id IN (…) AND …","kind":"query","q":"Give a 5 discount (cost minus 5) to every visit of cat_id 1 or 2 that cost under 50.","pattern":"","sql":"UPDATE visits SET cost = cost - 5 WHERE cat_id IN (1, 2) AND cost \u003c 50","check":"SELECT id, cost FROM visits ORDER BY id","must":[],"solution":"UPDATE visits SET cost = cost - 5 WHERE cat_id IN (1, 2) AND cost \u003c 50"},{"id":"sql.1.3.n4","hint":"DELETE FROM cats WHERE … OR … IS NULL","kind":"query","q":"Delete every cat that is 'tabby' or has no owner.","pattern":"","sql":"DELETE FROM cats WHERE colour = 'tabby' OR owner_id IS NULL","check":"SELECT id FROM cats ORDER BY id","must":[],"solution":"DELETE FROM cats WHERE colour = 'tabby' OR owner_id IS NULL"},{"id":"sql.1.3.n5","hint":"GROUP BY, then ORDER BY the aggregate DESC and LIMIT 1.","kind":"query","q":"Return just the colour whose cats have the highest average age.","pattern":"","sql":"SELECT colour FROM cats GROUP BY colour ORDER BY AVG(age) DESC LIMIT 1","check":"","must":[],"solution":"SELECT colour FROM cats GROUP BY colour ORDER BY AVG(age) DESC LIMIT 1"}]}]},{"title":"Joins","lessons":[{"title":"INNER JOIN","teach":{"text":"JOIN … ON glues each row of one table to the matching rows of another. A plain (INNER) JOIN drops rows with no match on either side. When both tables have a column with the same name, say which one you mean: c.name vs o.name.","code":"SELECT c.name, o.name\nFROM cats c                        -- c is a short alias\nJOIN owners o ON c.owner_id = o.id;  -- the matching rule\n-- Luna | Anna\n-- Milo | Bruno …\n-- (Simba and Leo have no owner, so they vanish)"},"ex":[{"id":"sql.2.0.0","hint":"SELECT … FROM cats JOIN owners ON cats.owner_id = owners.id;","kind":"query","q":"JOIN … ON pairs up matching rows from two tables. Return each cat's name with its owner's name.","pattern":"SELECT cats.name, owners.name\nFROM cats JOIN owners ON cats.owner_id = owners.id;","sql":"SELECT cats.name, owners.name FROM cats JOIN owners ON cats.owner_id = owners.id","check":"","must":[],"solution":"SELECT cats.name, owners.name FROM cats JOIN owners ON cats.owner_id = owners.id"},{"id":"sql.2.0.1","hint":"SELECT c.…, o.… FROM cats c JOIN owners o ON …;","kind":"query","q":"Aliases shorten table names: FROM cats c JOIN owners o ON c.owner_id = o.id. Return each cat's name and its owner's email.","pattern":"","sql":"SELECT c.name, o.email FROM cats c JOIN owners o ON c.owner_id = o.id","check":"","must":[],"solution":"SELECT c.name, o.email FROM cats c JOIN owners o ON c.owner_id = o.id"},{"id":"sql.2.0.2","hint":"… JOIN owners o ON … WHERE o.name = '…';","kind":"query","q":"Return the names of the cats whose owner is 'Bruno'.","pattern":"","sql":"SELECT c.name FROM cats c JOIN owners o ON c.owner_id = o.id WHERE o.name = 'Bruno'","check":"","must":[],"solution":"SELECT c.name FROM cats c JOIN owners o ON c.owner_id = o.id WHERE o.name = 'Bruno'"},{"id":"sql.2.0.3","hint":"… JOIN … ON … GROUP BY o.name;","kind":"query","q":"Return each owner's name and how many cats they have (owners with no cats may be left out).","pattern":"","sql":"SELECT o.name, COUNT(*) FROM owners o JOIN cats c ON c.owner_id = o.id GROUP BY o.id","check":"","must":[],"solution":"SELECT o.name, COUNT(*) FROM owners o JOIN cats c ON c.owner_id = o.id GROUP BY o.id"},{"id":"sql.2.0.4","hint":"SELECT * FROM cats JOIN owners ON …;","kind":"query","q":"Join cats to owners (cats.owner_id = owners.id) and return all columns. Cats without an owner should NOT appear.","pattern":"","sql":"SELECT * FROM cats JOIN owners ON cats.owner_id = owners.id","check":"","must":[],"solution":"SELECT * FROM cats JOIN owners ON cats.owner_id = owners.id"}]},{"title":"LEFT JOIN","teach":{"text":"LEFT JOIN keeps EVERY row of the left (first) table; where nothing matches, the right table's columns are NULL. So \"LEFT JOIN … WHERE right.id IS NULL\" finds rows with no match, and COUNT(right.id) gives 0 for them — COUNT(*) would give 1.","code":"SELECT o.name, COUNT(c.id)\nFROM owners o\nLEFT JOIN cats c ON c.owner_id = o.id\nGROUP BY o.id;\n-- Anna | 2 …\n-- Gina | 0   (kept, thanks to LEFT JOIN)\n-- Hugo | 0"},"ex":[{"id":"sql.2.1.0","hint":"FROM cats c LEFT JOIN owners o ON …","kind":"query","q":"LEFT JOIN keeps every row of the left table, filling NULLs where nothing matches. Return every cat's name with its owner's name — including cats with no owner.","pattern":"SELECT … FROM cats c\nLEFT JOIN owners o ON c.owner_id = o.id;","sql":"SELECT c.name, o.name FROM cats c LEFT JOIN owners o ON c.owner_id = o.id","check":"","must":[],"solution":"SELECT c.name, o.name FROM cats c LEFT JOIN owners o ON c.owner_id = o.id"},{"id":"sql.2.1.1","hint":"After a LEFT JOIN, unmatched right-side columns are NULL: … WHERE o.id IS NULL","kind":"query","q":"Use a LEFT JOIN and IS NULL to return the names of cats that have no matching owner.","pattern":"","sql":"SELECT c.name FROM cats c LEFT JOIN owners o ON c.owner_id = o.id WHERE o.id IS NULL","check":"","must":[],"solution":"SELECT c.name FROM cats c LEFT JOIN owners o ON c.owner_id = o.id WHERE o.id IS NULL"},{"id":"sql.2.1.2","hint":"COUNT(c.id) skips NULLs, COUNT(*) does not.","kind":"query","q":"Return every owner's name and how many cats they have, showing 0 for owners with no cats.","pattern":"","sql":"SELECT o.name, COUNT(c.id) FROM owners o LEFT JOIN cats c ON c.owner_id = o.id GROUP BY o.id","check":"","must":[],"solution":"SELECT o.name, COUNT(c.id) FROM owners o LEFT JOIN cats c ON c.owner_id = o.id GROUP BY o.id"},{"id":"sql.2.1.3","hint":"FROM owners o LEFT JOIN cats c ON … WHERE c.id IS NULL","kind":"query","q":"Return the names of owners who have no cats at all.","pattern":"","sql":"SELECT o.name FROM owners o LEFT JOIN cats c ON c.owner_id = o.id WHERE c.id IS NULL","check":"","must":[],"solution":"SELECT o.name FROM owners o LEFT JOIN cats c ON c.owner_id = o.id WHERE c.id IS NULL"},{"id":"sql.2.1.4","hint":"FROM cats c RIGHT JOIN owners o ON …","kind":"query","q":"RIGHT JOIN keeps every row of the RIGHT table. Starting FROM cats c RIGHT JOIN owners o, return each owner's name and their cat's name (NULL if none).","pattern":"","sql":"SELECT o.name, c.name FROM cats c RIGHT JOIN owners o ON c.owner_id = o.id","check":"","must":[],"solution":"SELECT o.name, c.name FROM cats c RIGHT JOIN owners o ON c.owner_id = o.id"}]},{"title":"subqueries","teach":{"text":"A subquery is a SELECT inside brackets that runs first. Use it where you need an aggregate in WHERE (WHERE age > (SELECT AVG(age) …)), a list for IN (…), or as a table in FROM — which then needs an alias.","code":"SELECT name FROM cats\nWHERE age > (SELECT AVG(age) FROM cats);  -- avg is 5.58\n-- Milo, Oscar, Nala, Leo, Tigger, Zia\n\nSELECT MAX(n) FROM\n  (SELECT COUNT(*) AS n FROM cats GROUP BY colour) AS t;\n-- 3"},"ex":[{"id":"sql.2.2.0","hint":"Aggregates cannot go directly in WHERE — wrap them in (SELECT …).","kind":"query","q":"A subquery in parentheses runs first: WHERE age > (SELECT AVG(age) FROM cats). Return the names of cats older than the average age.","pattern":"","sql":"SELECT name FROM cats WHERE age > (SELECT AVG(age) FROM cats)","check":"","must":[],"solution":"SELECT name FROM cats WHERE age > (SELECT AVG(age) FROM cats)"},{"id":"sql.2.2.1","hint":"WHERE owner_id IN (SELECT id FROM owners WHERE …)","kind":"query","q":"IN (SELECT …) matches any value another query returns. Return the names of cats whose owner has city_id 2, using a subquery on owners.","pattern":"","sql":"SELECT name FROM cats WHERE owner_id IN (SELECT id FROM owners WHERE city_id = 2)","check":"","must":[],"solution":"SELECT name FROM cats WHERE owner_id IN (SELECT id FROM owners WHERE city_id = 2)"},{"id":"sql.2.2.2","hint":"WHERE age = (SELECT MAX(…) FROM cats)","kind":"query","q":"Using a subquery with MAX, return the name of the oldest cat.","pattern":"","sql":"SELECT name FROM cats WHERE age = (SELECT MAX(age) FROM cats)","check":"","must":[],"solution":"SELECT name FROM cats WHERE age = (SELECT MAX(age) FROM cats)"},{"id":"sql.2.2.3","hint":"SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM … GROUP BY …) AS t;","kind":"query","q":"A subquery in FROM needs an alias: SELECT … FROM (SELECT …) AS t. Using a subquery that counts cats per city, return the largest of those counts.","pattern":"","sql":"SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM cats GROUP BY city) AS t","check":"","must":[],"solution":"SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM cats GROUP BY city) AS t"},{"id":"sql.2.2.4","hint":"WHERE weight > (SELECT MAX(weight) FROM … WHERE …)","kind":"query","q":"Return the names of cats heavier than the heaviest cat living in 'Milan'.","pattern":"","sql":"SELECT name FROM cats WHERE weight > (SELECT MAX(weight) FROM cats WHERE city = 'Milan')","check":"","must":[],"solution":"SELECT name FROM cats WHERE weight > (SELECT MAX(weight) FROM cats WHERE city = 'Milan')"}]},{"title":"many tables","teach":{"text":"Chain JOINs to walk from table to table: cats → owners → cities. UNION stacks the rows of two SELECTs with the same number of columns and removes duplicates; UNION ALL keeps them.","code":"SELECT c.name, ci.name\nFROM cats c\nJOIN owners o  ON c.owner_id = o.id\nJOIN cities ci ON o.city_id = ci.id;\n-- Luna | Milan\n-- Milo | Rome …\n\nSELECT name FROM cats WHERE age > 9\nUNION SELECT name FROM cats WHERE colour = 'grey';\n-- Oscar, Tigger, Sofia  (Oscar once)"},"ex":[{"id":"sql.2.3.0","hint":"… JOIN owners o ON … JOIN cities ci ON o.city_id = ci.id","kind":"query","q":"Chain JOINs to walk through several tables. Return each cat's name with the name of its owner's city.","pattern":"FROM cats c\nJOIN owners o ON c.owner_id = o.id\nJOIN cities ci ON o.city_id = ci.id","sql":"SELECT c.name, ci.name FROM cats c JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id","check":"","must":[],"solution":"SELECT c.name, ci.name FROM cats c JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id"},{"id":"sql.2.3.1","hint":"cats → owners → cities, then WHERE ci.region = '…'","kind":"query","q":"cats and owners both have a name column, so qualify it (c.name, o.name). Return each cat's name and its owner's name for owners living in the region 'Lazio'.","pattern":"","sql":"SELECT c.name, o.name FROM cats c JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id WHERE ci.region = 'Lazio'","check":"","must":[],"solution":"SELECT c.name, o.name FROM cats c JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id WHERE ci.region = 'Lazio'"},{"id":"sql.2.3.2","hint":"SELECT … FROM cats UNION SELECT … FROM cities;","kind":"query","q":"UNION stacks the rows of two SELECTs and removes duplicates. Return every city name that appears in cats.city or in cities.name, each once.","pattern":"","sql":"SELECT city FROM cats UNION SELECT name FROM cities","check":"","must":[],"solution":"SELECT city FROM cats UNION SELECT name FROM cities"},{"id":"sql.2.3.3","hint":"SELECT … WHERE … UNION ALL SELECT … WHERE …;","kind":"query","q":"UNION ALL keeps duplicates. Return the names of the 'white' cats followed by the names of the cats older than 7, keeping a name twice if it matches both.","pattern":"","sql":"SELECT name FROM cats WHERE colour = 'white' UNION ALL SELECT name FROM cats WHERE age > 7","check":"","must":[],"solution":"SELECT name FROM cats WHERE colour = 'white' UNION ALL SELECT name FROM cats WHERE age > 7"},{"id":"sql.2.3.4","hint":"FROM cities ci LEFT JOIN owners o ON … LEFT JOIN cats c ON … GROUP BY …","kind":"query","q":"Return every city name (from cities) with the number of cats whose owner lives there — 0 for cities with none.","pattern":"","sql":"SELECT ci.name, COUNT(c.id) FROM cities ci LEFT JOIN owners o ON o.city_id = ci.id LEFT JOIN cats c ON c.owner_id = o.id GROUP BY ci.id","check":"","must":[],"solution":"SELECT ci.name, COUNT(c.id) FROM cities ci LEFT JOIN owners o ON o.city_id = ci.id LEFT JOIN cats c ON c.owner_id = o.id GROUP BY ci.id"}]},{"title":"mission: the grand tour","teach":{"text":"Joins plus everything before: join to reach the columns you need, WHERE to filter, GROUP BY/HAVING to summarise, ORDER BY to rank. When a join could repeat a row, use DISTINCT or an IN (subquery) instead.","code":"SELECT o.name, COUNT(*) AS n\nFROM owners o\nJOIN cats c ON c.owner_id = o.id\nWHERE c.age > 4\nGROUP BY o.id\nORDER BY n DESC, o.name;\n-- Carla | 2\n-- Bruno | 1 …"},"ex":[{"id":"sql.2.4.n1","hint":"JOIN … WHERE … GROUP BY … ORDER BY n DESC, o.name","kind":"query","q":"Return each owner's name and how many of their cats are older than 4 — only owners with at least one such cat — most first, then owner name A–Z.","pattern":"","sql":"SELECT o.name, COUNT(*) AS n FROM owners o JOIN cats c ON c.owner_id = o.id WHERE c.age > 4 GROUP BY o.id ORDER BY n DESC, o.name","check":"","must":[],"solution":"SELECT o.name, COUNT(*) AS n FROM owners o JOIN cats c ON c.owner_id = o.id WHERE c.age > 4 GROUP BY o.id ORDER BY n DESC, o.name"},{"id":"sql.2.4.n2","hint":"Two LEFT JOINs: one to find the missing visits, one to fetch the owner.","kind":"query","q":"Return the name of every cat that has never had a visit, together with its owner's name (NULL if it has no owner).","pattern":"","sql":"SELECT c.name, o.name FROM cats c LEFT JOIN visits v ON v.cat_id = c.id LEFT JOIN owners o ON c.owner_id = o.id WHERE v.id IS NULL","check":"","must":[],"solution":"SELECT c.name, o.name FROM cats c LEFT JOIN visits v ON v.cat_id = c.id LEFT JOIN owners o ON c.owner_id = o.id WHERE v.id IS NULL"},{"id":"sql.2.4.n3","hint":"A join repeats a cat once per matching visit — use IN (…) or DISTINCT.","kind":"query","q":"Return the names of the cats (each once) that have at least one visit costing more than the average visit cost.","pattern":"","sql":"SELECT name FROM cats WHERE id IN (SELECT cat_id FROM visits WHERE cost > (SELECT AVG(cost) FROM visits))","check":"","must":[],"solution":"SELECT name FROM cats WHERE id IN (SELECT cat_id FROM visits WHERE cost > (SELECT AVG(cost) FROM visits))"},{"id":"sql.2.4.n4","hint":"visits → cats → owners → cities, WHERE …, ORDER BY … DESC","kind":"query","q":"Return the visit dates and costs of the cats whose owner lives in the region 'Lombardy', latest visit first.","pattern":"","sql":"SELECT v.visit_date, v.cost FROM visits v JOIN cats c ON v.cat_id = c.id JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id WHERE ci.region = 'Lombardy' ORDER BY v.visit_date DESC","check":"","must":[],"solution":"SELECT v.visit_date, v.cost FROM visits v JOIN cats c ON v.cat_id = c.id JOIN owners o ON c.owner_id = o.id JOIN cities ci ON o.city_id = ci.id WHERE ci.region = 'Lombardy' ORDER BY v.visit_date DESC"},{"id":"sql.2.4.n5","hint":"… UNION … ORDER BY 1 (one ORDER BY at the very end sorts the whole list)","kind":"query","q":"Return one list of the names of owners with no cats and the names of cats with no owner, each once, sorted A–Z.","pattern":"","sql":"SELECT o.name FROM owners o LEFT JOIN cats c ON c.owner_id = o.id WHERE c.id IS NULL UNION SELECT name FROM cats WHERE owner_id IS NULL ORDER BY 1","check":"","must":[],"solution":"SELECT o.name FROM owners o LEFT JOIN cats c ON c.owner_id = o.id WHERE c.id IS NULL UNION SELECT name FROM cats WHERE owner_id IS NULL ORDER BY 1"}]}]},{"title":"Functions & Logic","lessons":[{"title":"text functions","teach":{"text":"Text functions work on each row: UPPER/LOWER change case, LENGTH counts characters, SUBSTR(text, start, length) cuts a piece (positions start at 1), TRIM strips outer spaces, and || glues text together. Watch out: anything || NULL is NULL.","code":"SELECT UPPER(name), LENGTH(name), SUBSTR(name, 1, 2)\nFROM cats;\n-- LUNA | 4 | Lu\n-- MILO | 4 | Mi …\n\nSELECT name || ' the ' || colour FROM cats;\n-- Luna the black …"},"ex":[{"id":"sql.3.0.0","hint":"SELECT UPPER(column) FROM cats;","kind":"query","q":"UPPER(text) turns text into capitals. Return every cat's name in uppercase.","pattern":"","sql":"SELECT UPPER(name) FROM cats","check":"","must":[],"solution":"SELECT UPPER(name) FROM cats"},{"id":"sql.3.0.1","hint":"SELECT name, LENGTH(…) FROM cats;","kind":"query","q":"LENGTH(text) gives a text's length. Return each cat's name and the length of its name.","pattern":"","sql":"SELECT name, LENGTH(name) FROM cats","check":"","must":[],"solution":"SELECT name, LENGTH(name) FROM cats"},{"id":"sql.3.0.2","hint":"name || ' from ' || city — and remember NULL || text is NULL.","kind":"query","q":"|| glues text together: name || ' ' || city. For every cat that has a city, return one column like 'Luna from Milan'.","pattern":"","sql":"SELECT name || ' from ' || city FROM cats WHERE city IS NOT NULL","check":"","must":[],"solution":"SELECT name || ' from ' || city FROM cats WHERE city IS NOT NULL"},{"id":"sql.3.0.3","hint":"SUBSTR(name, 1, …)","kind":"query","q":"SUBSTR(text, start, length) cuts out a piece; positions start at 1. Return the first 3 letters of each cat's name.","pattern":"","sql":"SELECT SUBSTR(name, 1, 3) FROM cats","check":"","must":[],"solution":"SELECT SUBSTR(name, 1, 3) FROM cats"},{"id":"sql.3.0.4","hint":"SELECT TRIM(column) FROM owners;","kind":"query","q":"TRIM(text) strips spaces from both ends. One owner's email has stray spaces — return every owner's email, trimmed.","pattern":"","sql":"SELECT TRIM(email) FROM owners","check":"","must":[],"solution":"SELECT TRIM(email) FROM owners"}]},{"title":"CASE","teach":{"text":"CASE WHEN … THEN … ELSE … END picks a value per row. The WHENs are tried top to bottom and the first true one wins, so put the strictest first; with no ELSE, unmatched rows get NULL. SUM(CASE WHEN … THEN 1 ELSE 0 END) counts matching rows.","code":"SELECT name,\n  CASE WHEN age >= 10 THEN 'senior'\n       WHEN age >= 3  THEN 'adult'\n       ELSE 'young' END\nFROM cats;\n-- Luna  | adult\n-- Oscar | senior\n-- Mia   | young …"},"ex":[{"id":"sql.3.1.0","hint":"CASE WHEN age \u003c 1 THEN '…' ELSE '…' END","kind":"query","q":"CASE WHEN condition THEN x ELSE y END picks a value per row. Return each cat's name and 'kitten' if its age is under 1, otherwise 'adult'.","pattern":"","sql":"SELECT name, CASE WHEN age \u003c 1 THEN 'kitten' ELSE 'adult' END FROM cats","check":"","must":[],"solution":"SELECT name, CASE WHEN age \u003c 1 THEN 'kitten' ELSE 'adult' END FROM cats"},{"id":"sql.3.1.1","hint":"WHENs are tried top to bottom — put the strictest first.","kind":"query","q":"Return each cat's name and 'senior' if age is 10 or more, 'adult' if age is 3 or more, otherwise 'young'.","pattern":"","sql":"SELECT name, CASE WHEN age >= 10 THEN 'senior' WHEN age >= 3 THEN 'adult' ELSE 'young' END FROM cats","check":"","must":[],"solution":"SELECT name, CASE WHEN age >= 10 THEN 'senior' WHEN age >= 3 THEN 'adult' ELSE 'young' END FROM cats"},{"id":"sql.3.1.2","hint":"CASE WHEN … THEN '…' END","kind":"query","q":"With no ELSE, rows that match no WHEN get NULL. Return each cat's name and 'heavy' when its weight is over 5 — NULL otherwise.","pattern":"","sql":"SELECT name, CASE WHEN weight > 5 THEN 'heavy' END FROM cats","check":"","must":[],"solution":"SELECT name, CASE WHEN weight > 5 THEN 'heavy' END FROM cats"},{"id":"sql.3.1.3","hint":"SELECT SUM(CASE WHEN colour = '…' THEN 1 ELSE 0 END), SUM(…) FROM cats;","kind":"query","q":"SUM(CASE WHEN … THEN 1 ELSE 0 END) counts matching rows. Return one row: the number of 'white' cats, then the number of 'black' cats.","pattern":"","sql":"SELECT SUM(CASE WHEN colour = 'white' THEN 1 ELSE 0 END), SUM(CASE WHEN colour = 'black' THEN 1 ELSE 0 END) FROM cats","check":"","must":[],"solution":"SELECT SUM(CASE WHEN colour = 'white' THEN 1 ELSE 0 END), SUM(CASE WHEN colour = 'black' THEN 1 ELSE 0 END) FROM cats"},{"id":"sql.3.1.4","hint":"A WHERE would drop the cities with 0 — count with SUM(CASE …) and GROUP BY instead.","kind":"query","q":"Return each city and how many of its cats are older than 5 — cities with none must show 0.","pattern":"","sql":"SELECT city, SUM(CASE WHEN age > 5 THEN 1 ELSE 0 END) FROM cats GROUP BY city","check":"","must":[],"solution":"SELECT city, SUM(CASE WHEN age > 5 THEN 1 ELSE 0 END) FROM cats GROUP BY city"}]},{"title":"NULL handling","teach":{"text":"NULL means \"unknown\": any comparison with it (=, \u003c>, >) is neither true nor false, so WHERE quietly drops those rows. Test with IS NULL / IS NOT NULL, and swap in a stand-in value with COALESCE(x, fallback). Aggregates like AVG simply skip NULLs.","code":"SELECT name, COALESCE(city, 'unknown') FROM cats;\n-- … Simba | unknown\n\nSELECT name FROM cats WHERE city \u003c> 'Rome';\n-- Simba (city NULL) is NOT returned!\nSELECT name FROM cats WHERE city \u003c> 'Rome' OR city IS NULL;"},"ex":[{"id":"sql.3.2.0","hint":"COALESCE(city, '…')","kind":"query","q":"COALESCE(a, b) returns the first non-NULL value. Return each cat's name and its city, showing 'unknown' when the city is NULL.","pattern":"","sql":"SELECT name, COALESCE(city, 'unknown') FROM cats","check":"","must":[],"solution":"SELECT name, COALESCE(city, 'unknown') FROM cats"},{"id":"sql.3.2.1","hint":"WHERE city \u003c> '…' OR city IS NULL","kind":"query","q":"Comparisons with NULL are never true, so city \u003c> 'Rome' skips NULL cities. Return the names of all cats not in 'Rome' — including the one with no city.","pattern":"","sql":"SELECT name FROM cats WHERE city \u003c> 'Rome' OR city IS NULL","check":"","must":[],"solution":"SELECT name FROM cats WHERE city \u003c> 'Rome' OR city IS NULL"},{"id":"sql.3.2.2","hint":"WHERE … IS NOT NULL","kind":"query","q":"Return the names of the cats that DO have an owner.","pattern":"","sql":"SELECT name FROM cats WHERE owner_id IS NOT NULL","check":"","must":[],"solution":"SELECT name FROM cats WHERE owner_id IS NOT NULL"},{"id":"sql.3.2.3","hint":"AVG(COALESCE(…, 0))","kind":"query","q":"AVG skips NULLs. Return the average cat weight, counting a missing weight as 0.","pattern":"","sql":"SELECT AVG(COALESCE(weight, 0)) FROM cats","check":"","must":[],"solution":"SELECT AVG(COALESCE(weight, 0)) FROM cats"},{"id":"sql.3.2.4","hint":"COUNT(*) … WHERE … IS NULL","kind":"query","q":"Return how many cats have an unknown (NULL) weight.","pattern":"","sql":"SELECT COUNT(*) FROM cats WHERE weight IS NULL","check":"","must":[],"solution":"SELECT COUNT(*) FROM cats WHERE weight IS NULL"}]},{"title":"mission: the name-tag workshop","teach":{"text":"Functions nest, so you can TRIM then LOWER then COALESCE in one go, and a CASE can be grouped, counted or sorted like any column. Always ask \"what happens to the NULL rows?\" — test IS NULL first in a CASE.","code":"SELECT name,\n  CASE WHEN weight IS NULL THEN 'unknown'  -- NULL first!\n       WHEN weight > 5 THEN 'heavy'\n       ELSE 'normal' END AS size\nFROM cats;\n-- Mimi  | unknown\n-- Oscar | heavy …"},"ex":[{"id":"sql.3.3.n1","hint":"COALESCE(LOWER(TRIM(email)), 'none') … ORDER BY name","kind":"query","q":"Return each owner's name and their email trimmed and in lowercase, showing 'none' when it is missing, sorted by name A–Z.","pattern":"","sql":"SELECT name, COALESCE(LOWER(TRIM(email)), 'none') FROM owners ORDER BY name","check":"","must":[],"solution":"SELECT name, COALESCE(LOWER(TRIM(email)), 'none') FROM owners ORDER BY name"},{"id":"sql.3.3.n2","hint":"Name the CASE with AS, then GROUP BY that name.","kind":"query","q":"Sort cats into 'young' (under 5) and 'grown' (5 or more) and return each label with its number of cats.","pattern":"","sql":"SELECT CASE WHEN age \u003c 5 THEN 'young' ELSE 'grown' END AS grp, COUNT(*) FROM cats GROUP BY grp","check":"","must":[],"solution":"SELECT CASE WHEN age \u003c 5 THEN 'young' ELSE 'grown' END AS grp, COUNT(*) FROM cats GROUP BY grp"},{"id":"sql.3.3.n3","hint":"LENGTH(…) can go in SELECT, WHERE and ORDER BY.","kind":"query","q":"Return the names of cats whose name has more than 4 letters, with the name's length, longest first, then name A–Z.","pattern":"","sql":"SELECT name, LENGTH(name) FROM cats WHERE LENGTH(name) > 4 ORDER BY LENGTH(name) DESC, name","check":"","must":[],"solution":"SELECT name, LENGTH(name) FROM cats WHERE LENGTH(name) > 4 ORDER BY LENGTH(name) DESC, name"},{"id":"sql.3.3.n4","hint":"A NULL weight fails \"> 5\" and would fall into the ELSE — catch it with IS NULL.","kind":"query","q":"Return each cat's name and a label: 'unknown' when its weight is NULL, 'heavy' when it is over 5, otherwise 'normal'.","pattern":"","sql":"SELECT name, CASE WHEN weight IS NULL THEN 'unknown' WHEN weight > 5 THEN 'heavy' ELSE 'normal' END FROM cats","check":"","must":[],"solution":"SELECT name, CASE WHEN weight IS NULL THEN 'unknown' WHEN weight > 5 THEN 'heavy' ELSE 'normal' END FROM cats"},{"id":"sql.3.3.n5","hint":"WHERE … IS NOT NULL, two SUM(CASE …) columns, GROUP BY, ORDER BY.","kind":"query","q":"Return each city (skip the NULL one) with its number of 'white' cats and its number of cats of other colours, city A–Z.","pattern":"","sql":"SELECT city, SUM(CASE WHEN colour = 'white' THEN 1 ELSE 0 END), SUM(CASE WHEN colour \u003c> 'white' THEN 1 ELSE 0 END) FROM cats WHERE city IS NOT NULL GROUP BY city ORDER BY city","check":"","must":[],"solution":"SELECT city, SUM(CASE WHEN colour = 'white' THEN 1 ELSE 0 END), SUM(CASE WHEN colour \u003c> 'white' THEN 1 ELSE 0 END) FROM cats WHERE city IS NOT NULL GROUP BY city ORDER BY city"}]}]},{"title":"Window Functions","lessons":[{"title":"OVER ()","teach":{"text":"A window function adds a value to every row WITHOUT collapsing rows the way GROUP BY does. OVER () means \"look at all rows\"; OVER (ORDER BY …) numbers or ranks them. On ties, ROW_NUMBER still counts 1, 2, 3; RANK gives 1, 1, 3; DENSE_RANK gives 1, 1, 2.","code":"SELECT name, weight,\n  AVG(weight) OVER ()                    AS avg_w,\n  ROW_NUMBER() OVER (ORDER BY weight DESC) AS rn,\n  RANK()       OVER (ORDER BY weight DESC) AS rk\nFROM cats;\n-- Oscar | 6.3 | 4.6 | 1 | 1\n-- Leo   | 6.3 | 4.6 | 2 | 1\n-- Milo  | 5.6 | 4.6 | 3 | 3 …"},"ex":[{"id":"sql.4.0.0","hint":"SELECT name, age, AVG(age) OVER () FROM cats;","kind":"query","q":"A window function adds a value to every row without collapsing rows. AVG(age) OVER () is the average over all rows. Return each cat's name, age and the overall average age.","pattern":"","sql":"SELECT name, age, AVG(age) OVER () FROM cats","check":"","must":[],"solution":"SELECT name, age, AVG(age) OVER () FROM cats"},{"id":"sql.4.0.1","hint":"ROW_NUMBER() OVER (ORDER BY … DESC)","kind":"query","q":"ROW_NUMBER() OVER (ORDER BY col) numbers the rows. Return each cat's name and its number when cats are ordered oldest first.","pattern":"","sql":"SELECT name, ROW_NUMBER() OVER (ORDER BY age DESC) FROM cats","check":"","must":[],"solution":"SELECT name, ROW_NUMBER() OVER (ORDER BY age DESC) FROM cats"},{"id":"sql.4.0.2","hint":"age - AVG(…) OVER ()","kind":"query","q":"Return each cat's name, age, and how many years older it is than the overall average age (age minus the average).","pattern":"","sql":"SELECT name, age, age - AVG(age) OVER () FROM cats","check":"","must":[],"solution":"SELECT name, age, age - AVG(age) OVER () FROM cats"},{"id":"sql.4.0.3","hint":"RANK() OVER (ORDER BY … DESC)","kind":"query","q":"RANK() gives ties the same number and then skips (weights 6.3, 6.3, 5.6 → 1, 1, 3). Return each cat's name and its RANK by weight, heaviest first.","pattern":"","sql":"SELECT name, RANK() OVER (ORDER BY weight DESC) FROM cats","check":"","must":[],"solution":"SELECT name, RANK() OVER (ORDER BY weight DESC) FROM cats"},{"id":"sql.4.0.4","hint":"DENSE_RANK() OVER (ORDER BY …)","kind":"query","q":"DENSE_RANK() is like RANK() but never skips numbers. Return each cat's name and its dense rank by weight, heaviest first.","pattern":"","sql":"SELECT name, DENSE_RANK() OVER (ORDER BY weight DESC) FROM cats","check":"","must":[],"solution":"SELECT name, DENSE_RANK() OVER (ORDER BY weight DESC) FROM cats"}]},{"title":"PARTITION BY","teach":{"text":"PARTITION BY splits the rows into groups and restarts the window in each one — like GROUP BY, but every row stays. ORDER BY inside OVER makes it cumulative (a running total). Window functions can't go in WHERE, so filter on them from a subquery.","code":"SELECT name, city,\n  ROW_NUMBER() OVER (PARTITION BY city ORDER BY age) AS rn,\n  SUM(weight)  OVER (PARTITION BY city)              AS city_w\nFROM cats WHERE city = 'Rome';\n-- Bella  | Rome | 1 | 15.3\n-- Milo   | Rome | 2 | 15.3\n-- Tigger | Rome | 3 | 15.3"},"ex":[{"id":"sql.4.1.0","hint":"ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)","kind":"query","q":"PARTITION BY restarts the window for each group: ROW_NUMBER() OVER (PARTITION BY city ORDER BY age). Return each cat's name, city, and its number within its city, youngest first.","pattern":"","sql":"SELECT name, city, ROW_NUMBER() OVER (PARTITION BY city ORDER BY age) FROM cats","check":"","must":[],"solution":"SELECT name, city, ROW_NUMBER() OVER (PARTITION BY city ORDER BY age) FROM cats"},{"id":"sql.4.1.1","hint":"SELECT … FROM (SELECT …, ROW_NUMBER() OVER (PARTITION BY … ORDER BY … DESC) AS rn FROM … ) AS t WHERE rn = 1;","kind":"query","q":"Return the name and city of the oldest cat in each city (skip cats with no city). Window functions can't go in WHERE, so number the rows in a subquery and keep rn = 1.","pattern":"","sql":"SELECT name, city FROM (SELECT name, city, ROW_NUMBER() OVER (PARTITION BY city ORDER BY age DESC) AS rn FROM cats WHERE city IS NOT NULL) AS t WHERE rn = 1","check":"","must":[],"solution":"SELECT name, city FROM (SELECT name, city, ROW_NUMBER() OVER (PARTITION BY city ORDER BY age DESC) AS rn FROM cats WHERE city IS NOT NULL) AS t WHERE rn = 1"},{"id":"sql.4.1.2","hint":"SUM(…) OVER (PARTITION BY …)","kind":"query","q":"Return each cat's name, city, and the total weight of all cats in its city.","pattern":"","sql":"SELECT name, city, SUM(weight) OVER (PARTITION BY city) FROM cats","check":"","must":[],"solution":"SELECT name, city, SUM(weight) OVER (PARTITION BY city) FROM cats"},{"id":"sql.4.1.3","hint":"age * 1.0 / SUM(age) OVER (PARTITION BY …)","kind":"query","q":"Return each cat's name and its age as a fraction of its city's total age. Multiply by 1.0 first so it doesn't round down to 0.","pattern":"","sql":"SELECT name, age * 1.0 / SUM(age) OVER (PARTITION BY city) FROM cats","check":"","must":[],"solution":"SELECT name, age * 1.0 / SUM(age) OVER (PARTITION BY city) FROM cats"},{"id":"sql.4.1.4","hint":"SUM(cost) OVER (ORDER BY visit_date) … ORDER BY visit_date","kind":"query","q":"ORDER BY inside OVER makes a running total: SUM(x) OVER (ORDER BY y). Return each visit's date and the running total of cost, in date order.","pattern":"","sql":"SELECT visit_date, SUM(cost) OVER (ORDER BY visit_date) FROM visits ORDER BY visit_date","check":"","must":[],"solution":"SELECT visit_date, SUM(cost) OVER (ORDER BY visit_date) FROM visits ORDER BY visit_date"}]},{"title":"LAG, LEAD, CTEs","teach":{"text":"LAG(col) looks at the previous row and LEAD(col) at the next, in the order given in OVER (add PARTITION BY to stay within a group); the first/last row gets NULL. A CTE — WITH name AS (SELECT …) — names a result so the main query can read it like a table.","code":"SELECT visit_date, cost,\n  LAG(cost) OVER (ORDER BY visit_date) AS prev\nFROM visits;\n-- 2026-01-05 | 40 | NULL\n-- 2026-01-12 | 55 | 40 …\n\nWITH big AS (SELECT * FROM visits WHERE cost > 90)\nSELECT cat_id FROM big;   -- 4, 4"},"ex":[{"id":"sql.4.2.0","hint":"LAG(cost) OVER (ORDER BY …)","kind":"query","q":"LAG(col) OVER (ORDER BY …) fetches the previous row's value (LEAD the next). Return each visit's date, its cost, and the previous visit's cost, by visit_date.","pattern":"","sql":"SELECT visit_date, cost, LAG(cost) OVER (ORDER BY visit_date) FROM visits","check":"","must":[],"solution":"SELECT visit_date, cost, LAG(cost) OVER (ORDER BY visit_date) FROM visits"},{"id":"sql.4.2.1","hint":"LEAD(…) OVER (PARTITION BY … ORDER BY …)","kind":"query","q":"Return each visit's cat_id, visit_date, and the date of that SAME cat's next visit (NULL if none).","pattern":"","sql":"SELECT cat_id, visit_date, LEAD(visit_date) OVER (PARTITION BY cat_id ORDER BY visit_date) FROM visits","check":"","must":[],"solution":"SELECT cat_id, visit_date, LEAD(visit_date) OVER (PARTITION BY cat_id ORDER BY visit_date) FROM visits"},{"id":"sql.4.2.2","hint":"WITH old AS (SELECT … WHERE …) SELECT name FROM old;","kind":"query","q":"A CTE names a temporary result: WITH name AS (SELECT …) SELECT … FROM name. Using a CTE called old holding the cats older than 6, return the names from old.","pattern":"","sql":"WITH old AS (SELECT * FROM cats WHERE age > 6) SELECT name FROM old","check":"","must":[],"solution":"WITH old AS (SELECT * FROM cats WHERE age > 6) SELECT name FROM old"},{"id":"sql.4.2.3","hint":"WITH v AS (SELECT cat_id, COUNT(*) AS n FROM visits GROUP BY …) SELECT … JOIN v ON …","kind":"query","q":"Using a CTE that counts each cat's visits, return the names of the cats with at least 2 visits.","pattern":"","sql":"WITH v AS (SELECT cat_id, COUNT(*) AS n FROM visits GROUP BY cat_id) SELECT c.name FROM cats c JOIN v ON v.cat_id = c.id WHERE v.n >= 2","check":"","must":[],"solution":"WITH v AS (SELECT cat_id, COUNT(*) AS n FROM visits GROUP BY cat_id) SELECT c.name FROM cats c JOIN v ON v.cat_id = c.id WHERE v.n >= 2"},{"id":"sql.4.2.4","hint":"cost - LAG(cost) OVER (PARTITION BY … ORDER BY …)","kind":"query","q":"For every visit, return the cat_id, visit_date, and how much the cost changed since that cat's previous visit (NULL for its first visit).","pattern":"","sql":"SELECT cat_id, visit_date, cost - LAG(cost) OVER (PARTITION BY cat_id ORDER BY visit_date) FROM visits","check":"","must":[],"solution":"SELECT cat_id, visit_date, cost - LAG(cost) OVER (PARTITION BY cat_id ORDER BY visit_date) FROM visits"}]},{"title":"mission: the leaderboard","teach":{"text":"Windows combine with everything: join first to bring in the columns, rank with PARTITION BY, then filter the ranks in a CTE or subquery (a window can't sit in WHERE). WHERE runs BEFORE the window, so it decides which rows get numbered.","code":"WITH ranked AS (\n  SELECT cat_id, visit_date, cost,\n    ROW_NUMBER() OVER (PARTITION BY cat_id\n                       ORDER BY visit_date DESC) AS rn\n  FROM visits)\nSELECT cat_id, visit_date FROM ranked WHERE rn = 1;\n-- each cat's latest visit"},"ex":[{"id":"sql.4.3.n1","hint":"JOIN, then ROW_NUMBER() OVER (PARTITION BY the owner ORDER BY age DESC)","kind":"query","q":"Return each owner's name, their cat's name, and the cat's number among that owner's cats, oldest cat first (cats without an owner left out).","pattern":"","sql":"SELECT o.name, c.name, ROW_NUMBER() OVER (PARTITION BY o.id ORDER BY c.age DESC) FROM cats c JOIN owners o ON c.owner_id = o.id","check":"","must":[],"solution":"SELECT o.name, c.name, ROW_NUMBER() OVER (PARTITION BY o.id ORDER BY c.age DESC) FROM cats c JOIN owners o ON c.owner_id = o.id"},{"id":"sql.4.3.n2","hint":"Number the rows per city in a CTE, then keep rn \u003c= 2.","kind":"query","q":"Return the name, city and weight of the 2 heaviest cats in each city (skip cats with no city or no weight; break ties any way).","pattern":"","sql":"WITH r AS (SELECT name, city, weight, ROW_NUMBER() OVER (PARTITION BY city ORDER BY weight DESC) AS rn FROM cats WHERE city IS NOT NULL AND weight IS NOT NULL) SELECT name, city, weight FROM r WHERE rn \u003c= 2","check":"","must":[],"solution":"WITH r AS (SELECT name, city, weight, ROW_NUMBER() OVER (PARTITION BY city ORDER BY weight DESC) AS rn FROM cats WHERE city IS NOT NULL AND weight IS NOT NULL) SELECT name, city, weight FROM r WHERE rn \u003c= 2"},{"id":"sql.4.3.n3","hint":"Group in the CTE, join to cats, then DENSE_RANK() OVER (ORDER BY total DESC).","kind":"query","q":"Using a CTE of each cat's total visit cost, return each visited cat's name, its total, and its DENSE_RANK by total (highest = 1).","pattern":"","sql":"WITH t AS (SELECT cat_id, SUM(cost) AS total FROM visits GROUP BY cat_id) SELECT c.name, t.total, DENSE_RANK() OVER (ORDER BY t.total DESC) FROM t JOIN cats c ON c.id = t.cat_id","check":"","must":[],"solution":"WITH t AS (SELECT cat_id, SUM(cost) AS total FROM visits GROUP BY cat_id) SELECT c.name, t.total, DENSE_RANK() OVER (ORDER BY t.total DESC) FROM t JOIN cats c ON c.id = t.cat_id"},{"id":"sql.4.3.n4","hint":"Put LAG(cost) in a CTE, then compare in the outer WHERE.","kind":"query","q":"Return the dates of the visits that cost more than the visit just before them (by date, any cat).","pattern":"","sql":"WITH d AS (SELECT visit_date, cost, LAG(cost) OVER (ORDER BY visit_date) AS prev FROM visits) SELECT visit_date FROM d WHERE cost > prev","check":"","must":[],"solution":"WITH d AS (SELECT visit_date, cost, LAG(cost) OVER (ORDER BY visit_date) AS prev FROM visits) SELECT visit_date FROM d WHERE cost > prev"},{"id":"sql.4.3.n5","hint":"JOIN + WHERE first; the window only sees the rows that survive.","kind":"query","q":"For the visits of cats living in 'Rome' (cats.city) only, return each visit's date, cost and the running total of those costs, in date order.","pattern":"","sql":"SELECT v.visit_date, v.cost, SUM(v.cost) OVER (ORDER BY v.visit_date) FROM visits v JOIN cats c ON v.cat_id = c.id WHERE c.city = 'Rome' ORDER BY v.visit_date","check":"","must":[],"solution":"SELECT v.visit_date, v.cost, SUM(v.cost) OVER (ORDER BY v.visit_date) FROM visits v JOIN cats c ON v.cat_id = c.id WHERE c.city = 'Rome' ORDER BY v.visit_date"}]}]},{"title":"Design & Dates","lessons":[{"title":"keys","teach":{"text":"Constraints protect your data: PRIMARY KEY identifies each row, REFERENCES other(id) makes a foreign key pointing at another table, UNIQUE forbids repeats, NOT NULL forbids blanks. An index (CREATE INDEX) doesn't change results — it just speeds up lookups.","code":"CREATE TABLE toys (\n  id     INTEGER PRIMARY KEY,           -- one per row\n  name   TEXT NOT NULL,                 -- must be filled\n  code   TEXT UNIQUE,                   -- no repeats\n  cat_id INTEGER REFERENCES cats(id)    -- foreign key\n);\nCREATE INDEX idx_toys_cat ON toys(cat_id);"},"ex":[{"id":"sql.5.0.0","hint":"CREATE TABLE toys (id INTEGER PRIMARY KEY, name TEXT);","kind":"query","q":"A PRIMARY KEY uniquely identifies each row. Create a table toys with id INTEGER PRIMARY KEY and name TEXT.","pattern":"CREATE TABLE t (id INTEGER PRIMARY KEY, …);","sql":"CREATE TABLE toys (id INTEGER PRIMARY KEY, name TEXT)","check":"SELECT name, UPPER(type), pk FROM pragma_table_info('toys') ORDER BY cid","must":[],"solution":"CREATE TABLE toys (id INTEGER PRIMARY KEY, name TEXT)"},{"id":"sql.5.0.1","hint":"… cat_id INTEGER REFERENCES cats(id))","kind":"query","q":"A FOREIGN KEY points at another table's key: col INTEGER REFERENCES other(id). Create toys(id INTEGER PRIMARY KEY, name TEXT, cat_id INTEGER) where cat_id references cats(id).","pattern":"","sql":"CREATE TABLE toys (id INTEGER PRIMARY KEY, name TEXT, cat_id INTEGER REFERENCES cats(id))","check":"SELECT (SELECT COUNT(*) FROM pragma_table_info('toys')), \"table\", \"from\", \"to\" FROM pragma_foreign_key_list('toys')","must":[],"solution":"CREATE TABLE toys (id INTEGER PRIMARY KEY, name TEXT, cat_id INTEGER REFERENCES cats(id))"},{"id":"sql.5.0.2","hint":"… email TEXT UNIQUE)","kind":"query","q":"UNIQUE stops two rows having the same value. Create a table vets with id INTEGER PRIMARY KEY and an email TEXT column that must be unique.","pattern":"","sql":"CREATE TABLE vets (id INTEGER PRIMARY KEY, email TEXT UNIQUE)","check":"SELECT (SELECT group_concat(name) FROM pragma_table_info('vets')), ii.name FROM pragma_index_list('vets') il JOIN pragma_index_info(il.name) ii WHERE il.\"unique\" = 1","must":[],"solution":"CREATE TABLE vets (id INTEGER PRIMARY KEY, email TEXT UNIQUE)"},{"id":"sql.5.0.3","hint":"… name TEXT NOT NULL)","kind":"query","q":"Create a table vets with id INTEGER PRIMARY KEY and a name TEXT column that can never be NULL.","pattern":"","sql":"CREATE TABLE vets (id INTEGER PRIMARY KEY, name TEXT NOT NULL)","check":"SELECT name, UPPER(type), \"notnull\", pk FROM pragma_table_info('vets') ORDER BY cid","must":[],"solution":"CREATE TABLE vets (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"},{"id":"sql.5.0.4","hint":"CREATE INDEX … ON cats(…);","kind":"query","q":"An index speeds up lookups: CREATE INDEX name ON table(col). Create an index called idx_cats_city on the city column of cats.","pattern":"","sql":"CREATE INDEX idx_cats_city ON cats(city)","check":"SELECT il.name, ii.name FROM pragma_index_list('cats') il JOIN pragma_index_info(il.name) ii","must":[],"solution":"CREATE INDEX idx_cats_city ON cats(city)"}]},{"title":"dates","teach":{"text":"SQLite stores dates as 'YYYY-MM-DD' text, which sorts and compares correctly as long as you compare with a quoted date in the same format. strftime('%Y', d) pulls out parts (%m month, %d day, '%Y-%m' year-month), and date(d, '-30 days') shifts a date.","code":"SELECT name, strftime('%Y', born) FROM cats\nWHERE born >= '2023-01-01';\n-- Luna | 2023\n-- Mia  | 2025 …\n\nSELECT date('2026-08-31', '-60 days');\n-- 2026-07-02"},"ex":[{"id":"sql.5.1.0","hint":"WHERE born > '…'","kind":"query","q":"Dates are stored as 'YYYY-MM-DD' text, which sorts and compares correctly — as long as you compare with a quoted date. Return the names of cats born after '2020-12-31'.","pattern":"","sql":"SELECT name FROM cats WHERE born > '2020-12-31'","check":"","must":[],"solution":"SELECT name FROM cats WHERE born > '2020-12-31'"},{"id":"sql.5.1.1","hint":"strftime('%Y', column)","kind":"query","q":"strftime('%Y', date) extracts the year as text (%m month, %d day). Return each cat's name and its birth year.","pattern":"","sql":"SELECT name, strftime('%Y', born) FROM cats","check":"","must":[],"solution":"SELECT name, strftime('%Y', born) FROM cats"},{"id":"sql.5.1.2","hint":"WHERE visit_date >= date('2026-08-31', '…')","kind":"query","q":"date(d, '-60 days') shifts a date. Pretend today is '2026-08-31': return the ids of visits on or after the date 60 days earlier.","pattern":"","sql":"SELECT id FROM visits WHERE visit_date >= date('2026-08-31', '-60 days')","check":"","must":[],"solution":"SELECT id FROM visits WHERE visit_date >= date('2026-08-31', '-60 days')"},{"id":"sql.5.1.3","hint":"BETWEEN '2026-03-01' AND '…', or strftime('%Y-%m', …)","kind":"query","q":"Return all columns of the visits in March 2026.","pattern":"","sql":"SELECT * FROM visits WHERE visit_date BETWEEN '2026-03-01' AND '2026-03-31'","check":"","must":[],"solution":"SELECT * FROM visits WHERE visit_date BETWEEN '2026-03-01' AND '2026-03-31'"},{"id":"sql.5.1.4","hint":"SELECT strftime('%Y-%m', …) AS m, COUNT(*) FROM visits GROUP BY m ORDER BY m;","kind":"query","q":"Return each month as 'YYYY-MM' with its number of visits, earliest month first.","pattern":"","sql":"SELECT strftime('%Y-%m', visit_date) AS m, COUNT(*) FROM visits GROUP BY m ORDER BY m","check":"","must":[],"solution":"SELECT strftime('%Y-%m', visit_date) AS m, COUNT(*) FROM visits GROUP BY m ORDER BY m"}]},{"title":"transactions","teach":{"text":"A transaction groups statements so they succeed or fail together: BEGIN starts it, COMMIT makes it permanent, ROLLBACK undoes everything since BEGIN. Before a risky UPDATE or DELETE, run a SELECT with the same WHERE to preview the rows it will touch.","code":"SELECT * FROM visits WHERE cost \u003c 30;   -- preview first\n\nBEGIN;\nUPDATE cats SET owner_id = 7 WHERE name = 'Leo';\nDELETE FROM visits WHERE cost \u003c 30;\nCOMMIT;      -- or ROLLBACK; to undo both"},"ex":[{"id":"sql.5.2.0","hint":"BEGIN; UPDATE … ; UPDATE … ; COMMIT;","kind":"query","q":"BEGIN; … COMMIT; wraps statements so they all happen or none do. In one transaction, give 'Leo' to owner_id 7 and 'Simba' to owner_id 8.","pattern":"BEGIN;\nUPDATE …;\nUPDATE …;\nCOMMIT;","sql":"BEGIN; UPDATE cats SET owner_id = 7 WHERE name = 'Leo'; UPDATE cats SET owner_id = 8 WHERE name = 'Simba'; COMMIT;","check":"SELECT id, owner_id FROM cats ORDER BY id","must":[{"re":"\\bBEGIN\\b","msg":"Start the transaction with BEGIN;"},{"re":"\\bBEGIN\\b[\\s\\S]*\\b(COMMIT|END)\\b","msg":"Finish the transaction with COMMIT; to make it permanent."}],"solution":"BEGIN; UPDATE cats SET owner_id = 7 WHERE name = 'Leo'; UPDATE cats SET owner_id = 8 WHERE name = 'Simba'; COMMIT;"},{"id":"sql.5.2.1","hint":"BEGIN; DELETE FROM …; ROLLBACK;","kind":"query","q":"ROLLBACK undoes everything since BEGIN. Write a transaction that deletes every cat — and then rolls it back.","pattern":"","sql":"BEGIN; DELETE FROM cats; ROLLBACK;","check":"SELECT COUNT(*) FROM cats","must":[{"re":"\\bBEGIN\\b","msg":"Start the transaction with BEGIN;"},{"re":"\\bROLLBACK\\b","msg":"Undo it with ROLLBACK; at the end."},{"re":"\\bBEGIN\\b[\\s\\S]*\\bDELETE\\s+FROM\\s+cats\\b[\\s\\S]*\\bROLLBACK\\b","msg":"Do the DELETE FROM cats between BEGIN; and ROLLBACK;"}],"solution":"BEGIN; DELETE FROM cats; ROLLBACK;"},{"id":"sql.5.2.2","hint":"The opposite of ROLLBACK.","kind":"write","q":"Which statement makes a transaction's changes permanent? (type the keyword)","code":"","accept":["COMMIT","END"],"solution":"COMMIT"},{"id":"sql.5.2.3","hint":"SELECT * FROM visits WHERE …;","kind":"query","q":"Before a risky DELETE, preview it with a SELECT using the same WHERE. Show all columns of the rows that DELETE FROM visits WHERE cost \u003c 40 would remove.","pattern":"","sql":"SELECT * FROM visits WHERE cost \u003c 40","check":"","must":[],"solution":"SELECT * FROM visits WHERE cost \u003c 40"},{"id":"sql.5.2.4","hint":"BEGIN; UPDATE … WHERE city = '…'; DELETE FROM visits WHERE cat_id IN (SELECT id FROM cats WHERE …); COMMIT;","kind":"query","q":"In one transaction: give every cat living in 'Turin' to owner_id 7, AND delete all visits of the cats in 'Turin' (find their ids with a subquery). Commit it.","pattern":"","sql":"BEGIN; UPDATE cats SET owner_id = 7 WHERE city = 'Turin'; DELETE FROM visits WHERE cat_id IN (SELECT id FROM cats WHERE city = 'Turin'); COMMIT;","check":"SELECT c.id, c.owner_id, (SELECT COUNT(*) FROM visits v WHERE v.cat_id = c.id) FROM cats c ORDER BY c.id","must":[{"re":"\\bBEGIN\\b","msg":"Start the transaction with BEGIN;"},{"re":"\\bBEGIN\\b[\\s\\S]*\\b(COMMIT|END)\\b","msg":"Finish the transaction with COMMIT; to make it permanent."},{"re":"\\(\\s*SELECT\\b","msg":"Look the id(s) up with a subquery: (SELECT id FROM …)"}],"solution":"BEGIN; UPDATE cats SET owner_id = 7 WHERE city = 'Turin'; DELETE FROM visits WHERE cat_id IN (SELECT id FROM cats WHERE city = 'Turin'); COMMIT;"}]},{"title":"mission: clinic day","teach":{"text":"A real clinic job mixes it all: design tables with keys, filter and group by dates, and wrap multi-step changes in a transaction — in the right order, since each statement sees the changes of the ones before it.","code":"BEGIN;\nINSERT INTO visits (cat_id, visit_date, cost)\n  VALUES ((SELECT id FROM cats WHERE name = 'Luna'),\n          '2026-09-01', 30);\nUPDATE cats SET age = age + 1 WHERE name = 'Luna';\nCOMMIT;"},"ex":[{"id":"sql.5.3.n1","hint":"CREATE TABLE …; INSERT INTO vets (name) VALUES ('…');","kind":"query","q":"Create a table vets (id INTEGER PRIMARY KEY, name TEXT NOT NULL) and add a vet named 'Dr Rossi' to it.","pattern":"","sql":"CREATE TABLE vets (id INTEGER PRIMARY KEY, name TEXT NOT NULL); INSERT INTO vets (name) VALUES ('Dr Rossi');","check":"SELECT name, UPPER(type), \"notnull\", pk, (SELECT group_concat(name) FROM vets) FROM pragma_table_info('vets') ORDER BY cid","must":[],"solution":"CREATE TABLE vets (id INTEGER PRIMARY KEY, name TEXT NOT NULL); INSERT INTO vets (name) VALUES ('Dr Rossi');"},{"id":"sql.5.3.n2","hint":"JOIN, a date range in WHERE, then GROUP BY the cat.","kind":"query","q":"Return each cat's name and its number of visits in the first half of 2026 (January to June) — cats with none left out.","pattern":"","sql":"SELECT c.name, COUNT(*) FROM cats c JOIN visits v ON v.cat_id = c.id WHERE v.visit_date BETWEEN '2026-01-01' AND '2026-06-30' GROUP BY c.id","check":"","must":[],"solution":"SELECT c.name, COUNT(*) FROM cats c JOIN visits v ON v.cat_id = c.id WHERE v.visit_date BETWEEN '2026-01-01' AND '2026-06-30' GROUP BY c.id"},{"id":"sql.5.3.n3","hint":"strftime('%m', born) AS m … GROUP BY m HAVING …","kind":"query","q":"Return each birth month ('MM') shared by at least 2 cats, with how many cats were born in it.","pattern":"","sql":"SELECT strftime('%m', born) AS m, COUNT(*) FROM cats GROUP BY m HAVING COUNT(*) >= 2","check":"","must":[],"solution":"SELECT strftime('%m', born) AS m, COUNT(*) FROM cats GROUP BY m HAVING COUNT(*) >= 2"},{"id":"sql.5.3.n4","hint":"BEGIN; DELETE … WHERE visit_date \u003c '…'; UPDATE … ; COMMIT;","kind":"query","q":"In one transaction: delete every visit before '2026-02-01', then add 5 to the cost of each remaining visit of cat_id 1. Commit it.","pattern":"","sql":"BEGIN; DELETE FROM visits WHERE visit_date \u003c '2026-02-01'; UPDATE visits SET cost = cost + 5 WHERE cat_id = 1; COMMIT;","check":"SELECT id, cost FROM visits ORDER BY id","must":[{"re":"\\bBEGIN\\b","msg":"Start the transaction with BEGIN;"},{"re":"\\bBEGIN\\b[\\s\\S]*\\b(COMMIT|END)\\b","msg":"Finish the transaction with COMMIT; to make it permanent."}],"solution":"BEGIN; DELETE FROM visits WHERE visit_date \u003c '2026-02-01'; UPDATE visits SET cost = cost + 5 WHERE cat_id = 1; COMMIT;"},{"id":"sql.5.3.n5","hint":"JOIN, WHERE … \u003c date(…, '-90 days'), ORDER BY the date.","kind":"query","q":"Before archiving old records, preview them: return the visit_date and cat name of every visit more than 90 days before '2026-08-31' (earlier than date('2026-08-31', '-90 days')), oldest first.","pattern":"","sql":"SELECT v.visit_date, c.name FROM visits v JOIN cats c ON v.cat_id = c.id WHERE v.visit_date \u003c date('2026-08-31', '-90 days') ORDER BY v.visit_date","check":"","must":[],"solution":"SELECT v.visit_date, c.name FROM visits v JOIN cats c ON v.cat_id = c.id WHERE v.visit_date \u003c date('2026-08-31', '-90 days') ORDER BY v.visit_date"}]}]}],"db":"CREATE TABLE cities (id INTEGER PRIMARY KEY, name TEXT, region TEXT);\nINSERT INTO cities VALUES (1,'Milan','Lombardy'),(2,'Rome','Lazio'),(3,'Turin','Piedmont'),(4,'Naples','Campania'),(5,'Florence','Tuscany'),(6,'Venice','Veneto');\nCREATE TABLE owners (id INTEGER PRIMARY KEY, name TEXT, city_id INTEGER REFERENCES cities(id), email TEXT);\nINSERT INTO owners VALUES (1,'Anna',1,'anna@cats.it'),(2,'Bruno',2,'bruno@mail.com'),(3,'Carla',3,'carla@cats.it'),(4,'Dario',2,'  dario@mail.com '),(5,'Elena',4,'elena@cats.it'),(6,'Franco',5,NULL),(7,'Gina',1,'gina@mail.com'),(8,'Hugo',NULL,'hugo@cats.it');\nCREATE TABLE cats (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, colour TEXT, city TEXT, owner_id INTEGER REFERENCES owners(id), born TEXT, weight REAL);\nINSERT INTO cats VALUES\n (1,'Luna',3,'black','Milan',1,'2023-04-12',4.1),\n (2,'Milo',7,'orange','Rome',2,'2019-02-03',5.6),\n (3,'Mia',1,'white','Milan',1,'2025-06-20',3.2),\n (4,'Oscar',12,'grey','Turin',3,'2014-01-15',6.3),\n (5,'Bella',5,'white','Rome',4,'2021-03-30',4.1),\n (6,'Simba',2,'orange',NULL,NULL,'2024-08-08',5.0),\n (7,'Nala',9,'black','Naples',5,'2017-05-11',4.5),\n (8,'Mimi',4,'tabby','Milan',2,'2022-07-01',NULL),\n (9,'Leo',6,'orange','Turin',NULL,'2020-05-05',6.3),\n (10,'Tigger',10,'tabby','Rome',3,'2016-09-09',5.6),\n (11,'Zia',8,'white','Florence',6,'2018-02-24',3.8),\n (12,'Sofia',0,'grey','Naples',5,'2026-03-14',2.1);\nCREATE TABLE visits (id INTEGER PRIMARY KEY, cat_id INTEGER REFERENCES cats(id), visit_date TEXT, cost INTEGER);\nINSERT INTO visits VALUES (1,1,'2026-01-05',40),(2,2,'2026-01-12',55),(3,1,'2026-02-20',30),(4,4,'2026-02-28',120),(5,3,'2026-03-03',45),(6,2,'2026-03-15',60),(7,7,'2026-04-01',80),(8,1,'2026-04-18',25),(9,5,'2026-05-09',50),(10,4,'2026-06-30',95),(11,9,'2026-07-04',70),(12,2,'2026-08-21',35);","schema":"cats(id, name, age, colour, city, owner_id, born, weight)\nowners(id, name, city_id, email)\ncities(id, name, region)\nvisits(id, cat_id, visit_date, cost)"},{"key":"r","name":"R","units":[{"title":"R Basics","lessons":[{"title":"assignment","teach":{"text":"Store a value in a name with \u003c- (the arrow points into the name); you can overwrite it later using its old value. Printing shows [1] first: the position of the first element. # starts a comment.","code":"x \u003c- 5          # assign\nx \u003c- x * 2      # reuse and overwrite\nprint(x)        # [1] 10\nclass(x)        # [1] \"numeric\"\npaste(\"Hi\", \"cat\")   # [1] \"Hi cat\"  (joined with a space)"},"ex":[{"id":"r.0.0.0","hint":"= also works, but \u003c- is idiomatic.","kind":"write","q":"The usual assignment operator in R is…","code":"","accept":["\u003c-"],"solution":"\u003c-"},{"id":"r.0.0.1","hint":"R prints [1] before a vector's first element.","kind":"output","q":"What does this print?","code":"x \u003c- 5\nx \u003c- x * 2\nprint(x)","accept":["[1] 10"],"solution":"[1] 10"},{"id":"r.0.0.2","hint":"","kind":"write","q":"A comment in R starts with the character…","code":"","accept":["# comment","#"],"solution":"# comment"},{"id":"r.0.0.3","hint":"Plain numbers are doubles, class \"numeric\". 3L would be integer.","kind":"write","q":"What is class(3)?","code":"","accept":["\"numeric\"","numeric","[1] \"numeric\""],"solution":"\"numeric\""},{"id":"r.0.0.4","hint":"","kind":"output","q":"What does this print?","code":"paste(\"Hi\", \"cat\")","accept":["[1] \"Hi cat\""],"solution":"[1] \"Hi cat\""},{"id":"r.0.0.n1","hint":"Use the name cats in both lines; paste() adds the space for you.","kind":"code","q":"The variable `cats` already holds some number of cats. Create `legs`, the total number of legs (4 per cat), and `label`, text like \"5 cats\" made with paste().","setup":"cats \u003c- sample(2:9, 1)","starter":"legs \u003c- \nlabel \u003c- ","tests":"stopifnot(\"legs should be cats * 4\" = isTRUE(all.equal(legs, cats * 4)))\nstopifnot(\"label should look like 5 cats (number, space, cats)\" = identical(label, paste(cats, \"cats\")))","solution":"legs \u003c- cats * 4\nlabel \u003c- paste(cats, \"cats\")"}]},{"title":"vectors","teach":{"text":"c() combines values into a vector, and arithmetic or comparisons act on every element at once. Indexing starts at 1 (not 0), and a logical vector inside [ ] keeps only the TRUE positions.","code":"x \u003c- c(10, 20, 30, 40)\nx * 2        # [1] 20 40 60 80\nx[1]         # [1] 10   (first element!)\nx > 25       # [1] FALSE FALSE  TRUE  TRUE\nx[x > 25]    # [1] 30 40\n2:4          # [1] 2 3 4"},"ex":[{"id":"r.0.1.0","hint":"","kind":"write","q":"Create a vector 1, 2, 3:","code":"","accept":["c(1, 2, 3)","1:3","c(1:3)","seq(1, 3)","seq(3)"],"solution":"c(1, 2, 3)"},{"id":"r.0.1.1","hint":"Arithmetic is vectorised.","kind":"output","q":"What does this print?","code":"x \u003c- c(1, 2, 3)\nx * 2","accept":["[1] 2 4 6"],"solution":"[1] 2 4 6"},{"id":"r.0.1.2","hint":"R indexes from 1!","kind":"output","q":"What does this print?","code":"x \u003c- c(10, 20, 30)\nx[1]","accept":["[1] 10"],"solution":"[1] 10"},{"id":"r.0.1.3","hint":"","kind":"output","q":"What does this print?","code":"1:5","accept":["[1] 1 2 3 4 5"],"solution":"[1] 1 2 3 4 5"},{"id":"r.0.1.4","hint":"x > 2 is a logical mask.","kind":"output","q":"What does this print?","code":"x \u003c- c(1, 2, 3, 4)\nsum(x[x > 2])","accept":["[1] 7"],"solution":"[1] 7"},{"id":"r.0.1.n1","hint":"Put the condition inside the brackets: w[ ... ]. length() counts.","kind":"code","q":"The vector `w` holds cat weights in kg. Create `heavy` containing only the weights above 4, and `n_heavy`, how many there are.","setup":"w \u003c- c(3.2, 4, 5.1, 2.9, 6)","starter":"heavy \u003c- \nn_heavy \u003c- ","tests":"stopifnot(\"heavy should be the weights above 4 (4 itself is not above 4)\" = isTRUE(all.equal(heavy, c(5.1, 6))))\nstopifnot(\"n_heavy should count the heavy weights\" = isTRUE(all.equal(n_heavy, 2)))","solution":"heavy \u003c- w[w > 4]\nn_heavy \u003c- length(heavy)"}]},{"title":"functions & types","teach":{"text":"Call functions as name(arguments); define your own with function(x) — the last value is returned. A vector holds ONE type, so mixing types coerces everything (to text if any text is present). NA means missing and spreads through sum() and mean() unless you add na.rm = TRUE.","code":"dbl \u003c- function(x) x * 2     # last value is returned\ndbl(c(1, 5))                  # [1]  2 10\nlength(c(4, 5, 6))            # [1] 3\nc(1, \"a\")                     # [1] \"1\" \"a\"\nsum(c(1, NA, 3))              # [1] NA\nsum(c(1, NA, 3), na.rm = TRUE)   # [1] 4"},"ex":[{"id":"r.0.2.0","hint":"","kind":"write","q":"Code to get the length of the vector c(4, 5, 6):","code":"","accept":["length(c(4,5,6))","length(4:6)"],"solution":"length(c(4,5,6))"},{"id":"r.0.2.1","hint":"A vector has ONE type, so everything becomes character.","kind":"output","q":"What does this print?","code":"c(1, \"a\", TRUE)","accept":["[1] \"1\" \"a\" \"TRUE\""],"solution":"[1] \"1\" \"a\" \"TRUE\""},{"id":"r.0.2.2","hint":"","kind":"write","q":"Define a function dbl that doubles x:","code":"","accept":["dbl \u003c- function(x) x * 2","dbl = function(x) x * 2","dbl \u003c- function(x) {x * 2}","dbl \u003c- function(x) { x * 2 }","dbl \u003c- function(x) 2 * x","dbl \u003c- function(x) return(x * 2)","dbl \u003c- \\(x) x * 2"],"solution":"dbl \u003c- function(x) x * 2"},{"id":"r.0.2.3","hint":"","kind":"output","q":"What does this print?","code":"mean(c(2, 4, 6))","accept":["[1] 4"],"solution":"[1] 4"},{"id":"r.0.2.4","hint":"NA spreads unless you use na.rm = TRUE.","kind":"output","q":"What does this print?","code":"x \u003c- c(1, NA, 3)\nsum(x)","accept":["[1] NA"],"solution":"[1] NA"},{"id":"r.0.2.n1","hint":"Work out n and m before the last line uses them.","kind":"order","q":"Arrange the lines to define describe(x), which returns text like \"2 values, mean 3\".","pieces":["  m \u003c- mean(x)","  paste(n, \"values, mean\", m)","  n \u003c- length(x)","  n \u003c- len(x)","describe \u003c- function(x) {","}"],"tests":"stopifnot(\"describe(c(2, 4)) should be 2 values, mean 3\" = identical(describe(c(2, 4)), \"2 values, mean 3\"))","setup":"","solution":"describe \u003c- function(x) {\n  n \u003c- length(x)\n  m \u003c- mean(x)\n  paste(n, \"values, mean\", m)\n}"},{"id":"r.0.2.n2","hint":"mean() has an na.rm argument.","kind":"code","q":"Write a function `avg(x)` that returns the mean of x, ignoring any NA values.","setup":"","starter":"avg \u003c- function(x) {\n  \n}","tests":"stopifnot(\"avg(c(2, 4, 6)) should be 4\" = isTRUE(all.equal(avg(c(2, 4, 6)), 4)))\nstopifnot(\"avg(c(1, NA, 3)) should be 2 (skip the NA)\" = isTRUE(all.equal(avg(c(1, NA, 3)), 2)))\nstopifnot(\"avg(5) should be 5\" = isTRUE(all.equal(avg(5), 5)))","solution":"avg \u003c- function(x) {\n  mean(x, na.rm = TRUE)\n}"}]},{"title":"data frames","teach":{"text":"A data frame is a table whose columns are equal-length vectors. df$col pulls out a column; df[rows, cols] indexes both ways, so df[df$age > 3, ] keeps matching rows (note the comma). nrow() counts rows, while length() counts columns.","code":"cats \u003c- data.frame(name = c(\"Mia\", \"Tom\", \"Leo\"),\n                   age  = c(2, 5, 9))\ncats$age                # [1] 2 5 9\ncats[cats$age > 3, ]    # the rows for Tom and Leo\nnrow(cats)              # [1] 3\nhead(cats, 2)           # first 2 rows"},"ex":[{"id":"r.0.3.0","hint":"","kind":"write","q":"Create a data frame with columns name and age:","code":"","accept":["data.frame(name = c(\"Mia\",\"Tom\"), age = c(2, 5))"],"solution":"data.frame(name = c(\"Mia\",\"Tom\"), age = c(2, 5))"},{"id":"r.0.3.1","hint":"","kind":"write","q":"Get the age column of df:","code":"","accept":["df$age","df[[\"age\"]]","df[['age']]","df[, \"age\"]"],"solution":"df$age"},{"id":"r.0.3.2","hint":"","kind":"write","q":"First 6 rows of df:","code":"","accept":["head(df)","head(df, 6)","head(df, n = 6)","df[1:6, ]"],"solution":"head(df)"},{"id":"r.0.3.3","hint":"df[rows, cols]","kind":"write","q":"Rows of df where age > 3:","code":"","accept":["df[df$age > 3, ]","subset(df, age > 3)","df[df[[\"age\"]] > 3, ]","filter(df, age > 3)","df %>% filter(age > 3)","df |> filter(age > 3)"],"solution":"df[df$age > 3, ]"},{"id":"r.0.3.4","hint":"length(df) gives the number of columns.","kind":"write","q":"Number of rows in df:","code":"","accept":["nrow(df)","dim(df)[1]","NROW(df)"],"solution":"nrow(df)"},{"id":"r.0.3.n1","hint":"Columns inside data.frame() are separated by commas; the last one has none.","kind":"order","q":"Arrange the lines: build the cats table, add an age-in-months column, then keep cats older than 30 months.","pieces":["old \u003c- cats[cats$months > 30, ]","cats.months \u003c- cats.age * 12","cats$months \u003c- cats$age * 12","cats \u003c- data.frame(","  name = c(\"Mia\", \"Tom\"),","  age = c(2, 5)",")"],"tests":"stopifnot(\"cats$months should be 24 and 60\" = isTRUE(all.equal(cats$months, c(24, 60))))\nstopifnot(\"old should hold only Tom\" = identical(old$name, \"Tom\"))","setup":"","solution":"cats \u003c- data.frame(\n  name = c(\"Mia\", \"Tom\"),\n  age = c(2, 5)\n)\ncats$months \u003c- cats$age * 12\nold \u003c- cats[cats$months > 30, ]"},{"id":"r.0.3.n2","hint":"df[condition, ] keeps rows; nrow() counts them.","kind":"code","q":"A data frame `cats` exists with columns name and age. Create `older`, the rows of cats aged 3 or more, and `n_older`, its number of rows.","setup":"cats \u003c- data.frame(name = c(\"Mia\", \"Tom\", \"Leo\", \"Zoe\"), age = c(2, 5, 9, 3))","starter":"older \u003c- \nn_older \u003c- ","tests":"stopifnot(\"older should be a data frame with all the columns\" = is.data.frame(older) && ncol(older) == 2)\nstopifnot(\"older should hold Tom, Leo and Zoe (3 counts as 3 or more)\" = identical(older$name, c(\"Tom\", \"Leo\", \"Zoe\")))\nstopifnot(\"n_older should be the number of rows of older\" = isTRUE(all.equal(n_older, 3)))","solution":"older \u003c- cats[cats$age >= 3, ]\nn_older \u003c- nrow(older)"}]}]},{"title":"Data Wrangling","lessons":[{"title":"logic & ifelse","teach":{"text":"Comparisons give TRUE/FALSE for every element. ifelse(test, yes, no) works on whole vectors, while if (...) ... else ... handles one value. Combine vector conditions with & and | (&& and || are for single values), and sum() of logicals counts the TRUEs.","code":"x \u003c- c(1, 5, 10)\nx > 4                  # [1] FALSE  TRUE  TRUE\nsum(x > 4)             # [1] 2   (TRUE counts as 1)\nx > 2 & x \u003c 8          # [1] FALSE  TRUE FALSE\nifelse(x > 4, \"big\", \"small\")   # [1] \"small\" \"big\"   \"big\"\nif (length(x) > 2) \"long\" else \"short\"   # [1] \"long\""},"ex":[{"id":"r.1.0.0","hint":"","kind":"output","q":"What does this print?","code":"x \u003c- c(1, 5, 10)\nx > 4","accept":["[1] FALSE  TRUE  TRUE"],"solution":"[1] FALSE  TRUE  TRUE"},
