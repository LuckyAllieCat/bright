{"id":"r.1.0.1","hint":"ifelse is vectorised.","kind":"output","q":"What does this print?","code":"ifelse(c(1, 8) > 5, \"big\", \"small\")","accept":["[1] \"small\" \"big\""],"solution":"[1] \"small\" \"big\""},{"id":"r.1.0.2","hint":"","kind":"output","q":"What does this print?","code":"x \u003c- 3\nif (x > 2) \"yes\" else \"no\"","accept":["[1] \"yes\""],"solution":"[1] \"yes\""},{"id":"r.1.0.4","hint":"TRUE counts as 1.","kind":"output","q":"What does this print?","code":"sum(c(TRUE, FALSE, TRUE))","accept":["[1] 2"],"solution":"[1] 2"},{"id":"r.1.0.n1","hint":"if () only handles one value; ifelse() handles a vector.","kind":"code","q":"Write `size_label(w)` that returns \"big\" for weights above 5 and \"small\" otherwise. It must work on a whole vector of weights.","setup":"","starter":"size_label \u003c- function(w) {\n  \n}","tests":"stopifnot(\"size_label(6) should be big\" = identical(size_label(6), \"big\"))\nstopifnot(\"size_label(5) should be small (5 is not above 5)\" = identical(size_label(5), \"small\"))\nstopifnot(\"size_label(c(3, 6, 8)) should be small big big\" = identical(size_label(c(3, 6, 8)), c(\"small\", \"big\", \"big\")))","solution":"size_label \u003c- function(w) {\n  ifelse(w > 5, \"big\", \"small\")\n}"}]},{"title":"loops & apply","teach":{"text":"for (i in seq) repeats a block once per element. sapply(x, f) applies f to every element (or every column of a data frame) and simplifies the results into a vector, usually shorter than a loop. Assigning past the end of a vector grows it.","code":"for (i in 1:3) print(i * 10)       # [1] 10 / [1] 20 / [1] 30\nsapply(1:3, function(x) x + 1)     # [1] 2 3 4\ndf \u003c- data.frame(a = c(1, 3), b = c(2, 6))\nsapply(df, mean)                   # a 2, b 4 (a named vector)\nseq(0, 1, by = 0.5)                # [1] 0.0 0.5 1.0"},"ex":[{"id":"r.1.1.0","hint":"","kind":"output","q":"What does this print?","code":"for (i in 1:3) print(i * 2)","accept":["[1] 2 / [1] 4 / [1] 6 (three lines)"],"solution":"[1] 2 / [1] 4 / [1] 6 (three lines)"},{"id":"r.1.1.1","hint":"","kind":"output","q":"What does this print?","code":"sapply(1:3, function(x) x^2)","accept":["[1] 1 4 9"],"solution":"[1] 1 4 9"},{"id":"r.1.1.2","hint":"","kind":"write","q":"Apply mean to each column of the data frame df:","code":"","accept":["sapply(df, mean)","lapply(df, mean)","colMeans(df)"],"solution":"sapply(df, mean)"},{"id":"r.1.1.3","hint":"R grows the vector.","kind":"output","q":"What does this print?","code":"x \u003c- c(2, 4)\nx[3] \u003c- 6\nx","accept":["[1] 2 4 6"],"solution":"[1] 2 4 6"},{"id":"r.1.1.4","hint":"","kind":"write","q":"seq(0, 10, by = 5) gives…","code":"","accept":["[1]  0  5 10","0 5 10"],"solution":"[1]  0  5 10"},{"id":"r.1.1.n1","hint":"Start the running total before the loop.","kind":"order","q":"Arrange the lines to add up the weights with a loop and then take their average.","pieces":["for (w in c(4, 5, 6)) {","  total \u003c- w","}","total \u003c- 0","  total \u003c- total + w","avg \u003c- total / 3"],"tests":"stopifnot(\"avg should be 5\" = isTRUE(all.equal(avg, 5)))","setup":"","solution":"total \u003c- 0\nfor (w in c(4, 5, 6)) {\n  total \u003c- total + w\n}\navg \u003c- total / 3"},{"id":"r.1.1.n2","hint":"sapply(1:n, function(i) ...) runs the function for each i.","kind":"code","q":"Write `squares(n)` that returns the squares 1, 4, 9, … up to n squared. Use sapply (or a loop).","setup":"","starter":"squares \u003c- function(n) {\n  \n}","tests":"stopifnot(\"squares(3) should be 1 4 9\" = isTRUE(all.equal(squares(3), c(1, 4, 9))))\nstopifnot(\"squares(1) should be 1\" = isTRUE(all.equal(squares(1), 1)))\nstopifnot(\"squares(5) should end with 25\" = isTRUE(all.equal(squares(5), c(1, 4, 9, 16, 25))))","solution":"squares \u003c- function(n) {\n  sapply(1:n, function(i) i^2)\n}"}]},{"title":"strings & factors","teach":{"text":"nchar() counts characters (spaces too), toupper()/tolower() change case, paste() joins with a space and paste0() with nothing. A factor stores categories with a fixed set of levels, sorted alphabetically unless you set levels = yourself.","code":"nchar(\"Mia\")               # [1] 3\ntoupper(\"mia\")             # [1] \"MIA\"\npaste(\"big\", \"cat\")        # [1] \"big cat\"\npaste0(\"cat\", 1:2)         # [1] \"cat1\" \"cat2\"\nf \u003c- factor(c(\"tabby\", \"black\", \"tabby\"))\nlevels(f)                  # [1] \"black\" \"tabby\""},"ex":[{"id":"r.1.2.0","hint":"","kind":"output","q":"What does this print?","code":"nchar(\"kedi\")","accept":["[1] 4"],"solution":"[1] 4"},{"id":"r.1.2.1","hint":"","kind":"output","q":"What does this print?","code":"toupper(\"cat\")","accept":["[1] \"CAT\""],"solution":"[1] \"CAT\""},{"id":"r.1.2.2","hint":"paste0 has no separator.","kind":"output","q":"What does this print?","code":"paste0(\"a\", \"b\")","accept":["[1] \"ab\""],"solution":"[1] \"ab\""},{"id":"r.1.2.4","hint":"Levels are sorted alphabetically by default.","kind":"output","q":"What does this print?","code":"f \u003c- factor(c(\"b\", \"a\", \"b\"))\nlevels(f)","accept":["[1] \"a\" \"b\""],"solution":"[1] \"a\" \"b\""},{"id":"r.1.2.n1","hint":"paste() would put a space before the !; paste0() does not.","kind":"code","q":"Write `shout(name)` that returns the name in capitals followed directly by \"!\", e.g. shout(\"mia\") gives \"MIA!\". It should work on a vector of names too.","setup":"","starter":"shout \u003c- function(name) {\n  \n}","tests":"stopifnot(\"shout(\\\"mia\\\") should be MIA!\" = identical(shout(\"mia\"), \"MIA!\"))\nstopifnot(\"shout(\\\"Tom\\\") should be TOM!\" = identical(shout(\"Tom\"), \"TOM!\"))\nstopifnot(\"shout(c(\\\"a\\\", \\\"b\\\")) should be A! B!\" = identical(shout(c(\"a\", \"b\")), c(\"A!\", \"B!\")))","solution":"shout \u003c- function(name) {\n  paste0(toupper(name), \"!\")\n}"}]},{"title":"dplyr basics","teach":{"text":"dplyr verbs take a data frame first and return a new one: filter() keeps rows, select() keeps columns, mutate() adds columns, and group_by() + summarise() gives one row per group. The pipe %>% (or |>) passes the left side in as the first argument, so steps read top to bottom.","code":"library(dplyr)\ncats %>%\n  filter(age > 1) %>%              # keep rows\n  mutate(kg = grams / 1000) %>%    # add a column\n  group_by(colour) %>%\n  summarise(avg = mean(kg))        # one row per colour\n# base R filter + select:\ncats[cats$age > 1, c(\"name\", \"age\")]"},"ex":[{"id":"r.1.3.0","hint":"","kind":"write","q":"Keep rows of df where age > 3 with dplyr:","code":"","accept":["filter(df, age > 3)","df %>% filter(age > 3)","df |> filter(age > 3)"],"solution":"filter(df, age > 3)"},{"id":"r.1.3.1","hint":"","kind":"write","q":"Keep only the name and age columns of df (dplyr):","code":"","accept":["select(df, name, age)","df %>% select(name, age)","df |> select(name, age)","select(df, c(name, age))"],"solution":"select(df, name, age)"},{"id":"r.1.3.2","hint":"","kind":"write","q":"The pipe operator sends the left result into the next function:","code":"","accept":["%>% (or |>)","%>%","|>"],"solution":"%>% (or |>)"},{"id":"r.1.3.3","hint":"","kind":"write","q":"Add a column age_months (age × 12) to df with dplyr:","code":"","accept":["mutate(df, age_months = age * 12)","df %>% mutate(age_months = age * 12)","df |> mutate(age_months = age * 12)","mutate(df, age_months = 12 * age)"],"solution":"mutate(df, age_months = age * 12)"},{"id":"r.1.3.4","hint":"","kind":"write","q":"Average age per colour with dplyr:","code":"","accept":["df %>% group_by(colour) %>% summarise(m = mean(age))"],"solution":"df %>% group_by(colour) %>% summarise(m = mean(age))"},{"id":"r.1.3.n1","hint":"avg only exists after summarise(); group first so there is one row per colour.","kind":"order","q":"Arrange the dplyr pipeline: average weight per colour, keeping only colours whose average is above 4.","pieces":["  group_by(colour) %>%","  summarise(avg = mean(weight)) %>%","  filter(avg > 4)","cats %>%","  summarise(avg = mean(colour)) %>%"],"tests":"","setup":"","solution":"cats %>%\n  group_by(colour) %>%\n  summarise(avg = mean(weight)) %>%\n  filter(avg > 4)"},{"id":"r.1.3.n2","hint":"df[row condition, c(\"col1\", \"col2\")] — or subset(cats, age > 3, select = c(name, weight)).","kind":"code","q":"Base R version of filter + select: the data frame `cats` has columns name, colour, age and weight. Create `old_cats` with only the name and weight columns, for cats older than 3.","setup":"cats \u003c- data.frame(name = c(\"Mia\", \"Tom\", \"Leo\", \"Zoe\"), colour = c(\"white\", \"black\", \"white\", \"black\"), age = c(2, 5, 9, 3), weight = c(3.5, 5, 6.1, 4.2))","starter":"old_cats \u003c- ","tests":"stopifnot(\"old_cats should have just the columns name and weight\" = identical(names(old_cats), c(\"name\", \"weight\")))\nstopifnot(\"old_cats should hold Tom and Leo (Zoe is exactly 3)\" = identical(old_cats$name, c(\"Tom\", \"Leo\")))\nstopifnot(\"weights should be 5 and 6.1\" = isTRUE(all.equal(old_cats$weight, c(5, 6.1))))","solution":"old_cats \u003c- cats[cats$age > 3, c(\"name\", \"weight\")]"}]}]},{"title":"Plots & Stats","lessons":[{"title":"base plots","teach":{"text":"Base R draws straight away: plot(x, y) for a scatter, hist(v) for the spread of one numeric variable, and barplot(table(f)) for counts of categories. Options are named arguments: main = for the title, xlab/ylab for axis labels, type = \"l\" for a line.","code":"age \u003c- c(1, 3, 6, 8)\nw   \u003c- c(3.5, 4.2, 5.1, 4.8)\nplot(age, w, main = \"Cats\", xlab = \"age\", ylab = \"kg\")\nplot(age, w, type = \"l\")     # joined by a line\nhist(w)                      # distribution of one variable\nbarplot(table(c(\"black\", \"white\", \"black\")))   # one bar per category"},"ex":[{"id":"r.2.0.0","hint":"","kind":"write","q":"Scatter plot of y against x:","code":"","accept":["plot(x, y)","plot(y ~ x)"],"solution":"plot(x, y)"},{"id":"r.2.0.1","hint":"","kind":"write","q":"Histogram of a vector v:","code":"","accept":["hist(v)"],"solution":"hist(v)"},{"id":"r.2.0.2","hint":"","kind":"write","q":"Bar chart of counts of a factor f:","code":"","accept":["barplot(table(f))"],"solution":"barplot(table(f))"},{"id":"r.2.0.3","hint":"","kind":"write","q":"Base plot of y against x with the title \"Cats\":","code":"","accept":["plot(x, y, main = \"Cats\")","plot(x, y, main = 'Cats')","plot(y ~ x, main = \"Cats\")"],"solution":"plot(x, y, main = \"Cats\")"},{"id":"r.2.0.4","hint":"","kind":"write","q":"Base plot of y against x drawn as a line instead of points:","code":"","accept":["plot(x, y, type = \"l\")","plot(x, y, type = 'l')","plot(y ~ x, type = \"l\")"],"solution":"plot(x, y, type = \"l\")"},{"id":"r.2.0.n1","hint":"table() counts; sort(..., decreasing = TRUE) puts the biggest first.","kind":"code","q":"Before barplot() can draw, it needs counts. The vector `colours` holds each cat's colour. Create `counts`, the table of colours sorted from most to least common.","setup":"colours \u003c- c(\"black\", \"white\", \"black\", \"ginger\", \"white\", \"black\")","starter":"counts \u003c- ","tests":"stopifnot(\"counts should be a table of the colours\" = inherits(counts, \"table\"))\nstopifnot(\"most common first: black, white, ginger\" = identical(names(counts), c(\"black\", \"white\", \"ginger\")))\nstopifnot(\"the counts should be 3, 2, 1\" = isTRUE(all.equal(as.vector(counts), c(3, 2, 1))))","solution":"counts \u003c- sort(table(colours), decreasing = TRUE)"}]},{"title":"ggplot2","teach":{"text":"ggplot(data, aes(...)) sets up the plot and maps columns to x, y, colour and so on; layers such as geom_point() are added with +, not with the pipe. Mappings to columns go inside aes(); a fixed setting like colour = \"red\" goes in the geom, outside aes().","code":"library(ggplot2)\nggplot(cats, aes(x = age, y = weight, colour = colour)) +\n  geom_point() +               # one point per row\n  labs(title = \"Cats by age\")\n# a fixed colour, not mapped to data:\n#   geom_point(colour = \"red\")"},"ex":[{"id":"r.2.1.0","hint":"","kind":"write","q":"Load ggplot2:","code":"","accept":["library(ggplot2)","library(\"ggplot2\")","require(ggplot2)"],"solution":"library(ggplot2)"},{"id":"r.2.1.1","hint":"","kind":"write","q":"Start a ggplot of age vs weight from df:","code":"","accept":["ggplot(df, aes(x = age, y = weight))","ggplot(df, aes(age, weight))","ggplot(data = df, aes(x = age, y = weight))","ggplot(df, mapping = aes(x = age, y = weight))","df %>% ggplot(aes(x = age, y = weight))","df |> ggplot(aes(x = age, y = weight))"],"solution":"ggplot(df, aes(x = age, y = weight))"},{"id":"r.2.1.2","hint":"","kind":"write","q":"Add points to a ggplot:","code":"","accept":["+ geom_point()","geom_point()"],"solution":"+ geom_point()"},{"id":"r.2.1.3","hint":"Mappings to data go inside aes().","kind":"write","q":"Colour points by a column colour:","code":"","accept":["aes(x = age, y = weight, colour = colour)"],"solution":"aes(x = age, y = weight, colour = colour)"},{"id":"r.2.1.n1","hint":"Load the package first; every layer except the last ends in +.","kind":"order","q":"Arrange the lines to draw a titled scatter plot of weight against age.","pieces":["ggplot(cats, aes(x = age, y = weight)) +","  geom_point() +","  labs(title = \"Cats\")","  geom_point() %>%","library(ggplot2)"],"tests":"","setup":"","solution":"library(ggplot2)\nggplot(cats, aes(x = age, y = weight)) +\n  geom_point() +\n  labs(title = \"Cats\")"},{"id":"r.2.1.n2","hint":"Build the data frame first, then keep rows where both columns are not NA (combine with &). na.omit(pts) also works.","kind":"code","q":"ggplot needs one data frame, and it drops rows with NA (with a warning). The vectors `age` and `weight` are paired by position. Create `pts`, a data frame with columns age and weight, keeping only rows where neither value is NA.","setup":"age \u003c- c(1, 3, NA, 7, 9)\nweight \u003c- c(3.1, 4.5, 5, NA, 6.2)","starter":"pts \u003c- ","tests":"stopifnot(\"pts should have columns age and weight\" = identical(names(pts), c(\"age\", \"weight\")))\nstopifnot(\"pts should keep the 3 complete rows\" = nrow(pts) == 3)\nstopifnot(\"pairs must stay together: ages 1, 3, 9 with weights 3.1, 4.5, 6.2\" = isTRUE(all.equal(pts$age, c(1, 3, 9))) && isTRUE(all.equal(pts$weight, c(3.1, 4.5, 6.2))))","solution":"pts \u003c- data.frame(age = age, weight = weight)\npts \u003c- pts[!is.na(pts$age) & !is.na(pts$weight), ]"}]},{"title":"summary stats","teach":{"text":"mean() is pulled by extreme values; median() (the middle value) is not. sd() measures spread and is the square root of var(); cor(x, y) measures linear association from -1 to 1; table() counts each distinct value.","code":"x \u003c- c(1, 3, 100)\nmean(x)          # [1] 34.66667\nmedian(x)        # [1] 3\nsd(c(2, 4, 6))   # [1] 2   (var is 4)\ncor(1:5, c(2, 4, 6, 8, 10))   # [1] 1\ntable(c(\"a\", \"b\", \"a\"))       # a: 2, b: 1\nsummary(x)       # Min, 1st Qu., Median, Mean, 3rd Qu., Max"},"ex":[{"id":"r.2.2.0","hint":"","kind":"write","q":"Median of c(1, 3, 100):","code":"","accept":["[1] 3","3"],"solution":"[1] 3"},{"id":"r.2.2.1","hint":"","kind":"write","q":"Standard deviation of x:","code":"","accept":["sd(x)","sqrt(var(x))"],"solution":"sd(x)"},{"id":"r.2.2.3","hint":"","kind":"write","q":"Correlation between x and y:","code":"","accept":["cor(x, y)","cor(y, x)"],"solution":"cor(x, y)"},{"id":"r.2.2.4","hint":"","kind":"write","q":"Frequency table of a vector v:","code":"","accept":["table(v)"],"solution":"table(v)"},{"id":"r.2.2.n1","hint":"Remove the NA before computing anything.","kind":"order","q":"Arrange the lines to compute the coefficient of variation (sd divided by mean) of the weights, after dropping the NA.","pieces":["w \u003c- w[!is.na(w)]","s \u003c- sd(w)","m \u003c- mean(w)","s \u003c- std(w)","cv \u003c- s / m","w \u003c- c(4.2, NA, 5.0, 3.6)"],"tests":"stopifnot(\"cv should be sd / mean of 4.2, 5.0, 3.6\" = isTRUE(all.equal(cv, sd(c(4.2, 5, 3.6)) / mean(c(4.2, 5, 3.6)))))","setup":"","solution":"w \u003c- c(4.2, NA, 5.0, 3.6)\nw \u003c- w[!is.na(w)]\nm \u003c- mean(w)\ns \u003c- sd(w)\ncv \u003c- s / m"},{"id":"r.2.2.n2","hint":"Brackets matter: (x - mean(x)) / sd(x).","kind":"code","q":"Write `zscore(x)` that standardises x: subtract the mean, then divide by the standard deviation.","setup":"","starter":"zscore \u003c- function(x) {\n  \n}","tests":"stopifnot(\"zscore(c(2, 4, 6)) should be -1 0 1\" = isTRUE(all.equal(zscore(c(2, 4, 6)), c(-1, 0, 1))))\nstopifnot(\"zscore(c(1, 2, 9)) should use the mean (4), not the median\" = isTRUE(all.equal(zscore(c(1, 2, 9)), (c(1, 2, 9) - 4) / sd(c(1, 2, 9)))))","solution":"zscore \u003c- function(x) {\n  (x - mean(x)) / sd(x)\n}"}]}]},{"title":"Tidy Data","lessons":[{"title":"arrange & distinct","teach":{"text":"arrange() sorts rows (wrap a column in desc() for largest first), distinct() keeps unique rows, count() tallies rows per group into a column n, and rename(new = old) renames. In base R, order() returns row POSITIONS, so df[order(df$col), ] sorts a data frame.","code":"cats %>% arrange(desc(age))    # oldest first\ncats %>% distinct(colour)      # one row per colour\ncats %>% count(colour)         # columns colour, n\ncats %>% rename(years = age)   # new = old\n# base R\norder(c(5, 2, 9))              # [1] 2 1 3   (positions)\ncats[order(cats$age), ]        # youngest first"},"ex":[{"id":"r.3.0.0","hint":"","kind":"write","q":"Sort df by age, oldest first (dplyr):","code":"","accept":["arrange(df, desc(age))","arrange(df, -age)","df %>% arrange(desc(age))","df |> arrange(desc(age))"],"solution":"arrange(df, desc(age))"},{"id":"r.3.0.1","hint":"","kind":"write","q":"Unique values of the colour column of df (dplyr):","code":"","accept":["distinct(df, colour)","df %>% distinct(colour)","df |> distinct(colour)"],"solution":"distinct(df, colour)"},{"id":"r.3.0.2","hint":"","kind":"write","q":"Count rows per colour in df (dplyr):","code":"","accept":["count(df, colour)","df %>% count(colour)","df |> count(colour)"],"solution":"count(df, colour)"},{"id":"r.3.0.3","hint":"","kind":"write","q":"Rename column age to years in df (dplyr):","code":"","accept":["rename(df, years = age)","df %>% rename(years = age)","df |> rename(years = age)"],"solution":"rename(df, years = age)"},{"id":"r.3.0.4","hint":"","kind":"write","q":"Base R equivalent of arrange(df, age):","code":"","accept":["df[order(df$age), ]","df[order(df[[\"age\"]]), ]"],"solution":"df[order(df$age), ]"},{"id":"r.3.0.n1","hint":"count() creates the column n; sort before taking the top 3.","kind":"order","q":"Arrange the dplyr pipeline: the three most common colours, most common first.","pieces":["  arrange(desc(n)) %>%","  head(3)","  count(colour) %>%","  arrange(desc(colour)) %>%","cats %>%"],"tests":"","setup":"","solution":"cats %>%\n  count(colour) %>%\n  arrange(desc(n)) %>%\n  head(3)"},{"id":"r.3.0.n2","hint":"order() gives row positions; use them inside df[ , ] and then head().","kind":"code","q":"Base R version of arrange + head: write `oldest(df, n)` that returns the n oldest rows of df (column age), oldest first.","setup":"cats \u003c- data.frame(name = c(\"Mia\", \"Tom\", \"Leo\", \"Zoe\"), age = c(2, 5, 9, 3))","starter":"oldest \u003c- function(df, n) {\n  \n}","tests":"stopifnot(\"oldest(cats, 2) should give Leo then Tom\" = identical(oldest(cats, 2)$name, c(\"Leo\", \"Tom\")))\nstopifnot(\"oldest(cats, 1) should give Leo\" = identical(oldest(cats, 1)$name, \"Leo\"))\nstopifnot(\"oldest(cats, 4) should give all 4 rows\" = nrow(oldest(cats, 4)) == 4)","solution":"oldest \u003c- function(df, n) {\n  head(df[order(df$age, decreasing = TRUE), ], n)\n}"}]},{"title":"joins in dplyr","teach":{"text":"A join matches rows of two tables on a key column. left_join() keeps every row of the left table (NA where there is no match), inner_join() keeps only matches, and anti_join() keeps left rows with NO match. When key names differ use by = c(\"left_key\" = \"right_key\"); base R merge() does the same (all.x = TRUE for a left join).","code":"cats   \u003c- data.frame(name = c(\"Mia\", \"Tom\", \"Leo\"), owner_id = c(1, 2, 9))\nowners \u003c- data.frame(owner_id = c(1, 2), owner = c(\"Ali\", \"Bea\"))\nleft_join(cats, owners, by = \"owner_id\")    # 3 rows; Leo gets owner NA\ninner_join(cats, owners, by = \"owner_id\")   # 2 rows\nanti_join(cats, owners, by = \"owner_id\")    # just Leo\nmerge(cats, owners, by = \"owner_id\", all.x = TRUE)   # base R left join"},"ex":[{"id":"r.3.1.0","hint":"","kind":"write","q":"Keep all rows of cats, adding info from owners where it exists (key owner_id):","code":"","accept":["left_join(cats, owners, by = \"owner_id\")","left_join(cats, owners, by = join_by(owner_id))","cats %>% left_join(owners, by = \"owner_id\")","cats |> left_join(owners, by = \"owner_id\")","merge(cats, owners, by = \"owner_id\", all.x = TRUE)"],"solution":"left_join(cats, owners, by = \"owner_id\")"},{"id":"r.3.1.1","hint":"","kind":"write","q":"The dplyr join that keeps only rows that match in both tables:","code":"","accept":["inner_join","inner_join()"],"solution":"inner_join"},{"id":"r.3.1.2","hint":"","kind":"write","q":"Rows of cats WITHOUT a match in owners (key owner_id):","code":"","accept":["anti_join(cats, owners, by = \"owner_id\")","anti_join(cats, owners, by = join_by(owner_id))","cats %>% anti_join(owners, by = \"owner_id\")","cats |> anti_join(owners, by = \"owner_id\")"],"solution":"anti_join(cats, owners, by = \"owner_id\")"},{"id":"r.3.1.3","hint":"","kind":"write","q":"The by argument to join owner_id (left table) to id (right table):","code":"","accept":["by = c(\"owner_id\" = \"id\")","c(\"owner_id\" = \"id\")","by = join_by(owner_id == id)"],"solution":"by = c(\"owner_id\" = \"id\")"},{"id":"r.3.1.4","hint":"","kind":"write","q":"Stack data frames a and b (same columns) on top of each other:","code":"","accept":["bind_rows(a, b)","rbind(a, b)"],"solution":"bind_rows(a, b)"},{"id":"r.3.1.n1","hint":"Join first so the owner column exists; select(name) drops owner, so it comes last 3.2.0","hint":"","kind":"write","q":"Wide → long (tidyr):","code":"","accept":["pivot_longer(df, cols = c(jan, feb), names_to = \"month\", values_to = \"n\")"],"solution":"pivot_longer(df, cols = c(jan, feb), names_to = \"month\", values_to = \"n\")"},{"id":"r.3.2.1","hint":"","kind":"write","q":"Long → wide:","code":"","accept":["pivot_wider(df, names_from = month, values_from = n)"],"solution":"pivot_wider(df, names_from = month, values_from = n)"},{"id":"r.3.2.3","hint":"","kind":"write","q":"Split \"2026-09\" into year and month columns:","code":"","accept":["separate(df, ym, into = c(\"year\", \"month\"), sep = \"-\")"],"solution":"separate(df, ym, into = c(\"year\", \"month\"), sep = \"-\")"},{"id":"r.3.2.n1","hint":"rep(x, each = 2) repeats each element; rep(x, 2) repeats the whole vector.","kind":"code","q":"Pivot longer by hand (base R). `wide` has columns name, jan and feb. Create `long` with columns name, month and n: one row per cat per month, all the jan rows first, then the feb rows.","setup":"wide \u003c- data.frame(name = c(\"Mia\", \"Tom\"), jan = c(4, 5), feb = c(4.2, 5.3))","starter":"long \u003c- data.frame(\n  name = ,\n  month = ,\n  n = \n)","tests":"stopifnot(\"long should have columns name, month, n\" = identical(names(long), c(\"name\", \"month\", \"n\")))\nstopifnot(\"long should have 4 rows\" = nrow(long) == 4)\nstopifnot(\"month should be jan, jan, feb, feb\" = identical(long$month, c(\"jan\", \"jan\", \"feb\", \"feb\")))\nstopifnot(\"name should be Mia, Tom, Mia, Tom\" = identical(long$name, c(\"Mia\", \"Tom\", \"Mia\", \"Tom\")))\nstopifnot(\"n should be 4, 5, 4.2, 5.3\" = isTRUE(all.equal(long$n, c(4, 5, 4.2, 5.3))))","solution":"long \u003c- data.frame(\n  name = rep(wide$name, 2),\n  month = rep(c(\"jan\", \"feb\"), each = nrow(wide)),\n  n = c(wide$jan, wide$feb)\n)"}]}]},{"title":"Modelling Basics","lessons":[{"title":"linear model","teach":{"text":"lm(y ~ x, data = df) fits a straight line, modelling y by x (outcome on the left of ~). summary() shows coefficients, p-values and R-squared; coef() gives just the numbers; predict() applies the model to new data. The slope is how much y changes on average for each extra unit of x.","code":"df \u003c- data.frame(age = c(1, 2, 3, 4), weight = c(3, 3.5, 4, 4.5))\nm \u003c- lm(weight ~ age, data = df)\ncoef(m)       # (Intercept) 2.5   age 0.5\nsummary(m)    # coefficients, p-values, R-squared\npredict(m, newdata = data.frame(age = 6))   # 5.5"},"ex":[{"id":"r.4.0.0","hint":"","kind":"write","q":"Fit a linear model of weight on age using df:","code":"","accept":["lm(weight ~ age, data = df)","lm(weight ~ age, df)","lm(formula = weight ~ age, data = df)","lm(data = df, weight ~ age)"],"solution":"lm(weight ~ age, data = df)"},{"id":"r.4.0.1","hint":"","kind":"write","q":"See coefficients and p-values of model m:","code":"","accept":["summary(m)"],"solution":"summary(m)"},{"id":"r.4.0.4","hint":"","kind":"write","q":"Predict for new data:","code":"","accept":["predict(m, newdata = data.frame(age = 4))"],"solution":"predict(m, newdata = data.frame(age = 4))"},{"id":"r.4.0.n1","hint":"The outcome (weight) goes on the left of ~.","kind":"order","q":"Arrange the lines: make the data, fit weight on age, then predict the weight at age 10.","pieces":["new \u003c- data.frame(age = 10)","m \u003c- lm(age ~ weight, data = df)","m \u003c- lm(weight ~ age, data = df)","df \u003c- data.frame(age = c(1, 2, 3), weight = c(3, 4, 5))","pred \u003c- predict(m, newdata = new)"],"tests":"stopifnot(\"pred should be 12\" = isTRUE(all.equal(unname(pred), 12)))","setup":"","solution":"df \u003c- data.frame(age = c(1, 2, 3), weight = c(3, 4, 5))\nm \u003c- lm(weight ~ age, data = df)\nnew \u003c- data.frame(age = 10)\npred \u003c- predict(m, newdata = new)"},{"id":"r.4.0.n2","hint":"coef(m) gives the intercept first, then the slope; coef(m)[\"age\"] picks the slope by name.","kind":"code","q":"The data frame `df` has columns age and weight. Fit `m`, a linear model of weight on age, and store the slope (the age coefficient) in `slope`.","setup":"df \u003c- data.frame(age = c(1, 2, 3, 4, 5), weight = c(3.1, 3.4, 4.2, 4.4, 5.0))","starter":"m \u003c- \nslope \u003c- ","tests":"stopifnot(\"m should be a model made by lm()\" = inherits(m, \"lm\"))\nstopifnot(\"model weight on age: weight ~ age\" = identical(names(coef(m)), c(\"(Intercept)\", \"age\")))\nstopifnot(\"slope should be the age coefficient (0.48), not the intercept\" = isTRUE(all.equal(unname(slope), 0.48)))","solution":"m \u003c- lm(weight ~ age, data = df)\nslope \u003c- coef(m)[\"age\"]"}]},{"title":"t-test & p-values","teach":{"text":"t.test(y ~ group, data = df) compares the means of two groups. A p-value below 0.05 is usually called significant; it is NOT the chance that the result is right. If the 95% confidence interval for the difference contains 0, the difference is not significant. set.seed() makes random numbers repeatable.","code":"set.seed(42)\nw \u003c- rnorm(20, mean = 4)      # the same numbers on every run\nres \u003c- t.test(weight ~ colour, data = df)\nres$p.value     # e.g. 0.03: significant at 0.05\nres$conf.int    # contains 0? then not significant\ncor(df$age, df$weight)   # -1 to 1; correlation is not causation"},"ex":[{"id":"r.4.1.0","hint":"","kind":"write","q":"t-test comparing mean weight of white vs black cats (columns weight, colour in df):","code":"","accept":["t.test(weight ~ colour, data = df)","t.test(weight ~ colour, df)","t.test(formula = weight ~ colour, data = df)"],"solution":"t.test(weight ~ colour, data = df)"},{"id":"r.4.1.4","hint":"","kind":"write","q":"Set the random seed to 42 for reproducibility:","code":"","accept":["set.seed(42)"],"solution":"set.seed(42)"},{"id":"r.4.1.n1","hint":"Set the seed before drawing any random numbers.","kind":"order","q":"Arrange the lines: simulate two groups reproducibly (group a first), compare them with a t-test, and keep the p-value.","pieces":["a \u003c- rnorm(30, mean = 5)","b \u003c- rnorm(30, mean = 6)","res \u003c- t.test(a, b)","set.seed(1)","res \u003c- t.test(a ~ b)","p \u003c- res$p.value"],"tests":"set.seed(1)\n.a \u003c- rnorm(30, mean = 5)\n.b \u003c- rnorm(30, mean = 6)\nstopifnot(\"seed first, then a, then b\" = isTRUE(all.equal(p, t.test(.a, .b)$p.value)))","setup":"","solution":"set.seed(1)\na \u003c- rnorm(30, mean = 5)\nb \u003c- rnorm(30, mean = 6)\nres \u003c- t.test(a, b)\np \u003c- res$p.value"},{"id":"r.4.1.n2","hint":"The test result is a list; $p.value pulls out the p-value.","kind":"code","q":"The data frame `df` has columns weight and colour (\"white\" or \"black\"). Run a t-test of weight by colour, store its p-value in `p`, and store TRUE/FALSE in `significant` (p below 0.05).","setup":"df \u003c- data.frame(weight = c(4.1, 4.5, 3.9, 4.3, 5.2, 5.6, 5.0, 5.4), colour = rep(c(\"white\", \"black\"), each = 4))","starter":"p \u003c- \nsignificant \u003c- ","tests":"stopifnot(\"p should be a single number\" = is.numeric(p) && length(p) == 1)\nstopifnot(\"p should come from t.test(weight ~ colour, data = df)\" = isTRUE(all.equal(unname(p), t.test(weight ~ colour, data = df)$p.value)))\nstopifnot(\"significant should be TRUE when p \u003c 0.05\" = identical(unname(significant), unname(p) \u003c 0.05))","solution":"p \u003c- t.test(weight ~ colour, data = df)$p.value\nsignificant \u003c- p \u003c 0.05"}]}]}]}]};
const SUBJ = Object.fromEntries(DATA.subjects.map(s => [s.key, s]));
const KIND = { code: 'Write code', order: 'Puzzle', output: 'Predict the output', write: 'Write it', query: 'Query' };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

// flat index: each exercise knows its subject, unit, lesson and number
const EX = {}, ORDER = {};
for (const s of DATA.subjects) {
  ORDER[s.key] = [];
  s.units.forEach((u, ui) => u.lessons.forEach((l, li) => l.ex.forEach(e => {
    Object.assign(e, { s: s.key, ui, li, n: ORDER[s.key].length + 1 }); EX[e.id] = e; ORDER[s.key].push(e.id);
  })));
}
function title(e) {
  const sentences = e.q.split(/(?<=[.!?])\s+(?=[A-Z])/);
  if (e.kind === 'query') return md(sentences[sentences.length - 1]);
  if (e.kind === 'output') return `Predict: <code>${esc(e.code.split('\n').find(l => l.trim()) || '')}</code>`;
  // skip sentences that only describe what already exists ("The list `prices` exists.")
  const task = sentences.find(x => !/\b(already|exists?|is given|are given)\b/i.test(x)) || sentences[0];
  return md(task.replace(/^(With|Using) [^,]{1,40}, (\w)/, (m, a, c) => c.toUpperCase()));
}

/* ---------- SQL (sql.js) ---------- */
const SQLJS = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/';
let sqlLib = null;
function loadSQL() {
  if (!sqlLib) sqlLib = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = SQLJS + 'sql-wasm.js';
    sc.onload = () => initSqlJs({ locateFile: f => SQLJS + f }).then(res, rej); sc.onerror = rej;
    document.head.appendChild(sc);
  }).catch(() => { sqlLib = null; return null; });
  return sqlLib;
}
function sqlRun(lib, stmt, check) {
  const db = new lib.Database();
  try {
    db.run(SUBJ.sql.db || '');
    let r = db.exec(stmt); if (check) r = db.exec(check);
    const last = r[r.length - 1]; return { cols: last ? last.columns : [], rows: last ? last.values : [] };
  } catch (e) { return { err: e.message }; } finally { db.close(); }
}
function sqlOrdered(ref) { let s = ref, p; do { p = s; s = s.replace(/\([^()]*\)/g, ''); } while (s !== p); return /\border\s+by\b/i.test(s); }
function sqlJudge(lib, user, q) {
  const want = sqlRun(lib, q.sql, q.check), got = sqlRun(lib, user, q.check);
  if (want.err || got.err) return { ok: false, got, want };
  const ordered = q.ordered != null ? q.ordered : sqlOrdered(q.sql);
  const key = r => JSON.stringify(r.map(v => typeof v === 'number' ? Math.round(v * 1e6) / 1e6 : v));

  } finally { btn.disabled = false; st.textContent = ''; }
  if (ok) {
    const first = !P.solved[e.id]; P.solved[e.id] = Date.now(); save();
    const ids = ORDER[e.s], next = ids.slice(ids.indexOf(e.id) + 1).find(id => !P.solved[id]) || ids[ids.indexOf(e.id) + 1];
    out.innerHTML = `<div class="result ok"><h2>Bravo! You solved it.</h2>${html}${next ? `<div><a class="btn primary" style="display:inline-block;text-decoration:none" href="#/${e.s}/${encodeURIComponent(next)}">Next exercise</a></div>` : '<p>That was the last one in this language.</p>'}</div>`;
    document.getElementById('solBtn').hidden = false;
    if (first) document.querySelector('.head').insertAdjacentHTML('beforeend', '<span class="tag" style="background:var(--ok-bg);color:var(--ok-text)">Solved</span>');
  } else {
    P.fails[e.id] = (P.fails[e.id] || 0) + 1; save();
    out.innerHTML = `<div class="result bad"><h2>Not yet</h2>${html}</div>`;
    document.getElementById('solBtn').hidden = false;
  }
  out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- routing ---------- */
function settings() {
  tabs('');
  const dark = document.documentElement.dataset.theme === 'dark';
  main.innerHTML = `<h1>Settings</h1><p class="sub">Saved in this browser.</p>
    <div class="setting"><div><b>Theme</b><p>Light is white and blue. Dark is easier on the eyes at night.</p></div>
      <div class="seg" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="${!dark}">Light</button><button data-theme="dark" aria-pressed="${dark}">Dark</button></div></div>`;
  main.querySelectorAll('.seg button').forEach(b => b.onclick = () => { setTheme(b.dataset.theme); settings(); });
}
function setTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#1e2a33' : '#1d9fe6';
  try { localStorage.setItem('brighterCode.theme', t); } catch (e) {}
}
if (document.documentElement.dataset.theme === 'dark') document.querySelector('meta[name=theme-color]').content = '#1e2a33';

function route() {
  const [, sk, id] = location.hash.split('/').map(decodeURIComponent);
  keysEl.hidden = true; document.body.classList.remove('typing');
  if (sk === 'settings') { cur = null; settings(); window.scrollTo(0, 0); }
  else if (sk && id && EX[id]) exercisePage(id);
  else if (sk && SUBJ[sk]) { cur = null; list(sk); window.scrollTo(0, 0); }
  else { cur = null; home(); }
}
window.addEventListener('hashchange', route);
route();
</script>
