<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Brighter Code</title>
<meta name="theme-color" content="#1d9fe6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Brighter Code">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>try { if (localStorage.getItem('brighterCode.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {   /* light (default): white and blue, like AnkiDroid */
  --nav: #1d9fe6; --nav-text: #ffffff; --nav-active: #ffffff;
  --bg: #ffffff; --panel: #ffffff; --text: #1b1f22; --muted: #5f6b74; --line: #e2e7eb;
  --accent: #1d9fe6; --accent-text: #ffffff; --link: #1565c0; --done: #43a047;
  --ok-bg: #e8f5e9; --ok-line: #a5d6a7; --ok-text: #1b5e20;
  --bad-bg: #fdecea; --bad-line: #f5b5b0; --bad-text: #8e1c16;
  --info-bg: #e8f4fd; --info-line: #b9dcf6;
  --code-bg: #f3f6f8; --editor-bg: #ffffff; --tag: #e3f2fd; --tag-text: #1565c0; --key: #ffffff; --key-bar: #dfe7ed;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --nav: #1e2a33; --nav-text: #e8eef2; --nav-active: #64b5f6;
  --bg: #1c1f22; --panel: #25292d; --text: #e6eaed; --muted: #9aa5ad; --line: #353b41;
  --accent: #1a86c4; --accent-text: #ffffff; --link: #7ab8ec; --done: #66bb6a;
  --ok-bg: #1d3524; --ok-line: #2f6b3d; --ok-text: #a8e2b4;
  --bad-bg: #3a2224; --bad-line: #7a3a3e; --bad-text: #f1b1b1;
  --info-bg: #1f2e3b; --info-line: #34506a;
  --code-bg: #1b1f23; --editor-bg: #1b1f23; --tag: #243745; --tag-text: #9ccdf3; --key: #353b41; --key-bar: #141719;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 "Source Sans 3", "Segoe UI", system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: var(--link); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
code, pre, textarea.ed, .mono { font-family: var(--mono); }

nav.top { background: var(--nav); color: var(--nav-text); padding: env(safe-area-inset-top, 0px) 16px 0; position: sticky; top: 0; z-index: 5; }
nav.top .in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 18px; min-height: 52px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 19px; color: var(--nav-text); text-decoration: none; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand .mark { font-family: var(--mono); color: var(--nav-active); font-size: 16px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs a { color: var(--nav-text); text-decoration: none; padding: 14px 10px 12px; border-bottom: 3px solid transparent; font-weight: 600; opacity: .85; }
.tabs a.on { border-bottom-color: var(--nav-active); opacity: 1; }
.gear { color: var(--nav-text); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; opacity: .9; }
.gear:hover { background: rgba(255,255,255,.14); }
.gear svg { width: 22px; height: 22px; fill: currentColor; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; max-width: 560px; }
.setting p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--panel); color: var(--accent); padding: 7px 16px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

main { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 20px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 18px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 24px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* exercise list */
details.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
details.unit > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: baseline; gap: 12px; }
details.unit > summary::-webkit-details-marker { display: none; }
details.unit > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; display: inline-block; }
details.unit[open] > summary::before { transform: rotate(90deg); }
details.unit > summary .count { margin-left: auto; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lesson { padding: 0 16px 10px; }
.lesson h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 4px; font-weight: 600; }
ol.ex { list-style: none; margin: 0; padding: 0; }
ol.ex a { display: grid; grid-template-columns: 22px 2.1em 1fr auto; align-items: baseline; gap: 8px; padding: 9px 4px; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; }
ol.ex a:hover { background: var(--bg); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; transform: translateY(2px); }
.dot.ok { background: var(--done); border-color: var(--done); position: relative; }
.dot.ok::after { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.num { color: var(--muted); font-variant-numeric: tabular-nums; }
.ttl { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
.ttl code { font-size: .88em; }
.tag { font-size: 12px; background: var(--tag); color: var(--tag-text); padding: 1px 8px; border-radius: 10px; white-space: nowrap; font-weight: 600; }

/* exercise page */
.crumbs { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.statement { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
.statement p { margin: 0; max-width: 68ch; }
.statement code, .note code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: .88em; }
pre.block { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; font-size: 14px; line-height: 1.55; overflow-x: auto; white-space: pre; }
.lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; color: var(--link); font-weight: 600; }
details.more[open] summary { margin-bottom: 8px; }
.tables { display: grid; gap: 12px; }
.tscroll { overflow-x: auto; }
table.t { border-collapse: collapse; font-size: 13px; font-family: var(--mono); }
table.t th, table.t td { border: 1px solid var(--line); padding: 3px 7px; text-align: left; white-space: nowrap; }
table.t th { background: var(--code-bg); }
table.t td.null { color: var(--muted); font-style: italic; }

.editor { margin-top: 18px; }
.edwrap { display: flex; background: var(--editor-bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.edwrap:focus-within { border-color: var(--link); }
.gutter { padding: 10px 6px 10px 10px; color: var(--muted); font: 14px/1.6 var(--mono); text-align: right; user-select: none; white-space: pre; opacity: .7; min-width: 2.4em; background: var(--code-bg); }
textarea.ed { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font-size: 14px; line-height: 1.6; padding: 10px 12px; resize: none; min-height: 9.6em; outline: none; white-space: pre; overflow-x: auto; tab-size: 4; }
textarea.ed.plain { white-space: pre-wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 16px; border-radius: 5px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); padding-inline: 22px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.link { border: 0; background: none; color: var(--link); padding-inline: 6px; }
.status { color: var(--muted); font-size: 15px; }

.result { margin-top: 16px; border: 1px solid; border-radius: 6px; padding: 12px 16px; display: grid; gap: 8px; }
.result h2 { font-size: 18px; }
.result.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-text); }
.result.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad-text); }
.result.info { background: var(--info-bg); border-color: var(--info-line); color: var(--text); }
.result pre { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); background: var(--panel); border-radius: 4px; padding: 8px 10px; }
.result .cmp { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.result .cmp > div { min-width: 0; }
.note { background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 6px; padding: 10px 14px; margin-top: 12px; }
.note p { margin: 0; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
.pager a { text-decoration: none; font-weight: 600; max-width: 48%; }

/* symbol keys above the phone keyboard */
.keys { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); background: var(--key-bar); padding: 5px 4px calc(5px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; gap: 5px; box-shadow: 0 -2px 8px rgba(0,0,0,.15); }
.keys .row { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-inline: 2px; }
.keys .row::-webkit-scrollbar { display: none; }
.keys button { flex: none; min-width: 38px; height: 38px; padding: 0 9px; border: 0; border-radius: 5px; background: var(--key); color: var(--text); font: 15px var(--mono); box-shadow: 0 1px 0 rgba(0,0,0,.2); touch-action: manipulation; }
.keys .row.words button { font-size: 13px; height: 34px; }
.keys button:active { filter: brightness(.9); }
body.typing main { padding-bottom: 120px; }
@media (hover: hover) and (pointer: fine) { .keys { display: none; } }
@media (max-width: 520px) { h1 { font-size: 23px; } ol.ex a { grid-template-columns: 22px 2em 1fr; } ol.ex .tag { display: none; } .tabs a { padding-inline: 7px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const DATA = {"subjects":[{"key":"python","name":"Python","units":[{"title":"Python Basics","lessons":[{"title":"print & strings","teach":{"text":"print() shows a value on screen. + joins strings exactly as they are (it never adds a space for you), * repeats a string, and len() counts its characters.","code":"print(\"Hi\" + \" \" + \"cat\")   # Hi cat\nprint(\"Hi\" + \"cat\")         # Hicat  (no space added)\nprint(\"ab\" * 3)             # ababab\nprint(len(\"meow\"))          # 4\nprint()                     # an empty line"},"ex":[{"id":"python.0.0.0","hint":"","kind":"output","q":"What does this print?","code":"print(\"Hi\" + \" \" + \"cat\")","accept":["Hi cat"],"solution":"Hi cat"},{"id":"python.0.0.1","hint":"Multiplying a string repeats it.","kind":"output","q":"What does this print?","code":"print(\"ab\" * 3)","accept":["ababab"],"solution":"ababab"},{"id":"python.0.0.2","hint":"print( ... )","kind":"write","q":"Write the code to print the number 42 (no quotes needed).","code":"","accept":["print(42)"],"solution":"print(42)"},{"id":"python.0.0.3","hint":"","kind":"output","q":"What does this print?","code":"print(len(\"hello\"))","accept":["5"],"solution":"5"},{"id":"python.0.0.n1","hint":"Use * to repeat and len() to count.","kind":"code","q":"A variable `word` already holds a string. Make a variable `line` that is word repeated 3 times, and a variable `size` that is the length of line.","setup":"word = \"purr\"","starter":"","tests":"assert line == \"purrpurrpurr\", \"line should be word three times: purrpurrpurr\"\nassert size == 12, \"size should be len(line), which is 12\"","solution":"line = word * 3\nsize = len(line)"}]},{"title":"variables","teach":{"text":"A variable is a name for a value; = stores the value. The right-hand side is worked out FIRST, so x = x + 2 uses the old x. Names can't start with a digit, and \"3\" + \"4\" joins text rather than adding.","code":"x = 5\nx = x + 2         # right side first: 5 + 2\nprint(x)          # 7\na, b = 1, 2\na, b = b, a       # swap in one line\nprint(a, b)       # 2 1\nprint(\"3\" + \"4\")  # 34  (text, not maths)"},"ex":[{"id":"python.0.1.0","hint":"","kind":"output","q":"What does this print?","code":"x = 5\nx = x + 2\nprint(x)","accept":["7"],"solution":"7"},{"id":"python.0.1.2","hint":"Both are strings, so + joins them.","kind":"output","q":"What does this print?","code":"a = \"3\"\nb = \"4\"\nprint(a + b)","accept":["34"],"solution":"34"},{"id":"python.0.1.3","hint":"","kind":"output","q":"What does this print?","code":"a, b = 1, 2\na, b = b, a\nprint(a, b)","accept":["2 1"],"solution":"2 1"},{"id":"python.0.1.4","hint":"Strings need quotes.","kind":"write","q":"Assign the string cat to a variable called pet.","code":"","accept":["pet = \"cat\"","pet = 'cat'","pet=\"cat\"","pet='cat'"],"solution":"pet = \"cat\""},{"id":"python.0.1.n1","hint":"a, b = b, a — or use a temporary variable.","kind":"code","q":"Variables `a` and `b` already exist. Swap them, so a holds b's old value and b holds a's old value.","setup":"a = \"tuna\"\nb = \"milk\"","starter":"","tests":"assert a == \"milk\", \"a should now be milk\"\nassert b == \"tuna\", \"b should now be tuna (did you overwrite a before copying it?)\"","solution":"a, b = b, a"},{"id":"python.0.1.n2","hint":"Save a somewhere safe before you overwrite it.","kind":"order","q":"Swap a and b using a temporary variable.","pieces":["b = a","a = b","tmp = a","a = \"tuna\"","b = \"milk\"","b = tmp"],"tests":"assert a == \"milk\" and b == \"tuna\", \"a should be milk and b tuna\"","setup":"","solution":"a = \"tuna\"\nb = \"milk\"\ntmp = a\na = b\nb = tmp"}]},{"title":"data types","teach":{"text":"int is a whole number, float has a decimal point, str is text and bool is True/False. / always gives a float, // divides and rounds down, % is the remainder. 0, \"\" and empty things are False; any non-empty string (even \"0\") is True.","code":"print(type(3.0))         # \u003cclass 'float'>\nprint(7 / 2, 6 / 2)      # 3.5 3.0\nprint(7 // 2, 7 % 2)     # 3 1\nprint(int(\"12\") + 1)     # 13\nprint(bool(0), bool(\"0\"))  # False True"},"ex":[{"id":"python.0.2.0","hint":"","kind":"write","q":"What is type(3.0)?","code":"","accept":["float","\u003cclass 'float'>"],"solution":"float"},{"id":"python.0.2.1","hint":"/ always gives a float.","kind":"output","q":"What does this print?","code":"print(7 / 2)","accept":["3.5"],"solution":"3.5"},{"id":"python.0.2.2","hint":"// floors, % is the remainder.","kind":"output","q":"What does this print?","code":"print(7 // 2, 7 % 2)","accept":["3 1"],"solution":"3 1"},{"id":"python.0.2.3","hint":"","kind":"output","q":"What does this print?","code":"print(int(\"12\") + 1)","accept":["13"],"solution":"13"},{"id":"python.0.2.4","hint":"A non-empty string is truthy, even \"0\".","kind":"output","q":"What does this print?","code":"print(bool(0), bool(\"\"), bool(\"0\"))","accept":["False False True"],"solution":"False False True"},{"id":"python.0.2.n1","hint":"// gives whole hours, % gives the remainder.","kind":"code","q":"The variable `minutes` holds a whole number. Make `hours` the number of whole hours and `left` the minutes left over (e.g. 135 → 2 and 15).","setup":"minutes = 135","starter":"","tests":"assert hours == 2, \"hours should be 2 (use // for whole hours)\"\nassert isinstance(hours, int), \"hours should be a whole number (int), not a float\"\nassert left == 15, \"left should be 15 (use % for the remainder)\"","solution":"hours = minutes // 60\nleft = minutes % 60"}]},{"title":"string tricks","teach":{"text":"Positions start at 0 and -1 is the last character. A slice s[a:b] stops BEFORE b. Strings can't be changed in place: s[0] = \"b\" is a TypeError, and methods like .upper() return a NEW string.","code":"s = \"python\"\nprint(s[0], s[-1])   # p n\nprint(s[1:4])        # yth  (positions 1, 2, 3)\nt = s.upper()        # s itself is unchanged\nprint(s, t)          # python PYTHON\nprint(\"a,b\".split(\",\"))  # ['a', 'b']"},"ex":[{"id":"python.0.3.0","hint":"","kind":"output","q":"What does this print?","code":"s = \"python\"\nprint(s[0], s[-1])","accept":["p n"],"solution":"p n"},{"id":"python.0.3.1","hint":"Slice stops BEFORE the end index.","kind":"output","q":"What does this print?","code":"s = \"python\"\nprint(s[1:4])","accept":["yth"],"solution":"yth"},{"id":"python.0.3.2","hint":"Strings are immutable.","kind":"write","q":"What happens?","code":"s = \"cat\"\ns[0] = \"b\"\nprint(s)","accept":["TypeError","error","an error","a TypeError"],"solution":"TypeError"},{"id":"python.0.3.3","hint":".upper() returns a NEW string; s is unchanged.","kind":"output","q":"What does this print?","code":"s = \"cat\"\nt = s.upper()\nprint(s, t)","accept":["cat CAT"],"solution":"cat CAT"},{"id":"python.0.3.4","hint":"","kind":"output","q":"What does this print?","code":"print(\"a,b,c\".split(\",\"))","accept":["['a', 'b', 'c']"],"solution":"['a', 'b', 'c']"},{"id":"python.0.3.n1","hint":"word[-1] is the last letter; word[1:-1] drops both ends.","kind":"code","q":"The variable `word` holds a string. Make `ends` its first and last letters joined together, and `middle` everything except the first and last letters (e.g. \"kitten\" → \"kn\" and \"itte\").","setup":"word = \"kitten\"","starter":"","tests":"assert ends == \"kn\", \"ends should be the first + last letters: kn\"\nassert middle == \"itte\", \"middle should be itte — remember a slice stops before its end index\"","solution":"ends = word[0] + word[-1]\nmiddle = word[1:-1]"}]},{"title":"input & f-strings","teach":{"text":"input() always gives back a str, so wrap it in int() or float() for numbers. An f-string f\"...\" fills in whatever is inside {braces}, even a calculation. round() can surprise you because floats are stored in binary.","code":"age = int(input(\"Age? \"))  # typed \"3\" becomes 3\nname = \"Allie\"\nprint(f\"Hi {name}!\")       # Hi Allie!\nprint(f\"{age * 2} cats\")   # 6 cats\nprint(round(2.675, 2))     # 2.67  (really 2.67499...)"},"ex":[{"id":"python.0.4.0","hint":"","kind":"write","q":"input() always returns which type?","code":"","accept":["str","string","\u003cclass 'str'>"],"solution":"str"},{"id":"python.0.4.1","hint":"","kind":"output","q":"What does this print?","code":"name = \"Allie\"\nprint(f\"Hi {name}!\")","accept":["Hi Allie!"],"solution":"Hi Allie!"},{"id":"python.0.4.2","hint":"","kind":"output","q":"What does this print?","code":"n = 3\nprint(f\"{n * 2} cats\")","accept":["6 cats"],"solution":"6 cats"},{"id":"python.0.4.4","hint":"Floating point surprise: 2.675 is stored slightly below 2.675.","kind":"output","q":"What does this print?","code":"print(round(2.675, 2))","accept":["2.67"],"solution":"2.67"},{"id":"python.0.4.n1","hint":"Put an f before the quotes and the variables in {braces}.","kind":"code","q":"Variables `name` (a string) and `lives` (an int) exist. Using an f-string, make `msg` read like \"Tom has 9 lives\".","setup":"name = \"Tom\"\nlives = 9","starter":"","tests":"assert msg == \"Tom has 9 lives\", \"msg should be exactly: Tom has 9 lives (got \" + repr(msg) + \")\"","solution":"msg = f\"{name} has {lives} lives\""},{"id":"python.0.4.n2","hint":"Turn the text into a number before multiplying.","kind":"order","q":"A can of tuna costs \"4\" (text). Work out the price of 3 cans and print it.","pieces":["total = price * 3","print(f\"3 cans cost {total}\")","n = int(price)","price = \"4\"","total = n * 3"],"tests":"assert total == 12, \"total should be the number 12 (convert the text first!)\"","setup":"","solution":"price = \"4\"\nn = int(price)\ntotal = n * 3\nprint(f\"3 cans cost {total}\")"}]}]},{"title":"Control Flow","lessons":[{"title":"if / elif / else","teach":{"text":"Python checks the conditions top to bottom and runs ONLY the first branch that is true, then skips the rest. 0, \"\" and empty lists count as False. Comparisons can chain: 3 \u003c 5 \u003c 4 means 3 \u003c 5 and 5 \u003c 4.","code":"x = 10\nif x > 5:\n    print(\"big\")      # runs, then the whole if is done\nelif x > 8:\n    print(\"huge\")     # skipped, even though it is true\nelse:\n    print(\"small\")\nprint(1 \u003c 3 \u003c 2)      # False  (1 \u003c 3 and 3 \u003c 2)\nprint(not 1 == 2)     # True   (not applies last)"},"ex":[{"id":"python.1.0.0","hint":"Only the first true branch runs.","kind":"output","q":"What does this print?","code":"x = 10\nif x > 5:\n    print(\"big\")\nelif x > 8:\n    print(\"huge\")\nelse:\n    print(\"small\")","accept":["big"],"solution":"big"},{"id":"python.1.0.1","hint":"","kind":"output","q":"What does this print?","code":"x = 0\nif x:\n    print(\"yes\")\nelse:\n    print(\"no\")","accept":["no"],"solution":"no"},{"id":"python.1.0.2","hint":"== compares values, is compares identity.","kind":"output","q":"What does this print?","code":"a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b)","accept":["True False"],"solution":"True False"},{"id":"python.1.0.3","hint":"Chained comparison: 3\u003c5 and 5\u003c4.","kind":"output","q":"What does this print?","code":"print(3 \u003c 5 \u003c 4)","accept":["False"],"solution":"False"},{"id":"python.1.0.4","hint":"","kind":"output","q":"What does this print?","code":"print(not 1 == 2)","accept":["True"],"solution":"True"},{"id":"python.1.0.n1","hint":"Test the smallest range first: only the first true branch runs.","kind":"code","q":"The variable `weight` exists. Set `label` to \"small\" if weight is under 4, \"medium\" if it is under 8, and \"large\" otherwise.","setup":"weight = 2","starter":"","tests":"assert label == \"small\", \"weight 2 should be small — check the order of your conditions\"","solution":"if weight \u003c 4:\n    label = \"small\"\nelif weight \u003c 8:\n    label = \"medium\"\nelse:\n    label = \"large\""}]},{"title":"for loops","teach":{"text":"A for loop runs its body once per item. range(n) gives 0 up to n-1 — it stops BEFORE n. range(start, stop, step) counts in steps, and break leaves the loop straight away.","code":"for i in range(3):\n    print(i, end=\" \")   # 0 1 2\nfor i in range(1, 10, 4):\n    print(i, end=\" \")   # 1 5 9\ntotal = 0\nfor n in [1, 2, 3]:\n    total += n          # total is 6 afterwards"},"ex":[{"id":"python.1.1.0","hint":"","kind":"output","q":"What does this print?","code":"for i in range(3):\n    print(i, end=\" \")","accept":["0 1 2"],"solution":"0 1 2"},{"id":"python.1.1.1","hint":"","kind":"output","q":"What does this print?","code":"total = 0\nfor n in [1, 2, 3]:\n    total += n\nprint(total)","accept":["6"],"solution":"6"},{"id":"python.1.1.2","hint":"","kind":"output","q":"What does this print?","code":"for i in range(1, 10, 4):\n    print(i, end=\" \")","accept":["1 5 9"],"solution":"1 5 9"},{"id":"python.1.1.3","hint":"","kind":"output","q":"What does this print?","code":"for c in \"hey\":\n    print(c.upper(), end=\"\")","accept":["HEY"],"solution":"HEY"},{"id":"python.1.1.4","hint":"","kind":"output","q":"What does this print?","code":"for i in range(5):\n    if i == 2:\n        break\n    print(i, end=\" \")","accept":["0 1"],"solution":"0 1"},{"id":"python.1.1.n1","hint":"Start both counters at 0 BEFORE the loop.","kind":"code","q":"The list `prices` exists. With a for loop, make `total` the sum of all prices and `big` how many prices are MORE than 5.","setup":"prices = [3, 8, 5, 6]","starter":"","tests":"assert total == 22, \"total should be 22\"\nassert big == 2, \"big should be 2 (5 is not more than 5)\"","solution":"total = 0\nbig = 0\nfor p in prices:\n    total += p\n    if p > 5:\n        big += 1"},{"id":"python.1.1.n2","hint":"range stops BEFORE its end number.","kind":"order","q":"Build a list of the squares of 1 to 5: [1, 4, 9, 16, 25].","pieces":["for i in range(1, 6):","print(squares)","    squares.append(i * i)","squares.append(i * i)","squares = []","for i in range(1, 5):"],"tests":"assert squares == [1, 4, 9, 16, 25], \"squares should be [1, 4, 9, 16, 25]\"","setup":"","solution":"squares = []\nfor i in range(1, 6):\n    squares.append(i * i)\nprint(squares)"}]},{"title":"while & loop traps","teach":{"text":"while repeats as long as its condition is true, so something inside must change. continue skips to the next round, break stops the loop. Reassigning the loop variable doesn't change the list, and a for loop's else runs only if no break happened.","code":"n = 3\nwhile n > 0:\n    n -= 1           # 2, 1, 0 -> now n > 0 is False\nprint(n)             # 0\nfor i in range(3):\n    if i == 1:\n        continue     # skip 1\n    print(i)         # 0 then 2\nprint(i)             # 2  (i still exists after the loop)"},"ex":[{"id":"python.1.2.0","hint":"","kind":"output","q":"What does this print?","code":"n = 3\nwhile n > 0:\n    n -= 1\nprint(n)","accept":["0"],"solution":"0"},{"id":"python.1.2.1","hint":"The loop variable survives after the loop.","kind":"output","q":"What does this print?","code":"for i in range(3):\n    pass\nprint(i)","accept":["2"],"solution":"2"},{"id":"python.1.2.2","hint":"Rebinding n does not touch the list.","kind":"output","q":"What does this print?","code":"nums = [1, 2, 3]\nfor n in nums:\n    n = n * 2\nprint(nums)","accept":["[1, 2, 3]"],"solution":"[1, 2, 3]"},{"id":"python.1.2.3","hint":"","kind":"output","q":"What does this print?","code":"for i in range(3):\n    if i == 1:\n        continue\n    print(i, end=\" \")","accept":["0 2"],"solution":"0 2"},{"id":"python.1.2.4","hint":"for-else runs else when the loop was not broken.","kind":"output","q":"What does this print?","code":"for i in range(2):\n    print(i)\nelse:\n    print(\"done\")","accept":["0 1 done (on 3 lines)"],"solution":"0 1 done (on 3 lines)"},{"id":"python.1.2.n1","hint":"Keep going while n > 1.","kind":"code","q":"The variable `n` holds a whole number above 1. Using a while loop, count how many times you can halve it with // before it reaches 1, and store the count in `steps` (e.g. 8 → 4 → 2 → 1 is 3 steps).","setup":"n = 20","starter":"","tests":"assert steps == 4, \"20 -> 10 -> 5 -> 2 -> 1 is 4 steps\"","solution":"steps = 0\nwhile n > 1:\n    n = n // 2\n    steps += 1"}]},{"title":"functions","teach":{"text":"def makes a reusable function and return hands a value back — with no return you get None. Defaults fill in missing arguments, keyword arguments can come in any order. Rebinding a parameter never affects the caller, but changing a list you were given does.","code":"def add(a, b=2):\n    return a + b\nprint(add(3))          # 5  (b defaults to 2)\nprint(add(b=1, a=4))   # 5\ndef hello():\n    print(\"hi\")        # prints, returns nothing\nx = hello()            # hi\nprint(x)               # None"},"ex":[{"id":"python.1.3.0","hint":"","kind":"output","q":"What does this print?","code":"def add(a, b=2):\n    return a + b\nprint(add(3))","accept":["5"],"solution":"5"},{"id":"python.1.3.1","hint":"No return means the function returns None.","kind":"output","q":"What does this print?","code":"def f():\n    print(\"hi\")\nx = f()\nprint(x)","accept":["hi then None"],"solution":"hi then None"},{"id":"python.1.3.2","hint":"Ints are immutable; x is a local name.","kind":"output","q":"What does this print?","code":"def f(x):\n    x = x + 1\nn = 5\nf(n)\nprint(n)","accept":["5"],"solution":"5"},{"id":"python.1.3.3","hint":"Lists are mutable and shared through the parameter (aliasing).","kind":"output","q":"What does this print?","code":"def f(lst):\n    lst.append(9)\nn = [1]\nf(n)\nprint(n)","accept":["[1, 9]"],"solution":"[1, 9]"},{"id":"python.1.3.4","hint":"","kind":"output","q":"What does this print?","code":"def f(x, y):\n    return x * y\nprint(f(y=2, x=3))","accept":["6"],"solution":"6"},{"id":"python.1.3.n1","hint":"Return AFTER the loop has finished (watch the indentation).","kind":"code","q":"Write a function `count_vowels(word)` that RETURNS how many vowels (a, e, i, o, u) are in word.","setup":"","starter":"def count_vowels(word):\n    ","tests":"assert count_vowels(\"cat\") == 1, \"count_vowels('cat') should be 1\"\nassert count_vowels(\"banana\") == 3, \"count_vowels('banana') should be 3\"\nassert count_vowels(\"aeiou\") == 5, \"count_vowels('aeiou') should be 5\"\nassert count_vowels(\"rhythm\") == 0, \"count_vowels('rhythm') should be 0\"\nassert count_vowels(\"\") == 0, \"count_vowels('') should be 0 (did you return?)\"","solution":"def count_vowels(word):\n    n = 0\n    for c in word:\n        if c in \"aeiou\":\n            n += 1\n    return n"},{"id":"python.1.3.n2","hint":"Start from the first number, and only return once the loop is done.","kind":"order","q":"Write `biggest(nums)` that returns the largest number in a non-empty list (it must work for negative numbers too).","pieces":["            best = n","        if n > best:","    return best","    best = 0","    best = nums[0]","        return best","    for n in nums:","def biggest(nums):"],"tests":"assert biggest([3, 9, 2]) == 9, \"biggest([3, 9, 2]) should be 9\"\nassert biggest([-5, -2, -8]) == -2, \"biggest([-5, -2, -8]) should be -2\"","setup":"","solution":"def biggest(nums):\n    best = nums[0]\n    for n in nums:\n        if n > best:\n            best = n\n    return best"}]}]},{"title":"Collections","lessons":[{"title":"list aliasing","teach":{"text":"b = a does NOT copy a list: both names point at the same list, so a change made through one shows up in the other. a[:] or list(a) makes a real copy. a = a + [x] builds a NEW list, but a += [x] changes the existing one.","code":"a = [1, 2]\nb = a          # one list, two names\nb.append(3)\nprint(a)       # [1, 2, 3]\nc = a[:]       # a real copy\nc.append(4)\nprint(a)       # [1, 2, 3]  (unchanged)"},"ex":[{"id":"python.2.0.0","hint":"b = a makes b another name for the SAME list.","kind":"output","q":"What does this print?","code":"a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)","accept":["[1, 2, 3, 4]"],"solution":"[1, 2, 3, 4]"},{"id":"python.2.0.1","hint":"a[:] makes a copy.","kind":"output","q":"What does this print?","code":"a = [1, 2, 3]\nb = a[:]\nb.append(4)\nprint(a)","accept":["[1, 2, 3]"],"solution":"[1, 2, 3]"},{"id":"python.2.0.2","hint":"a + [3] builds a NEW list; b still points at the old one.","kind":"output","q":"What does this print?","code":"a = [1, 2]\nb = a\na = a + [3]\nprint(b)","accept":["[1, 2]"],"solution":"[1, 2]"},{"id":"python.2.0.3","hint":"+= on a list mutates in place (extend).","kind":"output","q":"What does this print?","code":"a = [1, 2]\nb = a\na += [3]\nprint(b)","accept":["[1, 2, 3]"],"solution":"[1, 2, 3]"},{"id":"python.2.0.4","hint":"The outer * copies references to the same inner list.","kind":"output","q":"What does this print?","code":"x = [[0] * 2] * 2\nx[0][0] = 9\nprint(x)","accept":["[[9, 0], [9, 0]]"],"solution":"[[9, 0], [9, 0]]"},{"id":"python.2.0.n1","hint":"cats + [name] or cats[:] builds a new list.","kind":"code","q":"Write `add_cat(cats, name)` that returns a NEW list with name added at the end, WITHOUT changing the original list.","setup":"","starter":"def add_cat(cats, name):\n    ","tests":"orig = [\"Tom\"]\nres = add_cat(orig, \"Mia\")\nassert res == [\"Tom\", \"Mia\"], \"add_cat(['Tom'], 'Mia') should return ['Tom', 'Mia']\"\nassert orig == [\"Tom\"], \"the original list must not change — make a copy first\"\nassert add_cat([], \"Leo\") == [\"Leo\"], \"add_cat([], 'Leo') should return ['Leo']\"","solution":"def add_cat(cats, name):\n    return cats + [name]"}]},{"title":"list methods","teach":{"text":".sort() sorts the list in place and returns None; sorted(x) returns a NEW sorted list and leaves x alone. [::-1] gives a reversed copy, .pop() removes (and returns) the last item, .index(v) finds a position and \"in\" checks membership.","code":"a = [3, 1, 2]\nb = sorted(a)      # b = [1, 2, 3], a unchanged\nr = a.sort()       # a is now [1, 2, 3], r is None\nprint(a[::-1])     # [3, 2, 1]\na.pop()            # removes 3\nprint(a.index(2), 5 in a)   # 1 False"},"ex":[{"id":"python.2.1.0","hint":".sort() sorts in place and returns None.","kind":"output","q":"What does this print?","code":"a = [3, 1, 2]\nb = a.sort()\nprint(b)","accept":["None"],"solution":"None"},{"id":"python.2.1.1","hint":"","kind":"output","q":"What does this print?","code":"a = [3, 1, 2]\nb = sorted(a)\nprint(a, b)","accept":["[3, 1, 2] [1, 2, 3]"],"solution":"[3, 1, 2] [1, 2, 3]"},{"id":"python.2.1.2","hint":"","kind":"output","q":"What does this print?","code":"a = [1, 2, 3, 4]\nprint(a[::-1])","accept":["[4, 3, 2, 1]"],"solution":"[4, 3, 2, 1]"},{"id":"python.2.1.3","hint":"","kind":"output","q":"What does this print?","code":"a = [1, 2, 3]\na.pop()\nprint(a, len(a))","accept":["[1, 2] 2"],"solution":"[1, 2] 2"},{"id":"python.2.1.4","hint":"","kind":"output","q":"What does this print?","code":"a = [1, 2, 3]\nprint(a.index(2), 5 in a)","accept":["1 False"],"solution":"1 False"},{"id":"python.2.1.n1","hint":"sorted(..., reverse=True) then slice the first three.","kind":"code","q":"Write `top_three(scores)` that returns the three highest scores, highest first, without changing the scores list.","setup":"","starter":"def top_three(scores):\n    ","tests":"s = [5, 1, 9, 7, 3]\nassert top_three(s) == [9, 7, 5], \"top_three([5, 1, 9, 7, 3]) should be [9, 7, 5]\"\nassert s == [5, 1, 9, 7, 3], \"don't change the original list — use sorted()\"\nassert top_three([2, 2, 1, 8]) == [8, 2, 2], \"top_three([2, 2, 1, 8]) should be [8, 2, 2]\"","solution":"def top_three(scores):\n    return sorted(scores, reverse=True)[:3]"}]},{"title":"comprehension order","teach":{"text":"A list comprehension reads [expression for x in items if condition]: the expression comes first and the filter last. With two fors, the FIRST one is the outer loop. An if/else written before the for chooses a value — it doesn't filter.","code":"print([x * 2 for x in range(4)])            # [0, 2, 4, 6]\nprint([x for x in range(6) if x % 2 == 0])  # [0, 2, 4]\nprint([a + b for a in \"xy\" for b in \"12\"])  # ['x1', 'x2', 'y1', 'y2']\nprint([\"big\" if x > 1 else \"small\" for x in range(3)])\n# ['small', 'small', 'big']"},"ex":[{"id":"python.2.2.0","hint":"","kind":"output","q":"What does this print?","code":"print([x * 2 for x in range(4)])","accept":["[0, 2, 4, 6]"],"solution":"[0, 2, 4, 6]"},{"id":"python.2.2.1","hint":"Order is: expression, for, if.","kind":"output","q":"What does this print?","code":"print([x for x in range(6) if x % 2 == 0])","accept":["[0, 2, 4]"],"solution":"[0, 2, 4]"},{"id":"python.2.2.3","hint":"The first for is the OUTER loop.","kind":"output","q":"What does this print?","code":"print([a + b for a in \"xy\" for b in \"12\"])","accept":["['x1', 'x2', 'y1', 'y2']"],"solution":"['x1', 'x2', 'y1', 'y2']"},{"id":"python.2.2.4","hint":"if/else BEFORE the for is a conditional expression, not a filter.","kind":"output","q":"What does this print?","code":"print([\"odd\" if x % 2 else \"even\" for x in range(3)])","accept":["['even', 'odd', 'even']"],"solution":"['even', 'odd', 'even']"},{"id":"python.2.2.n1","hint":"[expression for w in words if condition]","kind":"code","q":"Write `long_upper(words)` that uses a list comprehension to return the words longer than 3 letters, in UPPER case.","setup":"","starter":"def long_upper(words):\n    return ","tests":"assert long_upper([\"cat\", \"tiger\", \"lion\", \"ox\"]) == [\"TIGER\", \"LION\"], \"long_upper(['cat', 'tiger', 'lion', 'ox']) should be ['TIGER', 'LION']\"\nassert long_upper([]) == [], \"long_upper([]) should be []\"","solution":"def long_upper(words):\n    return [w.upper() for w in words if len(w) > 3]"},{"id":"python.2.2.n2","hint":"== compares; return after the loop.","kind":"order","q":"Write `evens(nums)` that returns the even numbers from nums, in order.","pieces":["    return out","        if n % 2 = 0:","    out = []","        return out","            out.append(n)","    for n in nums:","        if n % 2 == 0:","def evens(nums):"],"tests":"assert evens([1, 2, 3, 4]) == [2, 4], \"evens([1, 2, 3, 4]) should be [2, 4]\"\nassert evens([7]) == [], \"evens([7]) should be []\"\nassert evens([]) == [], \"evens([]) should be []\"","setup":"","solution":"def evens(nums):\n    out = []\n    for n in nums:\n        if n % 2 == 0:\n            out.append(n)\n    return out"}]},{"title":"dictionaries","teach":{"text":"A dict maps keys to values. d[\"k\"] reads a value (KeyError if missing), while d.get(\"k\", default) never crashes. Assigning to a new key adds it. Looping over a dict gives its keys; .items() gives (key, value) pairs.","code":"d = {\"a\": 1}\nd[\"b\"] = 2               # add a new key\nprint(d.get(\"z\", 0))     # 0  (no KeyError)\nfor k, v in d.items():\n    print(k, v)          # a 1 / b 2\ncounts = {}\nfor c in \"aab\":\n    counts[c] = counts.get(c, 0) + 1\nprint(counts)            # {'a': 2, 'b': 1}"},"ex":[{"id":"python.2.3.0","hint":"","kind":"output","q":"What does this print?","code":"d = {\"a\": 1, \"b\": 2}\nprint(d[\"b\"])","accept":["2"],"solution":"2"},{"id":"python.2.3.1","hint":"","kind":"output","q":"What does this print?","code":"d = {\"a\": 1}\nprint(d.get(\"z\", 0))","accept":["0"],"solution":"0"},{"id":"python.2.3.2","hint":"","kind":"output","q":"What does this print?","code":"d = {}\nd[\"x\"] = 1\nd[\"x\"] += 1\nprint(d)","accept":["{'x': 2}"],"solution":"{'x': 2}"},{"id":"python.2.3.3","hint":"Iterating a dict gives its keys.","kind":"output","q":"What does this print?","code":"d = {\"a\": 1, \"b\": 2}\nfor k in d:\n    print(k, end=\"\")","accept":["ab"],"solution":"ab"},{"id":"python.2.3.4","hint":"","kind":"output","q":"What does this print?","code":"d = {\"a\": 1, \"b\": 2}\nprint(list(d.items())[0])","accept":["('a', 1)"],"solution":"('a', 1)"},{"id":"python.2.3.n1","hint":"d.get(c, 0) + 1 works whether or not c is there yet.","kind":"code","q":"Write `count_letters(word)` that returns a dict mapping each letter to how many times it appears.","setup":"","starter":"def count_letters(word):\n    ","tests":"assert count_letters(\"aab\") == {\"a\": 2, \"b\": 1}, \"count_letters('aab') should be {'a': 2, 'b': 1}\"\nassert count_letters(\"\") == {}, \"count_letters('') should be {}\"\nassert count_letters(\"moon\") == {\"m\": 1, \"o\": 2, \"n\": 1}, \"count_letters('moon') should be {'m': 1, 'o': 2, 'n': 1}\"","solution":"def count_letters(word):\n    d = {}\n    for c in word:\n        d[c] = d.get(c, 0) + 1\n    return d"},{"id":"python.2.3.n2","hint":"A new key needs = (assignment), not == (comparison).","kind":"order","q":"Count how many cats have each colour in the list `cats`.","pieces":["for c in cats:","        counts[c] += 1","    if c in counts:","        counts[c] == 1","counts = {}","    else:","        counts[c] = 1"],"tests":"assert counts == {\"black\": 2, \"white\": 1}, \"counts should be {'black': 2, 'white': 1}\"","setup":"cats = [\"black\", \"white\", \"black\"]","solution":"counts = {}\nfor c in cats:\n    if c in counts:\n        counts[c] += 1\n    else:\n        counts[c] = 1"}]}]},{"title":"Tuples, Sets & Traps","lessons":[{"title":"tuples","teach":{"text":"A tuple like (1, 2, 3) is a list you can't change: t[0] = 9 is a TypeError. A one-item tuple needs a comma — (5) is just 5, (5,) is a tuple. Unpacking (a, b = ...) works on any sequence, and a list INSIDE a tuple can still change.","code":"t = (1, 2, 3)\nprint(t[0], len(t))          # 1 3\nprint(type((5)), type((5,))) # \u003cclass 'int'> \u003cclass 'tuple'>\nx, y = \"ab\"                  # x = 'a', y = 'b'\nt2 = (1, [2])\nt2[1].append(3)              # allowed: the LIST changes\nprint(t2)                    # (1, [2, 3])"},"ex":[{"id":"python.3.0.0","hint":"","kind":"output","q":"What does this print?","code":"t = (1, 2, 3)\nprint(t[0], len(t))","accept":["1 3"],"solution":"1 3"},{"id":"python.3.0.1","hint":"Tuples are immutable.","kind":"write","q":"What happens?","code":"t = (1, 2)\nt[0] = 9","accept":["TypeError","error","an error","a TypeError"],"solution":"TypeError"},{"id":"python.3.0.2","hint":"A one-item tuple needs a comma: (5,).","kind":"write","q":"What is type((5))?","code":"","accept":["int","\u003cclass 'int'>"],"solution":"int"},{"id":"python.3.0.3","hint":"Unpacking works on any sequence.","kind":"output","q":"What does this print?","code":"a, b, c = \"xyz\"\nprint(b)","accept":["y"],"solution":"y"},{"id":"python.3.0.4","hint":"The tuple is immutable, but the list inside it is not.","kind":"output","q":"What does this print?","code":"t = (1, [2, 3])\nt[1].append(4)\nprint(t)","accept":["(1, [2, 3, 4])"],"solution":"(1, [2, 3, 4])"},{"id":"python.3.0.n1","hint":"return a, b gives back a tuple.","kind":"code","q":"Write `min_max(nums)` that returns a TUPLE (smallest, largest) for a non-empty list.","setup":"","starter":"def min_max(nums):\n    ","tests":"assert min_max([3, 1, 4]) == (1, 4), \"min_max([3, 1, 4]) should be (1, 4)\"\nassert min_max([7]) == (7, 7), \"min_max([7]) should be (7, 7)\"\nassert isinstance(min_max([2, 5]), tuple), \"return a tuple, not a list\"","solution":"def min_max(nums):\n    return min(nums), max(nums)"}]},{"title":"sets","teach":{"text":"A set keeps only unique items, in no particular order. | is union (in either), & is intersection (in both). {} is an empty DICT — use set() for an empty set.","code":"s = {1, 2, 2, 3}\nprint(len(s))            # 3  (duplicates vanish)\nprint({1, 2} | {2, 3})   # {1, 2, 3}\nprint({1, 2} & {2, 3})   # {2}\nempty = set()            # {} would be a dict!\nprint(len(set(\"book\")))  # 3  (b, o, k)"},"ex":[{"id":"python.3.1.0","hint":"","kind":"output","q":"What does this print?","code":"print(len({1, 2, 2, 3, 3}))","accept":["3"],"solution":"3"},{"id":"python.3.1.1","hint":"| is union, & is intersection.","kind":"output","q":"What does this print?","code":"print({1, 2} | {2, 3})","accept":["{1, 2, 3}"],"solution":"{1, 2, 3}"},{"id":"python.3.1.2","hint":"","kind":"output","q":"What does this print?","code":"print({1, 2, 3} & {2, 3, 4})","accept":["{2, 3}"],"solution":"{2, 3}"},{"id":"python.3.1.3","hint":"{} is an empty dict.","kind":"write","q":"How do you make an EMPTY set?","code":"","accept":["set()"],"solution":"set()"},{"id":"python.3.1.4","hint":"h e l o — the second l is dropped.","kind":"output","q":"What does this print?","code":"s = set(\"hello\")\nprint(len(s))","accept":["4"],"solution":"4"},{"id":"python.3.1.n1","hint":"Turn both into sets, then use &.","kind":"code","q":"Write `shared_toys(a, b)` that returns a SET of the toys that appear in both lists a and b.","setup":"","starter":"def shared_toys(a, b):\n    ","tests":"assert shared_toys([\"ball\", \"mouse\", \"string\"], [\"mouse\", \"box\", \"ball\"]) == {\"ball\", \"mouse\"}, \"should be {'ball', 'mouse'}\"\nassert shared_toys([], [\"box\"]) == set(), \"nothing shared should give an empty set()\"\nassert shared_toys([\"box\", \"box\"], [\"box\"]) == {\"box\"}, \"should be {'box'}\"","solution":"def shared_toys(a, b):\n    return set(a) & set(b)"},{"id":"python.3.1.n2","hint":"{} is a dict — an empty set is set().","kind":"order","q":"Write `unique_count(words)` that returns how many DIFFERENT words there are.","pieces":["        return len(seen)","        seen.add(w)","    seen = set()","def unique_count(words):","    for w in words:","    return len(seen)","    seen = {}"],"tests":"assert unique_count([\"a\", \"b\", \"a\"]) == 2, \"unique_count(['a', 'b', 'a']) should be 2\"\nassert unique_count([]) == 0, \"unique_count([]) should be 0\"","setup":"","solution":"def unique_count(words):\n    seen = set()\n    for w in words:\n        seen.add(w)\n    return len(seen)"}]},{"title":"is vs ==","teach":{"text":"== asks \"same value?\", is asks \"the very same object?\". Two lists built separately can be == without being is. Use is only for None (if x is None). An empty list is falsy, but it is not None.","code":"a = [1]\nb = [1]\nprint(a == b, a is b)   # True False\nc = a\nprint(c is a)           # True  (same object)\nx = []\nprint(bool(x), x is None)  # False False\nif x is not None:\n    print(\"x exists, even though it is empty\")"},"ex":[{"id":"python.3.2.0","hint":"","kind":"output","q":"What does this print?","code":"a = \"cat\"\nb = \"cat\"\nprint(a == b)","accept":["True"],"solution":"True"},{"id":"python.3.2.1","hint":"Two separate list objects.","kind":"output","q":"What does this print?","code":"a = [1]\nb = [1]\nprint(a is b)","accept":["False"],"solution":"False"},{"id":"python.3.2.2","hint":"","kind":"write","q":"The right way to test for None:","code":"","accept":["if x is None:","if x is None","x is None"],"solution":"if x is None:"},{"id":"python.3.2.3","hint":"","kind":"output","q":"What does this print?","code":"a = None\nprint(a is None, a == 0)","accept":["True False"],"solution":"True False"},{"id":"python.3.2.4","hint":"","kind":"output","q":"What does this print?","code":"x = []\nprint(bool(x), x is None)","accept":["False False"],"solution":"False False"},{"id":"python.3.2.n1","hint":"None is falsy too, so check \"is None\" first.","kind":"code","q":"Write `describe(x)` that returns \"missing\" if x is None, \"empty\" if x is any other falsy value (like [] or \"\"), and \"ok\" otherwise.","setup":"","starter":"def describe(x):\n    ","tests":"assert describe(None) == \"missing\", \"describe(None) should be 'missing'\"\nassert describe([]) == \"empty\", \"describe([]) should be 'empty'\"\nassert describe(\"\") == \"empty\", \"describe('') should be 'empty'\"\nassert describe([0]) == \"ok\", \"describe([0]) should be 'ok'\"","solution":"def describe(x):\n    if x is None:\n        return \"missing\"\n    if not x:\n        return \"empty\"\n    return \"ok\""}]},{"title":"default argument trap","teach":{"text":"A default value is made ONCE, when def runs — so a default list is shared by every call. Use None as the default and create a fresh list inside. *args gathers extra positional arguments into a tuple, **kw gathers keyword arguments into a dict.","code":"def add(x, lst=None):\n    if lst is None:\n        lst = []          # a fresh list on every call\n    lst.append(x)\n    return lst\nprint(add(1), add(2))     # [1] [2]\ndef f(*args, **kw):\n    return args, kw\nprint(f(1, 2, a=3))       # ((1, 2), {'a': 3})"},"ex":[{"id":"python.3.3.0","hint":"The default list is created ONCE and shared between calls.","kind":"output","q":"What does this print?","code":"def f(x, lst=[]):\n    lst.append(x)\n    return lst\nprint(f(1))\nprint(f(2))","accept":["[1] then [1, 2]"],"solution":"[1] then [1, 2]"},{"id":"python.3.3.2","hint":"","kind":"output","q":"What does this print?","code":"def f(n=5):\n    return n * 2\nprint(f(), f(1))","accept":["10 2"],"solution":"10 2"},{"id":"python.3.3.3","hint":"","kind":"output","q":"What does this print?","code":"def f(*args):\n    return len(args)\nprint(f(1, 2, 3))","accept":["3"],"solution":"3"},{"id":"python.3.3.4","hint":"","kind":"output","q":"What does this print?","code":"def f(**kw):\n    return kw\nprint(f(a=1))","accept":["{'a': 1}"],"solution":"{'a': 1}"},{"id":"python.3.3.n1","hint":"if box is None: box = []","kind":"code","q":"Write `add_toy(toy, box=None)` that appends toy to box and returns box. With no box given, it must start from a NEW empty list every call.","setup":"","starter":"def add_toy(toy, box=None):\n    ","tests":"assert add_toy(\"ball\") == [\"ball\"], \"add_toy('ball') should be ['ball']\"\nassert add_toy(\"mouse\") == [\"mouse\"], \"calls without a box must not share one list\"\nb = [\"x\"]\nassert add_toy(\"y\", b) == [\"x\", \"y\"], \"add_toy('y', ['x']) should be ['x', 'y']\"","solution":"def add_toy(toy, box=None):\n    if box is None:\n        box = []\n    box.append(toy)\n    return box"},{"id":"python.3.3.n2","hint":"Remember to hand the answer back with return.","kind":"order","q":"Write `total(*nums)` that adds up however many numbers it is given.","pieces":["    print(s)","    for n in nums:","        s = n","def total(*nums):","    s = 0","    return s","        s += n"],"tests":"assert total(1, 2, 3) == 6, \"total(1, 2, 3) should be 6\"\nassert total() == 0, \"total() should be 0\"","setup":"","solution":"def total(*nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s"}]}]},{"title":"Errors & Classes","lessons":[{"title":"try / except","teach":{"text":"Code in try runs until something goes wrong; Python then jumps to the matching except and carries on after it. finally runs no matter what. Know the usual suspects: KeyError (missing dict key), IndexError (position past the end), ValueError (bad value, like int(\"a\")) and ZeroDivisionError.","code":"try:\n    n = int(\"abc\")      # ValueError happens here...\n    print(\"never runs\") # ...so this line is skipped\nexcept ValueError:\n    n = 0\nfinally:\n    print(\"done\")       # always runs\nprint(n)                # 0"},"ex":[{"id":"python.4.0.0","hint":"","kind":"output","q":"What does this print?","code":"try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    print(\"oops\")","accept":["oops"],"solution":"oops"},{"id":"python.4.0.1","hint":"","kind":"output","q":"What does this print?","code":"try:\n    x = int(\"a\")\nexcept ValueError:\n    x = -1\nprint(x)","accept":["-1"],"solution":"-1"},{"id":"python.4.0.2","hint":"finally always runs.","kind":"output","q":"What does this print?","code":"try:\n    print(\"a\")\nfinally:\n    print(\"b\")","accept":["a then b"],"solution":"a then b"},{"id":"python.4.0.3","hint":"","kind":"write","q":"What error does this raise?","code":"d = {\"a\": 1}\nprint(d[\"b\"])","accept":["KeyError","a KeyError"],"solution":"KeyError"},{"id":"python.4.0.4","hint":"","kind":"write","q":"What error does this raise?","code":"lst = [1, 2]\nprint(lst[5])","accept":["IndexError","an IndexError"],"solution":"IndexError"},{"id":"python.4.0.n1","hint":"try the conversion, catch ValueError.","kind":"code","q":"Write `safe_int(text)` that returns int(text), or None if text isn't a whole number.","setup":"","starter":"def safe_int(text):\n    ","tests":"assert safe_int(\"12\") == 12, \"safe_int('12') should be 12\"\nassert safe_int(\"-3\") == -3, \"safe_int('-3') should be -3\"\nassert safe_int(\"cat\") is None, \"safe_int('cat') should be None\"\nassert safe_int(\"\") is None, \"safe_int('') should be None\"","solution":"def safe_int(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None"},{"id":"python.4.0.n2","hint":"Dividing by zero raises ZeroDivisionError.","kind":"order","q":"Write `safe_div(a, b)` that returns a / b, or None when b is 0.","pieces":["    try:","        return a / b","        return None","    except ValueError:","    except ZeroDivisionError:","def safe_div(a, b):"],"tests":"assert safe_div(6, 3) == 2.0, \"safe_div(6, 3) should be 2.0\"\nassert safe_div(1, 0) is None, \"safe_div(1, 0) should be None\"","setup":"","solution":"def safe_div(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None"}]},{"title":"classes","teach":{"text":"A class is a blueprint; calling it, as in Cat(\"Mia\"), builds an object and runs __init__. Every method takes self first, and self.name = ... stores data on THAT object. A class attribute (written in the class, outside methods) is shared by all objects.","code":"class Cat:\n    legs = 4                    # shared by every Cat\n    def __init__(self, name):\n        self.name = name        # stored on this cat\n    def speak(self):\n        return self.name + \" says meow\"\nc = Cat(\"Mia\")\nprint(c.speak())                # Mia says meow\nprint(Cat.legs, c.legs)         # 4 4"},"ex":[{"id":"python.4.1.0","hint":"","kind":"output","q":"What does this print?","code":"class Cat:\n    def __init__(self, name):\n        self.name = name\nc = Cat(\"Mia\")\nprint(c.name)","accept":["Mia"],"solution":"Mia"},{"id":"python.4.1.2","hint":"legs is a class attribute.","kind":"output","q":"What does this print?","code":"class Cat:\n    legs = 4\nprint(Cat.legs)","accept":["4"],"solution":"4"},{"id":"python.4.1.3","hint":"","kind":"output","q":"What does this print?","code":"class Cat:\n    def speak(self):\n        return \"meow\"\nprint(Cat().speak())","accept":["meow"],"solution":"meow"},{"id":"python.4.1.4","hint":"b is another name for the same object.","kind":"output","q":"What does this print?","code":"class Cat:\n    def __init__(self):\n        self.n = 0\na = Cat(); b = a\nb.n = 5\nprint(a.n)","accept":["5"],"solution":"5"},{"id":"python.4.1.n1","hint":"Store the number on self in __init__ and change self.count in the methods.","kind":"code","q":"Write a class `Counter` whose objects have `count` starting at 0, a method `click()` that adds 1, and a method `reset()` that sets it back to 0. Each Counter keeps its own count.","setup":"","starter":"class Counter:\n    ","tests":"c = Counter()\nassert c.count == 0, \"a new Counter should have count 0\"\nc.click(); c.click()\nassert c.count == 2, \"after two clicks count should be 2\"\nd = Counter()\nassert d.count == 0, \"each Counter needs its own count (use self.count in __init__)\"\nc.reset()\nassert c.count == 0, \"reset() should set count back to 0\"","solution":"class Counter:\n    def __init__(self):\n        self.count = 0\n    def click(self):\n        self.count += 1\n    def reset(self):\n        self.count = 0"},{"id":"python.4.1.n2","hint":"Every method takes self, and data lives on self.","kind":"order","q":"Build a Cat class whose greet() returns \"Meow, I am \" plus the cat's name.","pieces":["        return \"Meow, I am \" + self.name","    def greet():","    def greet(self):","        name = name","    def __init__(self, name):","        self.name = name","class Cat:"],"tests":"assert Cat(\"Mia\").greet() == \"Meow, I am Mia\", \"Cat('Mia').greet() should be 'Meow, I am Mia'\"","setup":"","solution":"class Cat:\n    def __init__(self, name):\n        self.name = name\n    def greet(self):\n        return \"Meow, I am \" + self.name"}]},{"title":"imports & modules","teach":{"text":"import math gives you math.sqrt, math.pi and friends; from math import sqrt lets you write sqrt directly; import pandas as pd sets a short alias. When a file is run directly its __name__ is \"__main__\".","code":"import math\nprint(math.pi)              # 3.141592653589793\nfrom math import sqrt\nprint(sqrt(16))             # 4.0  (always a float)\nimport random\nprint(random.randint(1, 6)) # 1 to 6, both ends included\nprint(__name__)             # __main__"},"ex":[{"id":"python.4.2.0","hint":"","kind":"write","q":"Import the math module and use pi:","code":"","accept":["import math\nmath.pi"],"solution":"import math\nmath.pi"},{"id":"python.4.2.1","hint":"sqrt returns a float.","kind":"output","q":"What does this print?","code":"from math import sqrt\nprint(sqrt(16))","accept":["4.0"],"solution":"4.0"},{"id":"python.4.2.2","hint":"randint includes both ends.","kind":"output","q":"What does this print?","code":"import random\nx = random.randint(1, 1)\nprint(x)","accept":["1"],"solution":"1"},{"id":"python.4.2.4","hint":"When a file is run directly, __name__ is \"__main__\".","kind":"output","q":"What does this print?","code":"print(__name__)","accept":["__main__"],"solution":"__main__"},{"id":"python.4.2.n1","hint":"math.pi * r ** 2, then round(..., 2).","kind":"code","q":"Using the math module, write `circle_area(r)` that returns pi × r², rounded to 2 decimal places.","setup":"","starter":"import math\n\ndef circle_area(r):\n    ","tests":"assert circle_area(1) == 3.14, \"circle_area(1) should be 3.14\"\nassert circle_area(2) == 12.57, \"circle_area(2) should be 12.57 (use math.pi, not 3.14)\"\nassert circle_area(0) == 0, \"circle_area(0) should be 0\"","solution":"import math\n\ndef circle_area(r):\n    return round(math.pi * r ** 2, 2)"}]},{"title":"exam mix","teach":{"text":"A mixed review of earlier traps: slices make new objects, [::-1] reverses, sum() happily takes a generator expression, and d.get(key, 0) + 1 is the classic counting pattern.","code":"s = \"abc\"\nprint(s[::-1] * 2)            # cbacba\nx = [1, 2, 3]; y = x\nx = x[1:]                     # new list; y is still [1, 2, 3]\nprint(sum(i for i in range(4)))   # 0+1+2+3 = 6\nd = {}\nfor c in \"aab\":\n    d[c] = d.get(c, 0) + 1    # {'a': 2, 'b': 1}"},"ex":[{"id":"python.4.3.0","hint":"","kind":"output","q":"What does this print?","code":"s = \"abc\"\nprint(s[::-1] * 2)","accept":["cbacba"],"solution":"cbacba"},{"id":"python.4.3.1","hint":"Slicing creates a new list; y still points at the old one.","kind":"output","q":"What does this print?","code":"x = [1, 2, 3]\ny = x\nx = x[1:]\nprint(y)","accept":["[1, 2, 3]"],"solution":"[1, 2, 3]"},{"id":"python.4.3.2","hint":"","kind":"output","q":"What does this print?","code":"print(sum(i for i in range(4)))","accept":["6"],"solution":"6"},{"id":"python.4.3.3","hint":"","kind":"output","q":"What does this print?","code":"d = {}\nfor c in \"aab\":\n    d[c] = d.get(c, 0) + 1\nprint(d)","accept":["{'a': 2, 'b': 1}"],"solution":"{'a': 2, 'b': 1}"},{"id":"python.4.3.4","hint":"","kind":"output","q":"What does this print?","code":"print(\"3\" * 2 + str(3 * 2))","accept":["336"],"solution":"336"},{"id":"python.4.3.n1","hint":"Count with a dict first, then find the key with the biggest count.","kind":"code","q":"Write `most_common(words)` that returns the word appearing most often in a non-empty list (any one of them if there is a tie).","setup":"","starter":"def most_common(words):\n    ","tests":"assert most_common([\"a\", \"b\", \"a\"]) == \"a\", \"most_common(['a', 'b', 'a']) should be 'a'\"\nassert most_common([\"cat\"]) == \"cat\", \"most_common(['cat']) should be 'cat'\"\nassert most_common([\"x\", \"y\", \"y\", \"z\", \"y\"]) == \"y\", \"most_common(['x', 'y', 'y', 'z', 'y']) should be 'y'\"","solution":"def most_common(words):\n    counts = {}\n    for w in words:\n        counts[w] = counts.get(w, 0) + 1\n    best = words[0]\n    for w in counts:\n        if counts[w] > counts[best]:\n            best = w\n    return best"}]}]},{"title":"Files & Iteration Tools","lessons":[{"title":"reading files","teach":{"text":"with open(path) as f: opens a file and closes it for you when the block ends. \"for line in f\" reads one line at a time, and each line keeps its \"\\n\" — so .strip() it. Mode \"w\" overwrites the file, \"a\" appends; read() gives one string, readlines() a list of lines.","code":"with open(\"cats.txt\", \"w\") as f:   # \"w\" = overwrite\n    f.write(\"Tom\\nMia\\n\")\nwith open(\"cats.txt\") as f:        # default mode \"r\" = read\n    for line in f:\n        print(line.strip())        # Tom / Mia  (no extra blank lines)\n# the file is closed automatically here"},"ex":[{"id":"python.5.0.0","hint":"with closes the file automatically.","kind":"write","q":"The recommended way to open a file:","code":"","accept":["with open(\"a.txt\") as f:\n    data = f.read()"],"solution":"with open(\"a.txt\") as f:\n    data = f.read()"},{"id":"python.5.0.2","hint":"\"w\" overwrites, \"a\" appends.","kind":"write","q":"What does this do?","code":"with open(\"a.txt\", \"w\") as f:\n    f.write(\"hi\")","accept":["Creates/overwrites a.txt with \"hi\""],"solution":"Creates/overwrites a.txt with \"hi\""},{"id":"python.5.0.3","hint":"","kind":"write","q":"Start a loop over the open file f, one line at a time (loop variable line):","code":"","accept":["for line in f:","for line in f"],"solution":"for line in f:"},{"id":"python.5.0.4","hint":".strip() removes whitespace including \\n.","kind":"output","q":"What does this print?","code":"line = \"cat\\n\"\nprint(line.strip())","accept":["cat"],"solution":"cat"},{"id":"python.5.0.n1","hint":"Strip each line, and skip it if nothing is left.","kind":"code","q":"A file named pets.txt exists (one name per line, with a blank line in the middle). Write `read_names(path)` that returns a list of the names with no \"\\n\" and no empty entries.","setup":"with open(\"pets.txt\", \"w\") as f:\n    f.write(\"Tom\\nMia\\n\\nLeo\\n\")","starter":"def read_names(path):\n    ","tests":"assert read_names(\"pets.txt\") == [\"Tom\", \"Mia\", \"Leo\"], \"read_names('pets.txt') should be ['Tom', 'Mia', 'Leo'], got \" + repr(read_names(\"pets.txt\"))","solution":"def read_names(path):\n    names = []\n    with open(path) as f:\n        for line in f:\n            line = line.strip()\n            if line:\n                names.append(line)\n    return names"}]},{"title":"enumerate & zip","teach":{"text":"enumerate(xs) gives (position, item) pairs, starting at 0 unless you pass a start number. zip(a, b) pairs items up and stops at the SHORTEST input; dict(zip(keys, values)) builds a dict.","code":"for i, name in enumerate([\"Tom\", \"Mia\"], 1):\n    print(i, name)                  # 1 Tom / 2 Mia\nprint(list(zip([1, 2, 3], \"ab\")))   # [(1, 'a'), (2, 'b')]\nages = dict(zip([\"Tom\", \"Mia\"], [3, 5]))\nprint(ages[\"Mia\"])                  # 5"},"ex":[{"id":"python.5.1.0","hint":"","kind":"output","q":"What does this print?","code":"for i, c in enumerate(\"ab\"):\n    print(i, c)","accept":["0 a then 1 b"],"solution":"0 a then 1 b"},{"id":"python.5.1.1","hint":"","kind":"output","q":"What does this print?","code":"for a, b in zip([1, 2], [\"x\", \"y\"]):\n    print(a, b)","accept":["1 x then 2 y"],"solution":"1 x then 2 y"},{"id":"python.5.1.2","hint":"zip stops at the shortest.","kind":"output","q":"What does this print?","code":"print(list(zip([1, 2, 3], \"ab\")))","accept":["[(1, 'a'), (2, 'b')]"],"solution":"[(1, 'a'), (2, 'b')]"},{"id":"python.5.1.3","hint":"","kind":"write","q":"Enumerate the list xs, counting from 1:","code":"","accept":["enumerate(xs, 1)","enumerate(xs, start=1)"],"solution":"enumerate(xs, 1)"},{"id":"python.5.1.4","hint":"","kind":"output","q":"What does this print?","code":"d = dict(zip(\"ab\", [1, 2]))\nprint(d[\"b\"])","accept":["2"],"solution":"2"},{"id":"python.5.1.n1","hint":"enumerate(names, 1) starts counting at 1.","kind":"code","q":"Write `rank_list(names)` that returns strings like \"1. Tom\" for each name, numbered from 1.","setup":"","starter":"def rank_list(names):\n    ","tests":"assert rank_list([\"Tom\", \"Mia\"]) == [\"1. Tom\", \"2. Mia\"], \"rank_list(['Tom', 'Mia']) should be ['1. Tom', '2. Mia']\"\nassert rank_list([]) == [], \"rank_list([]) should be []\"","solution":"def rank_list(names):\n    return [f\"{i}. {n}\" for i, n in enumerate(names, 1)]"},{"id":"python.5.1.n2","hint":"max over a dict looks at the keys — use key= to compare by age.","kind":"order","q":"Pair up names and ages into a dict, then find the name of the oldest cat.","pieces":["d = dict(zip(names, ages))","oldest = max(d)","ages = [5, 2, 9]","names = [\"Tom\", \"Mia\", \"Leo\"]","oldest = max(d, key=d.get)"],"tests":"assert oldest == \"Leo\", \"oldest should be Leo\"","setup":"","solution":"names = [\"Tom\", \"Mia\", \"Leo\"]\nages = [5, 2, 9]\nd = dict(zip(names, ages))\noldest = max(d, key=d.get)"}]},{"title":"lambda & sorted","teach":{"text":"lambda x: ... is a tiny nameless function. sorted(), .sort(), max() and min() accept key= — a function applied to each item to decide the order — but they still return the original items. reverse=True flips the order.","code":"cats = [(\"Tom\", 5), (\"Mia\", 2), (\"Leo\", 9)]\nprint(sorted(cats, key=lambda c: c[1]))\n# [('Mia', 2), ('Tom', 5), ('Leo', 9)]\nprint(max([\"aa\", \"b\", \"ccc\"], key=len))   # ccc (not 3)\nprint(sorted([3, 1, 2], reverse=True))    # [3, 2, 1]"},"ex":[{"id":"python.5.2.0","hint":"","kind":"output","q":"What does this print?","code":"f = lambda x: x * 2\nprint(f(4))","accept":["8"],"solution":"8"},{"id":"python.5.2.1","hint":"","kind":"write","q":"Sort the list words by length:","code":"","accept":["sorted(words, key=len)","words.sort(key=len)"],"solution":"sorted(words, key=len)"},{"id":"python.5.2.2","hint":"","kind":"output","q":"What does this print?","code":"pairs = [(1, \"b\"), (2, \"a\")]\nprint(sorted(pairs, key=lambda p: p[1]))","accept":["[(2, 'a'), (1, 'b')]"],"solution":"[(2, 'a'), (1, 'b')]"},{"id":"python.5.2.3","hint":"","kind":"write","q":"Sort the list xs in descending order:","code":"","accept":["sorted(xs, reverse=True)","xs.sort(reverse=True)"],"solution":"sorted(xs, reverse=True)"},{"id":"python.5.2.4","hint":"","kind":"output","q":"What does this print?","code":"print(max([\"aa\", \"b\", \"ccc\"], key=len))","accept":["ccc"],"solution":"ccc"},{"id":"python.5.2.n1","hint":"sorted with key=lambda c: c[1] and reverse=True, then keep the names.","kind":"code","q":"cats is a list of (name, age) tuples. Write `by_age(cats)` that returns just the names, sorted from oldest to youngest.","setup":"","starter":"def by_age(cats):\n    ","tests":"assert by_age([(\"Tom\", 5), (\"Mia\", 2), (\"Leo\", 9)]) == [\"Leo\", \"Tom\", \"Mia\"], \"should be ['Leo', 'Tom', 'Mia']\"\nassert by_age([(\"Ada\", 1), (\"Zed\", 3)]) == [\"Zed\", \"Ada\"], \"should be ['Zed', 'Ada']\"\nassert by_age([]) == [], \"by_age([]) should be []\"","solution":"def by_age(cats):\n    return [name for name, age in sorted(cats, key=lambda c: c[1], reverse=True)]"}]},{"title":"generators-lite","teach":{"text":"A generator hands out values one at a time instead of building a whole list: write (x * x for x in xs) or a function that uses yield. It can only be looped over ONCE. any() is True if at least one item is true; all() is True unless some item is false — so all([]) is True and any([]) is False.","code":"def countdown(n):\n    while n > 0:\n        yield n        # pause here and hand out n\n        n -= 1\nprint(list(countdown(3)))   # [3, 2, 1]\ng = (x * x for x in range(3))\nprint(sum(g), sum(g))       # 5 0  (used up after the first sum)\nprint(any([]), all([]))     # False True"},"ex":[{"id":"python.5.3.0","hint":"Round brackets make a generator expression.","kind":"output","q":"What does this print?","code":"g = (x * x for x in range(3))\nprint(list(g))","accept":["[0, 1, 4]"],"solution":"[0, 1, 4]"},{"id":"python.5.3.1","hint":"","kind":"output","q":"What does this print?","code":"print(any(x > 2 for x in [1, 2, 3]))","accept":["True"],"solution":"True"},{"id":"python.5.3.2","hint":"all() of nothing is True.","kind":"output","q":"What does this print?","code":"print(all(x > 0 for x in []))","accept":["True"],"solution":"True"},{"id":"python.5.3.3","hint":"","kind":"output","q":"What does this print?","code":"def gen():\n    yield 1\n    yield 2\nprint(sum(gen()))","accept":["3"],"solution":"3"},{"id":"python.5.3.4","hint":"","kind":"write","q":"A generator can be iterated…","code":"","accept":["once","only once","one time","1 time"],"solution":"once"},{"id":"python.5.3.n1","hint":"range stops BEFORE its end, so go to n + 1.","kind":"code","q":"Write a GENERATOR function `evens_up_to(n)` that yields 0, 2, 4, … up to and including n.","setup":"","starter":"def evens_up_to(n):\n    ","tests":"import types\nassert isinstance(evens_up_to(4), types.GeneratorType), \"use yield to make a generator\"\nassert list(evens_up_to(6)) == [0, 2, 4, 6], \"evens_up_to(6) should give 0, 2, 4, 6\"\nassert list(evens_up_to(5)) == [0, 2, 4], \"evens_up_to(5) should give 0, 2, 4\"\nassert list(evens_up_to(0)) == [0], \"evens_up_to(0) should give just 0\"","solution":"def evens_up_to(n):\n    for i in range(0, n + 1, 2):\n        yield i"},{"id":"python.5.3.n2","hint":"yield hands out a value and keeps going; return would stop.","kind":"order","q":"Write a generator `countdown(n)` that yields n, n-1, … down to 1.","pieces":["    while n > 0:","        n -= 1","    while n >= 0:","        return n","        yield n","def countdown(n):"],"tests":"assert list(countdown(3)) == [3, 2, 1], \"countdown(3) should give 3, 2, 1\"\nassert list(countdown(0)) == [], \"countdown(0) should give nothing\"","setup":"","solution":"def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1"}]}]},{"title":"Pandas Basics","lessons":[{"title":"DataFrame","teach":{"text":"A DataFrame is a table: rows plus named columns. Read one with pd.read_csv, peek with df.head(), and pick one column with df[\"age\"] (that gives a Series). df.shape is an attribute — no brackets — holding (rows, columns).","code":"import pandas as pd\ndf = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\"],\n                   \"age\": [5, 2, 9]})\n# or: df = pd.read_csv(\"cats.csv\")\nprint(df.shape)          # (3, 2)\nprint(len(df))           # 3 rows\nprint(df[\"age\"].max())   # 9\ndf.head()                # the first 5 rows"},"ex":[{"id":"python.6.0.1","hint":"","kind":"write","q":"Read the CSV file cats.csv with pandas (as pd):","code":"","accept":["pd.read_csv(\"cats.csv\")","pd.read_csv('cats.csv')"],"solution":"pd.read_csv(\"cats.csv\")"},{"id":"python.6.0.2","hint":"","kind":"write","q":"First 5 rows of df:","code":"","accept":["df.head()","df.head(5)","df.head(n=5)","df.iloc[:5]","df[:5]"],"solution":"df.head()"},{"id":"python.6.0.3","hint":"","kind":"write","q":"The age column of df:","code":"","accept":["df[\"age\"]","df['age']","df.age"],"solution":"df[\"age\"]"},{"id":"python.6.0.4","hint":"","kind":"write","q":"Number of rows and columns of df (one attribute):","code":"","accept":["df.shape"],"solution":"df.shape"},{"id":"python.6.0.n1","hint":"len(df) or df.shape[0]; one column is df[\"age\"].","kind":"code","q":"pandas is imported as pd and a DataFrame df (columns name, age, colour, city) exists. Make `n_cats` the number of rows and `ages` the age column (a Series).","setup":"import pandas as pd\ndf = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\", \"Kit\", \"Sox\"], \"age\": [5, 2, 8, 4, 8], \"colour\": [\"white\", \"white\", \"black\", \"white\", \"black\"], \"city\": [\"Leeds\", \"York\", \"Leeds\", \"York\", \"Leeds\"]})","starter":"","tests":"assert n_cats == 5, \"n_cats should be 5 (the number of rows)\"\nassert isinstance(ages, pd.Series), \"ages should be one column: df['age']\"\nassert list(ages) == [5, 2, 8, 4, 8], \"ages should hold the age column\"","solution":"n_cats = len(df)\nages = df[\"age\"]"}]},{"title":"filtering","teach":{"text":"df[condition] keeps the ROWS where the condition is True. Combine conditions with & (and) or | (or), each wrapped in brackets — Python's and/or don't work on columns. Double brackets df[[\"a\", \"b\"]] pick several columns, and .isna() finds missing values.","code":"old = df[df[\"age\"] > 3]                           # rows, not columns\nold_white = df[(df[\"age\"] > 3) & (df[\"colour\"] == \"white\")]\ntwo_cols = df[[\"name\", \"age\"]]                    # a list of column names\nby_age = df.sort_values(\"age\", ascending=False)   # oldest first\nno_city = df[df[\"city\"].isna()]"},"ex":[{"id":"python.6.1.0","hint":"","kind":"write","q":"Rows of df where age > 3:","code":"","accept":["df[df[\"age\"] > 3]","df[df['age'] > 3]","df[df.age > 3]","df.loc[df[\"age\"] > 3]","df.loc[df['age'] > 3]","df.query(\"age > 3\")","df.query('age > 3')"],"solution":"df[df[\"age\"] > 3]"},{"id":"python.6.1.1","hint":"Use & and | with brackets, not and/or.","kind":"write","q":"Two conditions:","code":"","accept":["df[(df[\"age\"] > 3) & (df[\"colour\"] == \"white\")]"],"solution":"df[(df[\"age\"] > 3) & (df[\"colour\"] == \"white\")]"},{"id":"python.6.1.2","hint":"","kind":"write","q":"Select columns name and age of df:","code":"","accept":["df[[\"name\", \"age\"]]","df[['name', 'age']]"],"solution":"df[[\"name\", \"age\"]]"},{"id":"python.6.1.3","hint":"","kind":"write","q":"Sort df by age, oldest first:","code":"","accept":["df.sort_values(\"age\", ascending=False)","df.sort_values('age', ascending=False)","df.sort_values(by=\"age\", ascending=False)","df.sort_values(by='age', ascending=False)"],"solution":"df.sort_values(\"age\", ascending=False)"},{"id":"python.6.1.4","hint":"","kind":"write","q":"Rows of df with a missing city:","code":"","accept":["df[df[\"city\"].isna()]","df[df['city'].isna()]","df[df[\"city\"].isnull()]","df[df['city'].isnull()]","df[df.city.isna()]","df[df.city.isnull()]"],"solution":"df[df[\"city\"].isna()]"},{"id":"python.6.1.n1","hint":"Two conditions in brackets joined with &, then take [\"name\"] and wrap in list().","kind":"code","q":"pandas is imported as pd and a DataFrame df (columns name, age, colour, city) exists. Make `picks` a plain list of the names of cats that are older than 3 AND white.","setup":"import pandas as pd\ndf = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\", \"Kit\", \"Sox\"], \"age\": [5, 2, 8, 4, 8], \"colour\": [\"white\", \"white\", \"black\", \"white\", \"black\"], \"city\": [\"Leeds\", \"York\", \"Leeds\", \"York\", \"Leeds\"]})","starter":"","tests":"assert picks == [\"Tom\", \"Kit\"], \"picks should be ['Tom', 'Kit'], got \" + repr(picks)","solution":"picks = list(df[(df[\"age\"] > 3) & (df[\"colour\"] == \"white\")][\"name\"])"},{"id":"python.6.1.n2","hint":"The condition goes INSIDE df[...] to pick rows.","kind":"order","q":"Find the names of the cats older than 3.","pieces":["old = df[\"age\"] > 3","old = df[df[\"age\"] > 3]","names = list(old[\"name\"])","import pandas as pd","df = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\"], \"age\": [5, 2, 9]})"],"tests":"assert names == [\"Tom\", \"Leo\"], \"names should be ['Tom', 'Leo']\"","setup":"","solution":"import pandas as pd\ndf = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\"], \"age\": [5, 2, 9]})\nold = df[df[\"age\"] > 3]\nnames = list(old[\"name\"])"}]},{"title":"summaries","teach":{"text":"Column methods summarise: .mean(), .max(), .value_counts() (how often each value appears). df.groupby(\"city\")[\"age\"].mean() splits the rows by city and gives one mean per group. Make a new column by assigning to it — the maths runs on the whole column at once.","code":"print(df[\"age\"].mean())                   # one number\nprint(df[\"colour\"].value_counts())        # white 3, black 2\nprint(df.groupby(\"city\")[\"age\"].mean())   # one mean per city\ndf[\"age_months\"] = df[\"age\"] * 12         # whole column at once\ndf.describe()                             # count, mean, std, min..."},"ex":[{"id":"python.6.2.0","hint":"","kind":"write","q":"Average of the age column of df:","code":"","accept":["df[\"age\"].mean()","df['age'].mean()","df.age.mean()"],"solution":"df[\"age\"].mean()"},{"id":"python.6.2.1","hint":"","kind":"write","q":"Count of cats per colour (column colour of df):","code":"","accept":["df[\"colour\"].value_counts()","df['colour'].value_counts()","df.colour.value_counts()"],"solution":"df[\"colour\"].value_counts()"},{"id":"python.6.2.2","hint":"","kind":"write","q":"Mean age per city in df:","code":"","accept":["df.groupby(\"city\")[\"age\"].mean()","df.groupby('city')['age'].mean()","df.groupby(\"city\").age.mean()","df.groupby('city').age.mean()"],"solution":"df.groupby(\"city\")[\"age\"].mean()"},{"id":"python.6.2.3","hint":"","kind":"write","q":"Quick statistics for every numeric column of df:","code":"","accept":["df.describe()"],"solution":"df.describe()"},{"id":"python.6.2.4","hint":"","kind":"write","q":"Add a column age_months (age × 12) to df:","code":"","accept":["df[\"age_months\"] = df[\"age\"] * 12","df['age_months'] = df['age'] * 12","df[\"age_months\"] = df.age * 12","df[\"age_months\"] = 12 * df[\"age\"]"],"solution":"df[\"age_months\"] = df[\"age\"] * 12"},{"id":"python.6.2.n1","hint":"groupby(\"city\")[\"age\"].mean(); a comparison on a column gives a True/False column.","kind":"code","q":"pandas is imported as pd and a DataFrame df (columns name, age, colour, city) exists. Make `avg_age` the mean age per city (a Series indexed by city), and add a column `senior` that is True when age is 8 or more.","setup":"import pandas as pd\ndf = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\", \"Kit\", \"Sox\"], \"age\": [5, 2, 8, 4, 8], \"colour\": [\"white\", \"white\", \"black\", \"white\", \"black\"], \"city\": [\"Leeds\", \"York\", \"Leeds\", \"York\", \"Leeds\"]})","starter":"","tests":"assert avg_age[\"Leeds\"] == 7.0 and avg_age[\"York\"] == 3.0, \"avg_age should be the mean age per city (Leeds 7.0, York 3.0)\"\nassert df[\"senior\"].tolist() == [False, False, True, False, True], \"senior should be True only where age >= 8\"","solution":"avg_age = df.groupby(\"city\")[\"age\"].mean()\ndf[\"senior\"] = df[\"age\"] >= 8"},{"id":"python.6.2.n2","hint":"== compares; = assigns. Filter first, then average.","kind":"order","q":"Work out the average age of the white cats.","pieces":["avg = df[\"age\"].mean()","avg = white[\"age\"].mean()","white = df[df[\"colour\"] = \"white\"]","df = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\"], \"colour\": [\"white\", \"black\", \"white\"], \"age\": [5, 2, 9]})","white = df[df[\"colour\"] == \"white\"]"],"tests":"assert avg == 7.0, \"avg should be 7.0 (the mean of 5 and 9)\"","setup":"import pandas as pd","solution":"df = pd.DataFrame({\"name\": [\"Tom\", \"Mia\", \"Leo\"], \"colour\": [\"white\", \"black\", \"white\"], \"age\": [5, 2, 9]})\nwhite = df[df[\"colour\"] == \"white\"]\navg = white[\"age\"].mean()"}]}]}]},{"key":"sql","name":"SQL","units":[{"title":"SELECT Basics","lessons":[{"title":"SELECT","teach":{"text":"SELECT picks columns, FROM picks the table. * means \"every column\"; list columns with commas to choose them (in the order you want). DISTINCT drops repeated rows.","code":"SELECT name, age FROM cats;   -- two columns, every row\n-- Luna | 3\n-- Milo | 7 …\n\nSELECT DISTINCT colour FROM cats;   -- each colour once\n-- black, orange, white, grey, tabby"},"ex":[{"id":"sql.0.0.0","hint":"SELECT * FROM cats;","kind":"query","q":"SELECT * FROM table returns every column. Return every column of the cats table.","pattern":"SELECT * FROM table;","sql":"SELECT * FROM cats","check":"","must":[],"solution":"SELECT * FROM cats"},{"id":"sql.0.0.1","hint":"SELECT column FROM table;","kind":"query","q":"Return only the name column from cats.","pattern":"","sql":"SELECT name FROM cats","check":"","must":[],"solution":"SELECT name FROM cats"},{"id":"sql.0.0.2","hint":"SELECT col1, col2 FROM cats;","kind":"query","q":"List several columns with commas: SELECT a, b FROM table. Return each cat's name and age (in that order).","pattern":"","sql":"SELECT name, age FROM cats","check":"","must":[],"solution":"SELECT name, age FROM cats"},{"id":"sql.0.0.3","hint
